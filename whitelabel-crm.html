<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="crm-page-title">CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: {
        brand: { DEFAULT:'#2E2318', cream:'#F2E9D0', soft:'rgba(46,35,24,0.08)' },
        accent: { DEFAULT:'#C17D3A', ink:'#A9661F', soft:'#F3E7D2' },
        canvas: '#F1ECE2',
      }}}
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
  <script src="https://unpkg.com/@remix-run/router@1.21.0/dist/router.umd.min.js"></script>
  <script src="https://unpkg.com/react-router@6.30.0/dist/umd/react-router.production.min.js"></script>
  <script src="https://unpkg.com/react-router-dom@6.30.0/dist/umd/react-router-dom.production.min.js"></script>
  <script src="https://unpkg.com/recharts@2.15.3/umd/Recharts.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- Data files: load from vendor if present, else fall back to empty defaults -->

  <script>window.INACTIVE_DATA=window.INACTIVE_DATA||{rows:[]};</script>
  <script src="vendor/inactive-data.js" onerror="void 0"></script>
  <script>window.CONTRACTOR_CONTACTS=window.CONTRACTOR_CONTACTS||[];</script>
  <script src="vendor/contractor-contacts.js" onerror="void 0"></script>
  <script>window.CRM_CONFIG=window.CRM_CONFIG||{};</script>
  <script src="vendor/crm-config.js" onerror="void 0"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
  :root {
    /* ── Shoyu Brand ─────────────────────────────────── */
    --brand:        #2E2318;   --brand-cream:  #F2E9D0;
    --accent:       #C17D3A;   --accent-ink:   #A9661F;
    --accent-soft:  #F3E7D2;

    /* ── Surfaces ─────────────────────────────────────── */
    --bg-page:      #F1ECE2;   --bg-surface:   #FFFFFF;
    --bg-subtle:    #FBF9F4;   --bg-hover:     #F4F0E8;

    /* ── Lines ────────────────────────────────────────── */
    --border-default: #D8CFBC; --border-strong: #C8BFB0;
    --divider:        #EEE8DC;

    /* ── Text ─────────────────────────────────────────── */
    --text-primary:   #2A2117;
    --text-secondary: #6E6151;
    --text-muted:     #9C8E7A;
    --ink-on-brand:   #F6EFDF;

    /* ── Semantic ─────────────────────────────────────── */
    --success:        #2F7D57;  --success-soft:    #E2F0E6;
    --attention:      #B57A1E;  --attention-soft:  #F6E9CF;
    --danger:         #B23A22;  --danger-soft:     #F6E0D8;
    --neutral:        #6E6151;  --neutral-soft:    #ECE6DA;

    /* ── Stage badges (mapped to Shoyu semantic palette) */
    --stage-won-bg:       #E2F0E6;  --stage-won-text:    #1F5C3C;  --stage-won-border:  #B8DCC4;
    --stage-amber-bg:     #F6E9CF;  --stage-amber-text:  #7A4F10;  --stage-amber-border:#E5C98A;
    --stage-lost-bg:      #F6E0D8;  --stage-lost-text:   #6E2010;  --stage-lost-border: #E8B9A8;
    --stage-new-bg:       #F3E7D2;  --stage-new-text:    #7A4F10;  --stage-new-border:  #DFC89A;
    --stage-mid-bg:       #F3E7D2;  --stage-mid-text:    #A9661F;  --stage-mid-border:  #DFC89A;

    /* ── Radius ───────────────────────────────────────── */
    --r-sm: 6px;  --r-md: 8px;  --r-lg: 10px;  --r-xl: 14px;  --r-pill: 999px;

    /* ── Elevation ────────────────────────────────────── */
    --shadow-sm: 0 1px 2px rgba(42,33,23,.06);
    --shadow-md: 0 2px 6px rgba(42,33,23,.08), 0 1px 2px rgba(42,33,23,.06);
    --shadow-lg: 0 10px 28px rgba(42,33,23,.14);
    --focus-ring: 0 0 0 3px rgba(193,125,58,.22);

    /* ── Typography ───────────────────────────────────── */
    --font-ui:      'Hanken Grotesk', system-ui, sans-serif;
    --font-display: 'Newsreader', Georgia, serif;
    --font-mono:    'Space Mono', ui-monospace, monospace;

    /* ── Legacy aliases (keep existing code working) ─── */
    --bright-purple:  #C17D3A;
    --lavender:       #D2A24C;
    --indigo:         #2E2318;
    --deep-purple:    #2A2117;
    --digital-indigo: #A9661F;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg-page);
    color: var(--text-primary);
    font-family: var(--font-ui);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #2E2318, #C17D3A, #D2A24C);
    pointer-events: none;
    z-index: 9999;
  }

  #crm-root { position: relative; z-index: 1; }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #D8CFBC; border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: #C17D3A; }

  .card {
    background: var(--bg-surface);
    border: 0.5px solid var(--border-default);
    border-radius: 12px;
  }

  .skeleton {
    background: linear-gradient(90deg, #EEEDF8 25%, #E2DFEF 50%, #EEEDF8 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 8px;
  }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

  .filter-input {
    background: var(--bg-surface);
    border: 0.5px solid var(--border-strong);
    color: var(--text-primary);
    border-radius: 8px;
    padding: 6px 12px;
    font-family: 'Poppins', system-ui, sans-serif;
    font-size: 13px;
  }
  .filter-input::placeholder { color: var(--text-muted); }
  .filter-input:focus { outline: none; border-color: var(--accent); box-shadow: var(--focus-ring); }
  .filter-input option { background: #fff; color: var(--text-primary); }

  .kanban-col {
    background: var(--bg-subtle);
    border: 0.5px solid var(--border-default);
    border-radius: 12px;
    min-height: 400px;
  }
  .kanban-card {
    background: var(--bg-surface);
    border: 0.5px solid var(--border-default);
    border-radius: 10px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .kanban-card:hover {
    border-color: var(--border-strong);
    background: #FAFAFE;
  }
  .kanban-card:hover .kanban-card-delete { display: flex !important; }
  .kanban-card.dragging { opacity: 0.5; transform: rotate(1deg); }
  .kanban-col.drag-over { border-color: var(--accent); background: var(--accent-soft); }
  .kanban-col.col-won { background: #EAF4EB; border-color: #C3E6CB; }
  .kanban-col.col-won .kanban-card { border-left: 2px solid #28a745; border-radius: 0 10px 10px 0; }

  .stage-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .tooltip-custom {
    background: #FFFFFF !important;
    border: 0.5px solid var(--border-strong) !important;
    border-radius: 8px !important;
    color: var(--text-primary) !important;
    box-shadow: 0 4px 16px rgba(26,22,48,0.1) !important;
  }

  .tab-ul { border-bottom: 0.5px solid var(--border-default); }
  .tab-btn {
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 500;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all .15s;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
  }
  .tab-btn:hover { color: var(--text-primary); }
  .tab-btn.active { border-bottom-color: var(--accent); color: var(--text-primary); }

  .toast { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
  .toast-item {
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-family: 'Poppins', sans-serif;
    box-shadow: 0 4px 16px rgba(26,22,48,0.12);
    animation: slideIn .25s ease;
  }
  @keyframes slideIn { from{transform:translateX(100%);opacity:0} to{transform:none;opacity:1} }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(26,22,48,0.5);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal {
    background: var(--bg-surface);
    border: 0.5px solid var(--border-default);
    border-radius: 16px;
    max-width: 560px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 8px 40px rgba(26,22,48,0.15);
  }
  .modal .text-white   { color: var(--text-primary) !important; }
  .modal .text-slate-400,
  .modal .text-slate-300,
  .modal .text-white\/70,
  .modal .text-white\/50,
  .modal .text-white\/40 { color: var(--text-secondary) !important; }
  .modal .text-slate-500 { color: var(--text-muted) !important; }

  .stage-step {
    flex: 1;
    text-align: center;
    padding: 6px 4px;
    font-size: 11px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: all .15s;
    border: 0.5px solid var(--border-default);
    font-family: 'Poppins', sans-serif;
    color: var(--text-secondary);
    background: var(--bg-subtle);
  }
  .stage-step:hover { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
  .stage-step.active { background: var(--brand); color: var(--brand-cream); border-color: var(--brand); }

  .stage-badge {
    display: inline-flex;
    align-items: center;
    font-size: 11px;
    font-weight: 500;
    padding: 2px 9px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .stage-identified  { background: var(--stage-new-bg);   color: var(--stage-new-text);   border: 0.5px solid var(--stage-new-border); }
  .stage-contacted   { background: var(--stage-mid-bg);   color: var(--stage-mid-text);   border: 0.5px solid var(--stage-mid-border); }
  .stage-engaged     { background: var(--stage-amber-bg); color: var(--stage-amber-text); border: 0.5px solid var(--stage-amber-border); }
  .stage-converted   { background: var(--stage-won-bg);   color: var(--stage-won-text);   border: 0.5px solid var(--stage-won-border); }
  .stage-lost        { background: var(--stage-lost-bg);  color: var(--stage-lost-text);  border: 0.5px solid var(--stage-lost-border); }

  .text-white   { color: var(--text-primary) !important; }
  .text-slate-400 { color: var(--text-secondary) !important; }
  .text-slate-300 { color: var(--text-secondary) !important; }
  .text-slate-500 { color: var(--text-muted) !important; }
  .text-white\/70, .text-white\/60, .text-white\/50,
  .text-white\/45, .text-white\/40, .text-white\/35,
  .text-white\/30, .text-white\/25 { color: var(--text-secondary) !important; }
  .bg-slate-900, .bg-slate-800 { background: var(--bg-subtle) !important; }
  .border-slate-700, .border-slate-600 { border-color: var(--border-default) !important; }

  /* ── Poppins → Hanken Grotesk ────────────────────────── */
  * { font-family: var(--font-ui) !important; }
  code, pre, .font-mono { font-family: var(--font-mono) !important; }
</style>
</head>
<body class="min-h-screen">
<div id="crm-root"></div>
<div id="crm-error" style="display:none;padding:24px;color:#f87171;font-family:monospace;font-size:13px;background:rgba(40,23,130,0.9);border:1px solid rgba(122,80,247,0.4);margin:24px;border-radius:8px;white-space:pre-wrap;max-height:80vh;overflow:auto;"></div>
<script>
window.onerror = function(msg, src, line, col, err) {
  var d = document.getElementById('crm-error');
  d.style.display = 'block';
  d.textContent = '❌ JS Error (line ' + line + '):\n' + msg + '\n\n' + (err && err.stack ? err.stack : '');
};
window.addEventListener('unhandledrejection', function(e) {
  var d = document.getElementById('crm-error');
  d.style.display = 'block';
  d.textContent = (d.textContent||'') + '\n❌ Unhandled Promise:\n' + (e.reason?.stack || e.reason);
});
window.addEventListener('load', function() {
  var missing = [];
  if (!window.ReactRouterDOM) missing.push('ReactRouterDOM');
  if (!window.supabase) missing.push('supabase');
  if (!window.React) missing.push('React');
  if (!window.Babel) missing.push('Babel');
  if (missing.length) {
    var d = document.getElementById('crm-error');
    d.style.display = 'block';
    d.textContent = '❌ Missing CDN libs: ' + missing.join(', ');
  }
});
</script>
<script type="text/babel">

// ─── DESTRUCTURES ──────────────────────────────────────────────────────────
const {
  HashRouter, Routes, Route, Link, Navigate, useParams,
  useNavigate, useLocation
} = window.ReactRouterDOM;
const {
  useState, useEffect, useMemo, useCallback, useRef,
  createContext, useContext
} = React;
const { createClient } = window.supabase;
const {
  BarChart, Bar, LineChart, Line,
  PieChart, Pie, Cell,
  XAxis, YAxis, CartesianGrid, Tooltip: RTooltip, Legend,
  ResponsiveContainer
} = window.Recharts || {};

// ─── CLIENT CONFIG ──────────────────────────────────────────────────────────
// Reads from localStorage or window.CRM_CLIENT_CONFIG; falls back to defaults.
const _RAW_CLIENT_CONFIG = (() => {
  try {
    const stored = localStorage.getItem('CRM_CLIENT_CONFIG');
    if (stored) return JSON.parse(stored);
  } catch(e) {}
  return window.CRM_CLIENT_CONFIG || null;
})();

const CLIENT_CONFIG = _RAW_CLIENT_CONFIG || {
  brand: {
    name: 'My Company',
    primaryColor: '#602DF5',
    logoUrl: '',
    allowedDomain: '',
  },
  fields: [
    { key:'id',             label:'Customer ID',           type:'string',  format:'text'     },
    { key:'country',        label:'Country',                type:'string',  format:'text'     },
    { key:'company',        label:'Company',                type:'string',  format:'text'     },
    { key:'contract_type',  label:'Contract Type',          type:'string',  format:'text'     },
    { key:'contract_state', label:'Contract State',         type:'string',  format:'select',  options:['active','churned','deleted'] },
    { key:'wallet',         label:'Wallet Balance',         type:'number',  format:'currency' },
    { key:'comp',           label:'Monthly Compensation',   type:'number',  format:'currency' },
    { key:'card_spend',     label:'Lifetime Card Spend',    type:'number',  format:'currency' },
    { key:'days_since',     label:'Days on Platform',       type:'number',  format:'number'   },
    { key:'engagement_level', label:'Engagement Level',     type:'string',  format:'select',  options:['Active','Idle','Churn Risk','Dormant','Never Active'] },
  ],
  primaryKey: 'customer_id',
  statusField: 'contract_state',
  statusValues: { active: 'active', inactive: ['churned', 'deleted'] },
  products: [
    {
      key: 'Reserve',
      label: 'Reserve',
      icon: '🛡',
      color: '#602DF5',
      defaultTeam: 'ACTIVATION',
      revenue: { model: 'fixed', annualValue: 179.88 },
    },
    {
      key: 'Future Fund',
      label: 'Future Fund',
      icon: '💰',
      color: '#7A50F7',
      defaultTeam: 'WORKFORCE_SUCCESS',
      revenue: { model: 'pct_of_aum', takeRateAnnual: 0.0014, payrollInvestPct: 0.02 },
    },
    {
      key: 'Personal Account',
      label: 'Personal Account',
      icon: '🌐',
      color: '#9D7FF9',
      defaultTeam: 'WORKFORCE_SUCCESS',
      revenue: { model: 'pct_of_field', baseMonthlyActivity: 13, balanceRecoveryRate: 0.05 },
    },
    {
      key: 'Card',
      label: 'Card',
      icon: '💳',
      color: '#F59E0B',
      defaultTeam: 'ACTIVATION',
      revenue: { model: 'strategic', annualValue: 50 },
    },
  ],
  sellingFactors: [],
  unitEconomics: {
    stageProbabilities: {
      'Identified':     10,
      'Contacted':      25,
      'Engaged':        60,
      'Converted':     100,
      'Not Interested':  0,
    },
    reEngagementDays: {
      re_engagement_days_not_interested: 90,
      re_engagement_days_expired_contacted: 60,
      re_engagement_days_expired: 30,
      opportunity_expiry_days: 90,
    },
  },
  analyticsWidgets: (function() {
    // Auto-generate widgets from default fields
    const numericFields = ['wallet','ff_net','card_spend','comp','card_balance','txn_count','days_since','consecutive_payroll_months'];
    const stringFields = ['country','contract_type','contract_state','engagement_level','account_type','recent_activity_bucket','consistency_bucket'];
    const widgets = [];
    numericFields.forEach(f => {
      widgets.push({ type:'auto_sum_'+f, label: f.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())+' by Country', category:'Overview', x_field:'country', y_field:f, y_label:f, aggregation:'sum', chart_type:'bar', description:'Sum of '+f+' grouped by country' });
    });
    stringFields.forEach(f => {
      widgets.push({ type:'auto_count_'+f, label:'Breakdown by '+f.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()), category:'Overview', x_field:f, y_field:'count', y_label:'Count', aggregation:'count', chart_type:'bar', description:'Count of records grouped by '+f });
    });
    return widgets;
  })(),
};

// ─── FINANCIAL DATA LOOKUP ─────────────────────────────────────────────────
const CONTRACTOR_MAP = new Map();

function buildColumnIndex(headers) {
  const idx = {};
  (headers || []).forEach((h, i) => { idx[h] = i; });
  return idx;
}

if (window.CUSTOMER_DATA && Array.isArray(window.CUSTOMER_DATA.headers) && Array.isArray(window.CUSTOMER_DATA.rows)) {
  // Generic path: build CONTRACTOR_MAP by column name, driven by CLIENT_CONFIG.fields.
  const colIdx = buildColumnIndex(window.CUSTOMER_DATA.headers);
  const primaryKey = CLIENT_CONFIG.primaryKey || 'customer_id';
  const statusField = CLIENT_CONFIG.statusField || 'contract_state';
  const statusValues = CLIENT_CONFIG.statusValues || { active: 'active', inactive: ['churned', 'deleted'] };
  const inactiveValues = Array.isArray(statusValues.inactive) ? statusValues.inactive : [statusValues.inactive];

  window.CUSTOMER_DATA.rows.forEach(r => {
    const idIdx = colIdx[primaryKey];
    const id = idIdx !== undefined ? r[idIdx] : undefined;
    if (id === undefined || id === null) return;

    const record = { id };
    (CLIENT_CONFIG.fields || []).forEach(f => {
      const i = colIdx[f.key];
      if (i === undefined) return;
      const raw = r[i];
      if (f.type === 'number') record[f.key] = +raw || 0;
      else if (f.type === 'boolean') record[f.key] = raw === 1 || raw === '1' || raw === true;
      else record[f.key] = raw ?? null;
    });

    const statusRaw = record[statusField];
    record.contract_state = inactiveValues.includes(statusRaw) ? 'ENDED' : 'ACTIVE';
    record.has_active_contract = record.contract_state === 'ACTIVE';

    CONTRACTOR_MAP.set(id, record);
  });
} else {

(window.UPSELL_DATA?.rows || []).forEach(r => {
  CONTRACTOR_MAP.set(r[0], {
    id:r[0], country:r[1]||'', comp:+r[2]||0, wallet:+r[3]||0,
    card_balance:+r[4]||0, ff_net:+r[5]||0,
    is_reserve:r[6]===1||r[6]==='1',
    card_spend:+r[7]||0, txn_count:+r[8]||0, avg_ticket:+r[9]||0,
    top_category:r[10]||null, contract_type:r[11]||'',
    days_since:+r[12]||0, contract_state:'ACTIVE', company:r[13]||null,
    // New Onsight fields (indices 14-22). Default gracefully when vendor file hasn't been updated yet.
    engagement_level:           r[14] || null,
    has_card:                   (r[15]===1||r[15]==='1') || false,
    has_card_virtual:           (r[16]===1||r[16]==='1') || false,
    has_card_physical:          (r[17]===1||r[17]==='1') || false,
    account_type:               r[18] || 'Payroll Account',
    has_active_contract:        r[19]===0||r[19]==='0'||r[19]===false ? false : true,
    consecutive_payroll_months: +r[20] || 0,
    recent_activity_bucket:     r[21] || null,
    consistency_bucket:         r[22] || null,
  });
});
(window.INACTIVE_DATA?.rows || []).forEach(r => {
  if (!CONTRACTOR_MAP.has(r[0])) {
    CONTRACTOR_MAP.set(r[0], {
      id:r[0], country:r[1]||'', contract_state:r[2]||'ENDED',
      wallet:+r[3]||0, card_balance:+r[4]||0, ff_net:+r[5]||0,
      is_reserve:r[6]===1||r[6]==='1',
      contract_type:r[7]||'', days_since_ended:+r[8]||0,
      total_balance:+r[9]||0, company:r[10]||null, comp:+r[11]||0,
      card_spend:0, txn_count:0, days_since:0,
      // New Onsight fields (indices 12-19). Default gracefully.
      engagement_level:           r[12] || null,
      has_card:                   (r[13]===1||r[13]==='1') || false,
      has_card_virtual:           (r[14]===1||r[14]==='1') || false,
      has_card_physical:          (r[15]===1||r[15]==='1') || false,
      account_type:               r[16] || 'Payroll Account',
      has_active_contract:        false,
      consecutive_payroll_months: +r[17] || 0,
      recent_activity_bucket:     r[18] || 'INACTIVE',
      consistency_bucket:         r[19] || null,
    });
  }
});

}

// ─── LEAD SCORE ─────────────────────────────────────────────────────────────
function computeLeadScore(r) {
  if (!r) return 0;
  let s = 0;
  const comp = r.comp||0;
  s += comp>3000?25:comp>1000?15:5;
  const spend = r.card_spend||0;
  s += spend>5000?25:spend>1000?15:5;
  const wallet = r.wallet||0;
  s += wallet>2000?20:wallet>500?10:3;
  const tenure = r.days_since||0;
  s += tenure>180?15:tenure>90?8:3;
  if (r.contract_state==='ACTIVE') s+=15;
  else if ((r.days_since_ended||999)<60) s+=8;
  else s+=2;
  return Math.min(100,s);
}

// ─── PRODUCT CATALOG & UNIT ECONOMICS ────────────────────────────────────────
// Derived from Ontop Global Account Unit Economics spreadsheet (Jun 2026).
//
// Reserve:          $14.99/mo subscription. Net negative (~-$27/mo after cashbacks).
//                   Strategic: gateway to card engagement and retention.
// Future Fund:      0.14% annual take rate on AUM. 100% gross margin. Revenue scales
//                   with deposits. Workers typically invest ~2% of payroll.
// Personal Account: Crypto-backed account (BVNK). No active contract required.
//                   Revenue from crypto payins ($3/txn), Ontop Pay ($3/txn),
//                   payouts (~$7/mo net). Also balance recovery for churned workers.
// Card:             Visa card activation. Net negative per txn (~-$0.08) but strategic:
//                   gateway to Reserve subscription and platform stickiness.

function getProductCatalog() {
  const catalog = {};
  (CLIENT_CONFIG.products || []).forEach(p => {
    catalog[p.key] = {
      label: p.label,
      icon: p.icon,
      color: p.color,
      defaultTeam: p.defaultTeam,
      _revenue: p.revenue,
    };
  });
  return catalog;
}
const PRODUCT_CATALOG = getProductCatalog();

const STAGE_PROBABILITIES = CLIENT_CONFIG.unitEconomics.stageProbabilities;

function computeExpectedValue(product, fin) {
  const cat = PRODUCT_CATALOG[product];
  if (!cat) return 0;
  const rev = cat._revenue || {};
  const comp    = fin?.comp || 0;
  const wallet  = fin?.wallet || 0;
  const cardBal = fin?.card_balance || 0;
  const ffNet   = fin?.ff_net || 0;

  switch (rev.model) {
    case 'fixed':
      return rev.annualValue || 0;

    case 'strategic':
      return rev.annualValue || 0;

    case 'pct_of_aum': {
      const fromWallet  = wallet * 0.25;
      const fromPayroll = comp * (rev.payrollInvestPct || 0.02) * 12;
      const projectedAUM = Math.max(fromWallet, fromPayroll);
      return parseFloat((projectedAUM * (rev.takeRateAnnual || 0.0014)).toFixed(2));
    }

    case 'pct_of_field': {
      const totalBalance = wallet + cardBal + ffNet;
      const recoveryValue = totalBalance > 0 ? totalBalance * (rev.balanceRecoveryRate || 0.05) : 0;
      const activityValue = (rev.baseMonthlyActivity || 0) * 6;
      return parseFloat((recoveryValue + activityValue).toFixed(2));
    }

    default:
      return 0;
  }
}
function computeWeightedValue(product, stage, fin) {
  const ev   = computeExpectedValue(product, fin);
  const prob = STAGE_PROBABILITIES[stage] ?? 0;
  return parseFloat((ev * prob / 100).toFixed(2));
}

function computeReEngagementDate(closedReason, wasContacted) {
  switch(closedReason) {
    case 'converted':
      return null;
    case 'not_interested':
      return new Date(Date.now() + RE_ENGAGEMENT_DEFAULTS.re_engagement_days_not_interested * 86400000).toISOString();
    case 'expired': {
      const days = wasContacted
        ? RE_ENGAGEMENT_DEFAULTS.re_engagement_days_expired_contacted
        : RE_ENGAGEMENT_DEFAULTS.re_engagement_days_expired;
      return new Date(Date.now() + days * 86400000).toISOString();
    }
    case 'manual':
      return new Date().toISOString();
    default:
      return new Date(Date.now() + 30 * 86400000).toISOString();
  }
}

function isReEngagementEligible(crmRec) {
  if (!crmRec || !crmRec.closed_at || !crmRec.re_engagement_eligible_at) return false;
  return new Date(crmRec.re_engagement_eligible_at) <= new Date();
}

function isOpportunityClosed(crmRec) {
  return !!crmRec?.closed_at;
}

function getOpportunityStatus(crmRec) {
  if (!crmRec) return null;
  if (!crmRec.closed_at) return { status: 'open', label: 'Open', color: '#602DF5' };
  const eligible = isReEngagementEligible(crmRec);
  const eligibleDate = crmRec.re_engagement_eligible_at;
  switch(crmRec.closed_reason) {
    case 'converted':
      return { status: 'converted', label: 'Converted', color: '#10B981' };
    case 'not_interested':
      return eligible
        ? { status: 're_engagement_eligible', label: 'Re-engage eligible', color: '#F59E0B' }
        : { status: 'closed_ni', label: `Re-engage ${fmt.short(eligibleDate)}`, color: '#9CA3AF' };
    case 'expired':
      return eligible
        ? { status: 're_engagement_eligible', label: 'Re-engage eligible', color: '#F59E0B' }
        : { status: 'closed_expired', label: `Re-engage ${fmt.short(eligibleDate)}`, color: '#9CA3AF' };
    case 'manual':
      return eligible
        ? { status: 're_engagement_eligible', label: 'Re-engage eligible', color: '#F59E0B' }
        : { status: 'closed_manual', label: 'Closed', color: '#9CA3AF' };
    default:
      return { status: 'closed', label: 'Closed', color: '#9CA3AF' };
  }
}

// Single function used by ConversionDataSource. Calls the Onsight API via the
// configured endpoint. In Claude Code sessions this can be replaced with the
// onsight_query_data MCP call. Returns an array of rows, or [] on failure.
async function queryOnsight(prompt) {
  const cfg = window.CRM_CONFIG || {};
  if (!cfg.onsightApiUrl) {
    // Onsight is only queryable via Claude Code MCP — not directly from the browser.
    // Dashboard widgets use pre-computed snapshots from crm_onsight_snapshots.
    // Ask Claude Code: "Refresh Onsight dashboard snapshots" to populate widget data.
    console.info('[Onsight] Direct API not configured — widgets use snapshot data from crm_onsight_snapshots.');
    return [];
  }
  try {
    const res = await fetch(cfg.onsightApiUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(cfg.onsightApiKey ? { 'Authorization': 'Bearer ' + cfg.onsightApiKey } : {}),
      },
      body: JSON.stringify({ query: prompt }),
    });
    if (!res.ok) {
      console.warn('[Onsight] Query failed:', res.status, res.statusText);
      return [];
    }
    const json = await res.json();
    return Array.isArray(json) ? json : (json?.rows || json?.data || []);
  } catch(e) {
    console.warn('[Onsight] Query error:', e.message);
    return [];
  }
}

function groupByMinDate(rows, keyField, dateField) {
  const map = {};
  (rows || []).forEach(r => {
    const key = r[keyField];
    if (!map[key] || new Date(r[dateField]) < new Date(map[key][dateField])) {
      map[key] = r;
    }
  });
  return Object.values(map);
}

// ─── CONVERSION DETECTION ────────────────────────────────────────────────────
async function detectNewConversions() {
  const since = daysAgo(CONVERSION_CONFIG.lookback_days);

  // Three queries run in parallel via the adapter (Wanderlust discontinued)
  const [reserveRes, ffRes, gaRes] = await Promise.allSettled([
    ConversionDataSource.getReserveConversions(since),
    ConversionDataSource.getFutureFundConversions(since),
    ConversionDataSource.getGlobalAccountConversions(since),
  ]);

  function parseRows(res, type, dateField) {
    if (res.status !== 'fulfilled' || !res.value) return [];
    try {
      const rows = Array.isArray(res.value)
        ? res.value
        : (res.value?.rows || res.value?.data || []);
      return rows
        .filter(r => r.cod_contractor || r.contractor_id)
        .map(r => ({
          contractor_id: r.cod_contractor || r.contractor_id,
          type,
          converted_at: r[dateField] || r.subscription_date || r.conversion_date,
        }))
        .filter(r => r.contractor_id && r.converted_at);
    } catch(e) {
      console.warn(`Failed to parse ${type} conversions:`, e);
      return [];
    }
  }

  const all = [
    ...parseRows(reserveRes,    'RESERVE',        'subscription_date'),
    ...parseRows(ffRes,         'FUTURE_FUND',    'conversion_date'),
    ...parseRows(gaRes,         'GLOBAL_ACCOUNT', 'conversion_date'),
  ];

  console.log(
    `Conversion detection: Reserve=${parseRows(reserveRes,'R','subscription_date').length}, ` +
    `FutureFund=${parseRows(ffRes,'F','conversion_date').length}, ` +
    `GlobalAccount=${parseRows(gaRes,'G','conversion_date').length}`
  );

  return all;
}

// ─── ATTRIBUTION MATCHING ────────────────────────────────────────────────────
async function attributeConversion(conversion, interactions, contractors) {
  const windowDays = CONVERSION_CONFIG.attribution_windows[conversion.type] || 14;
  const convertedAt = new Date(conversion.converted_at);
  const windowStart = new Date(convertedAt.getTime() - windowDays * 86400000);

  // Find most recent CRM interaction within attribution window
  const windowInteractions = interactions
    .filter(i =>
      i.contractor_id === conversion.contractor_id &&
      i.type !== 'note' &&
      new Date(i.created_at) >= windowStart &&
      new Date(i.created_at) <= convertedAt
    )
    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

  const lastInteraction = windowInteractions[0] || null;
  const crmRecord = getBestContractorRecord(contractors, conversion.contractor_id);

  const daysToConvert = lastInteraction
    ? Math.round((convertedAt - new Date(lastInteraction.created_at)) / 86400000)
    : null;

  const base = {
    contractor_id: conversion.contractor_id,
    conversion_type: conversion.type,
    converted_at: conversion.converted_at,
    pipeline_stage_at_conversion: crmRecord?.pipeline_stage || null,
    days_to_convert: daysToConvert,
    reconciliation_status: 'pending',
  };

  if (lastInteraction) {
    return {
      ...base,
      attributed_to: lastInteraction.created_by,
      attribution_type: 'outreach',
      last_interaction_id: lastInteraction.id,
    };
  } else if (crmRecord?.assigned_to) {
    return {
      ...base,
      attributed_to: crmRecord.assigned_to,
      attribution_type: 'pipeline',
      last_interaction_id: null,
    };
  } else {
    return {
      ...base,
      attributed_to: null,
      attribution_type: 'organic',
      last_interaction_id: null,
    };
  }
}

// ─── DUPLICATE DETECTION ─────────────────────────────────────────────────────

function detectDuplicates(contractors, interactions, conversions) {
  const issues = [];

  // Type 1 — Same contractor worked by multiple team members
  const interactionsByContractor = {};
  interactions.forEach(i => {
    if (!i.contractor_id || !i.created_by) return;
    if (!interactionsByContractor[i.contractor_id]) {
      interactionsByContractor[i.contractor_id] = new Set();
    }
    interactionsByContractor[i.contractor_id].add(i.created_by);
  });

  Object.entries(interactionsByContractor).forEach(([contractorId, userSet]) => {
    if (userSet.size > 1) {
      const crmRec = contractors[contractorId];
      if (!crmRec) return;
      issues.push({
        type: 'multi_owner_interaction',
        severity: 'warning',
        contractor_id: contractorId,
        message: `Contacted by ${userSet.size} different team members`,
        detail: { user_ids: [...userSet] },
      });
    }
  });

  // Type 2 — Converted but still in active pipeline stage
  const convertedIds = new Set(conversions.map(c => c.contractor_id));
  Object.entries(contractors).forEach(([contractorId, rec]) => {
    if (
      convertedIds.has(contractorId) &&
      rec.pipeline_stage !== 'Converted' &&
      rec.pipeline_stage !== 'Not Interested'
    ) {
      issues.push({
        type: 'converted_not_updated',
        severity: 'info',
        contractor_id: contractorId,
        message: `Converted but still showing as ${rec.pipeline_stage}`,
        detail: { current_stage: rec.pipeline_stage },
      });
    }
  });

  return issues;
}

function assignTeam(fin) {
  if (!fin) return ['ACTIVATION'];
  const totalBalance = (fin.wallet || 0) + (fin.ff_net || 0);
  const state = fin.contract_state || 'ACTIVE';
  const days = fin.days_since || 0;
  const teams = [];

  // Rule 1 — Ended/Deleted with balance → Workforce Success
  if (['ENDED','DELETED'].includes(state) && totalBalance > 0) {
    teams.push('WORKFORCE_SUCCESS');
  }
  // Rule 2 — New contractor → Activation
  else if (days < TEAM_CONFIG.NEW_CONTRACTOR_DAYS) {
    teams.push('ACTIVATION');
  }
  // Rule 3 — High balance → Workforce Success
  else if (totalBalance > TEAM_CONFIG.HIGH_BALANCE_THRESHOLD) {
    teams.push('WORKFORCE_SUCCESS');
  }
  // Rule 4 — Default → Activation
  else {
    teams.push('ACTIVATION');
  }

  // Secondary team — if contractor has multi-product opportunities
  if (!fin.is_reserve && !teams.includes('ACTIVATION')) {
    teams.push('ACTIVATION');
  }
  if ((!fin.ff_net || fin.ff_net <= 0) &&
      totalBalance > 2000 &&
      !teams.includes('WORKFORCE_SUCCESS')) {
    teams.push('WORKFORCE_SUCCESS');
  }

  return teams;
}

function primaryTeam(fin) {
  return assignTeam(fin)[0];
}

// ─── CONTRACTOR RECORD HELPERS (two-level state) ────────────────────────────
const STAGE_PRIORITY = {
  'Engaged': 5, 'Contacted': 4, 'Identified': 3,
  'Converted': 2, 'Not Interested': 1,
};

function getContractorRecord(contractors, contractorId, team) {
  return contractors[contractorId]?.[team] || null;
}

function getAllContractorRecords(contractors, contractorId) {
  return Object.values(contractors[contractorId] || {});
}

function isInPipeline(contractors, contractorId) {
  return !!contractors[contractorId] &&
    Object.keys(contractors[contractorId]).length > 0;
}

function getBestContractorRecord(contractors, contractorId) {
  const records = getAllContractorRecords(contractors, contractorId);
  if (records.length === 0) return null;
  return records.sort((a, b) =>
    (STAGE_PRIORITY[b.pipeline_stage] || 0) -
    (STAGE_PRIORITY[a.pipeline_stage] || 0)
  )[0];
}

function detectOpportunities(fin) {
  if (!fin) return [];
  const ops = [];
  const hasActiveContract = fin.has_active_contract ?? (fin.contract_state === 'ACTIVE');
  const engLevel = fin.engagement_level || null;
  const isEngaged = !engLevel || ['Active', 'Idle'].includes(engLevel);
  const hasAnyCard = fin.has_card || fin.has_card_virtual || (fin.txn_count > 0);
  const totalBalance = (fin.wallet || 0) + (fin.card_balance || 0) + (fin.ff_net || 0);

  const factors = CLIENT_CONFIG.sellingFactors || [];
  if (factors.length > 0) {
    (CLIENT_CONFIG.products || []).forEach(prod => {
      const matchingFactors = factors.filter(f => {
        if (!f.if) return false;
        const { field, op, value } = f.if;
        let actual;
        if (field === 'has_active_contract') actual = hasActiveContract;
        else if (field === 'has_any_card') actual = hasAnyCard;
        else if (field === 'total_balance') actual = totalBalance;
        else actual = fin[field];
        switch (op) {
          case '=':  return String(actual) === String(value) || actual === value;
          case '!=': return actual !== value;
          case '>':  return Number(actual) > Number(value);
          case '>=': return Number(actual) >= Number(value);
          case '<':  return Number(actual) < Number(value);
          case '<=': return Number(actual) <= Number(value);
          default:   return false;
        }
      });
      if (matchingFactors.length > 0) {
        const best = matchingFactors[0];
        ops.push({ product: prod.key, team: prod.defaultTeam, quality: best.quality || 'medium', reason: best.reason || best.pitch || prod.label });
      }
    });
    return ops;
  }

  // Fallback: built-in logic when no sellingFactors configured
  if (hasActiveContract && !hasAnyCard && isEngaged) {
    const quality = (fin.comp || 0) > 2000 ? 'high' : (fin.comp || 0) > 500 ? 'medium' : 'low';
    ops.push({ product: 'Card', team: 'ACTIVATION', quality, reason: 'Active contractor without card — gateway to Reserve' });
  }
  if (!fin.is_reserve && hasAnyCard && hasActiveContract && isEngaged) {
    const spend = fin.card_spend || 0;
    const quality = spend > 1000 ? 'high' : spend > 0 ? 'medium' : 'low';
    ops.push({ product: 'Reserve', team: 'ACTIVATION', quality, reason: spend > 0 ? `${fin.txn_count || 0} card txns, $${Math.round(spend)} spend` : 'Has card but no spend yet' });
  }
  if ((!fin.ff_net || fin.ff_net <= 0) && ((fin.wallet || 0) > 0 || (fin.comp || 0) > 500) && isEngaged) {
    const quality = (fin.wallet || 0) > 2000 ? 'high' : (fin.wallet || 0) > 500 ? 'medium' : (fin.comp || 0) > 1000 ? 'medium' : 'low';
    ops.push({ product: 'Future Fund', team: primaryTeam(fin), quality, reason: (fin.wallet || 0) > 0 ? `$${Math.round(fin.wallet)} idle in wallet` : `$${Math.round(fin.comp || 0)}/mo comp — savings capacity` });
  }
  const hasPersonalAcct = fin.account_type === 'Personal Account';
  if (!hasPersonalAcct) {
    if (!hasActiveContract && totalBalance > 0) {
      const quality = totalBalance > 2000 ? 'high' : totalBalance > 500 ? 'medium' : 'low';
      ops.push({ product: 'Personal Account', team: 'WORKFORCE_SUCCESS', quality, reason: `$${Math.round(totalBalance)} trapped on platform — recovery + retention` });
    } else if (hasActiveContract && isEngaged) {
      const wallet = fin.wallet || 0;
      const comp   = fin.comp   || 0;
      const quality = (wallet > 2000 || comp > 3000) ? 'high' : (wallet > 500 || comp > 1000) ? 'medium' : 'low';
      const reason  = wallet > 0 ? `$${Math.round(wallet)} idle in wallet — crypto account cross-sell` : `$${Math.round(comp)}/mo comp — savings capacity for crypto account`;
      ops.push({ product: 'Personal Account', team: 'WORKFORCE_SUCCESS', quality, reason });
    }
  }
  return ops;
}
function detectMultiTeamFlag(fin) {
  const ops = detectOpportunities(fin);
  const teams = [...new Set(ops.map(o => o.team))];
  return { flagged: teams.length > 1, opportunities: ops, teams };
}


function getLastContacted(contractorId, interactions) {
  const ci = interactions.filter(i => i.contractor_id === contractorId && i.type !== 'note');
  if (ci.length === 0) return null;
  return ci.reduce((latest, i) => new Date(i.created_at) > new Date(latest) ? i.created_at : latest, ci[0].created_at);
}

function getCrossTeamWarning(contractorId, currentUserTeam) {
  const fin = CONTRACTOR_MAP.get(contractorId) || {};
  const pTeam = primaryTeam(fin);
  const { flagged, opportunities } = detectMultiTeamFlag(fin);
  const warnings = [];
  if (currentUserTeam && pTeam !== currentUserTeam) {
    warnings.push({
      type: 'wrong_team',
      message: `This contractor is assigned to ${TEAMS[pTeam]?.label}. You are on ${TEAMS[currentUserTeam]?.label}.`,
      severity: 'warn'
    });
  }
  if (flagged) {
    warnings.push({
      type: 'multi_team',
      message: 'Multiple teams have upsell opportunities here. Coordinate before contacting.',
      severity: 'warn',
      detail: opportunities
    });
  }
  return warnings;
}


// ─── AUDIENCE FILTER ENGINE ──────────────────────────────────────────────────
const AUDIENCE_FIELDS = CLIENT_CONFIG.fields;

const AUDIENCE_OPERATORS = {
  number:  ['>','>=','<','<=','=','!='],
  string:  ['=','!=','contains','not contains'],
  boolean: ['='],
};

function evaluateRule(fin, rule) {
  if (!rule.field || !rule.operator) return true;
  if (rule.value === '' || rule.value == null) return true; // skip incomplete rules
  let val;
  if (rule.field === 'lead_score') val = computeLeadScore(fin);
  else if (rule.field === 'team') val = primaryTeam(fin);
  else if (rule.field === 'is_reserve') val = fin.is_reserve || false;
  else if (rule.field === 'has_card') val = fin.has_card || false;
  else if (rule.field === 'has_card_virtual') val = fin.has_card_virtual || false;
  else if (rule.field === 'has_active_contract') val = fin.has_active_contract ?? true;
  else val = fin[rule.field];
  const BOOLEAN_FIELDS = ['is_reserve','has_card','has_card_virtual','has_active_contract'];
  const ruleVal = BOOLEAN_FIELDS.includes(rule.field) ? (rule.value === 'true' || rule.value === true) : rule.value;
  switch (rule.operator) {
    case '>':  return (val||0) > Number(ruleVal);
    case '>=': return (val||0) >= Number(ruleVal);
    case '<':  return (val||0) < Number(ruleVal);
    case '<=': return (val||0) <= Number(ruleVal);
    case '=':  return String(val||'').toUpperCase() === String(ruleVal||'').toUpperCase();
    case '!=': return String(val||'').toUpperCase() !== String(ruleVal||'').toUpperCase();
    case 'contains':     return String(val||'').toUpperCase().includes(String(ruleVal||'').toUpperCase());
    case 'not contains': return !String(val||'').toUpperCase().includes(String(ruleVal||'').toUpperCase());
    default: return true;
  }
}

// ─── AUDIENCE EXCLUSION ENGINE ───────────────────────────────────────────────
// Salesforce-style dynamic suppressions evaluated at use time
function evaluateAudience(audience, interactions, conversions, contractors, allAudiences) {
  const _interactions = interactions || [];
  const _conversions = conversions || [];
  const _contractors = contractors || {};
  const _allAudiences = allAudiences || [];

  const rules = audience.filter_rules || [];
  if (rules.length === 0) return {
    matches: [],
    exclusionBreakdown: { by_audience:0, by_stage:0, by_recency:0, by_conversion:0, total:0 },
    evaluatedAt: new Date(),
  };

  const limit = audience.size_limit || Infinity;
  let matches = [];
  for (const [id, fin] of CONTRACTOR_MAP) {
    if (matches.length >= limit) break;
    if (rules.every(rule => evaluateRule(fin, rule))) matches.push(id);
  }

  const beforeExclusions = matches.length;
  const breakdown = { by_audience:0, by_stage:0, by_recency:0, by_conversion:0, total:0 };

  // Exclude by audience membership
  const excludedAudienceIds = audience.excluded_audience_ids || [];
  if (excludedAudienceIds.length > 0) {
    const excludedSet = new Set();
    excludedAudienceIds.forEach(excludedId => {
      const excludedAudience = _allAudiences.find(a => a.id === excludedId);
      if (!excludedAudience) return;
      const excludedMembers = excludedAudience.audience_type === 'static'
        ? (excludedAudience.static_member_ids || [])
        : evaluateAudience(excludedAudience, _interactions, _conversions, _contractors, _allAudiences).matches;
      excludedMembers.forEach(id => excludedSet.add(id));
    });
    const before = matches.length;
    matches = matches.filter(id => !excludedSet.has(id));
    breakdown.by_audience = before - matches.length;
  }

  // Exclude by pipeline stage
  const excludedStages = audience.excluded_pipeline_stages || [];
  if (excludedStages.length > 0) {
    const before = matches.length;
    matches = matches.filter(id => {
      const records = getAllContractorRecords(_contractors, id);
      return !records.some(rec => excludedStages.includes(rec.pipeline_stage));
    });
    breakdown.by_stage = before - matches.length;
  }

  // Exclude by recency of contact
  const recentDays = audience.excluded_recent_contact_days;
  if (recentDays && recentDays > 0) {
    const cutoff = new Date(Date.now() - recentDays * 86400000);
    const before = matches.length;
    matches = matches.filter(id => {
      const lastContact = getLastContacted(id, _interactions);
      return !lastContact || new Date(lastContact) < cutoff;
    });
    breakdown.by_recency = before - matches.length;
  }

  // Exclude by conversion type
  const excludedConversions = audience.excluded_conversion_types || [];
  if (excludedConversions.length > 0) {
    const convertedSet = new Set(
      _conversions
        .filter(c => excludedConversions.includes(c.conversion_type))
        .map(c => c.contractor_id)
    );
    const before = matches.length;
    matches = matches.filter(id => !convertedSet.has(id));
    breakdown.by_conversion = before - matches.length;
  }

  breakdown.total = beforeExclusions - matches.length;

  return { matches, exclusionBreakdown: breakdown, evaluatedAt: new Date() };
}

// Drop-in replacement for old evaluateAudience — returns just the array
function getAudienceMembers(audience, interactions, conversions, contractors, allAudiences) {
  return evaluateAudience(audience, interactions, conversions, contractors, allAudiences).matches;
}

// Sync Google SSO session → crm_users row. Returns the crm_users record.
async function syncUserFromSSO(googleSession) {
  if (!SB || !googleSession) return null;
  const u = googleSession.user;
  const meta = u.user_metadata || {};
  const sub   = meta.sub || meta.provider_id || u.id;
  const email = u.email || '';
  const name  = meta.full_name || meta.name || email.split('@')[0];
  const picture = meta.avatar_url || meta.picture || null;

  try {
    // Find by email first (always works), then try to also match google_sub
    const { data: existing } = await SB
      .from('crm_users')
      .select('*')
      .eq('email', email)
      .maybeSingle();

    if (existing) {
      await SB.from('crm_users').update({
        google_sub: sub,
        name,
        avatar_url: picture,
        last_login: new Date().toISOString(),
      }).eq('id', existing.id);
      return { ...existing, name, avatar_url: picture, google_sub: sub };
    }

    // New user — check if first user (becomes admin)
    const { count } = await SB.from('crm_users').select('id', { count:'exact', head:true });
    const { data: created } = await SB.from('crm_users').insert({
      google_sub: sub,
      email,
      name,
      avatar_url: picture,
      role: count === 0 ? 'admin' : 'member',
      last_login: new Date().toISOString(),
    }).select().single();
    return created;
  } catch(e) {
    console.warn('syncUserFromSSO failed:', e);
    return null;
  }
}

function AuthGate({ children }) {
  const [session, setSession] = useState(undefined); // undefined=loading
  const [authUser, setAuthUser] = useState(null);    // synced crm_users row
  const [mode, setMode] = useState('login');          // 'login' | 'signup'
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  async function handleSession(s) {
    if (!s) { setSession(null); setAuthUser(null); return; }
    window.__ssoEmail = s.user?.email || null;
    window.__syncReady = syncUserFromSSO(s).then(crmUser => {
      setAuthUser(crmUser);
      window.__ssoUser = crmUser;
      return crmUser;
    }).catch(e => { console.warn('[AuthGate] sync failed:', e); return null; });
    setSession(s);
  }

  useEffect(() => {
    if (!SB) { setSession(null); return; }
    SB.auth.getSession().then(({ data }) => handleSession(data.session || null));
    const { data: { subscription } } = SB.auth.onAuthStateChange((_event, s) => handleSession(s));
    return () => subscription.unsubscribe();
  }, []);

  async function handleSubmit(e) {
    e.preventDefault();
    if (!SB) return;
    setBusy(true); setError('');
    if (mode === 'login') {
      const { error: err } = await SB.auth.signInWithPassword({ email, password });
      if (err) { setError(err.message); setBusy(false); }
    } else {
      const { error: err } = await SB.auth.signUp({ email, password });
      if (err) { setError(err.message); setBusy(false); }
      else { setError(''); setMode('login'); setPassword(''); setBusy(false); alert('Account created! Check your email to confirm, then sign in.'); }
    }
  }

  async function signOut() {
    await SB.auth.signOut();
    setSession(null);
  }

  const S = {
    page: { minHeight:'100vh', background:'linear-gradient(135deg,#2E2318,#5C3D1E)', display:'flex', alignItems:'center', justifyContent:'center', padding:24 },
    card: { background:'rgba(242,233,208,0.08)', border:'1px solid rgba(193,125,58,0.25)', backdropFilter:'blur(20px)', borderRadius:20, maxWidth:380, width:'100%', padding:36 },
    h1: { color:'#F2E9D0', fontSize:22, fontWeight:700, marginBottom:6, fontFamily:'Hanken Grotesk,sans-serif' },
    sub: { color:'rgba(242,233,208,0.5)', fontSize:13, marginBottom:28, fontFamily:'Hanken Grotesk,sans-serif' },
    label: { display:'block', color:'rgba(242,233,208,0.7)', fontSize:12, fontWeight:600, marginBottom:6, fontFamily:'Hanken Grotesk,sans-serif' },
    input: { width:'100%', padding:'10px 14px', borderRadius:10, background:'rgba(242,233,208,0.08)', border:'1px solid rgba(193,125,58,0.3)', color:'#F2E9D0', fontFamily:'Hanken Grotesk,sans-serif', fontSize:13, marginBottom:16, outline:'none', boxSizing:'border-box' },
    btn: { width:'100%', padding:'12px 0', borderRadius:999, background:busy?'rgba(193,125,58,0.3)':'linear-gradient(135deg,#2E2318,#5C3D1E)', color:'#F2E9D0', fontWeight:600, fontSize:14, border:'none', cursor:busy?'not-allowed':'pointer', fontFamily:'Hanken Grotesk,sans-serif', opacity:busy?0.7:1, marginTop:4 },
    err: { color:'#f87171', fontSize:12, marginTop:8, textAlign:'center', fontFamily:'Poppins,sans-serif' },
    toggle: { color:'rgba(193,125,58,0.9)', fontSize:12, textAlign:'center', marginTop:16, fontFamily:'Hanken Grotesk,sans-serif', cursor:'pointer', background:'none', border:'none', width:'100%' },
  };

  if (session === undefined) {
    return <div style={S.page}><div style={{color:'rgba(255,255,255,0.35)',fontSize:13,fontFamily:'Poppins,sans-serif'}}>Loading…</div></div>;
  }

  if (!session) {
    return (
      <div style={S.page}>
        <div style={S.card}>
          <div style={{marginBottom:24,display:'flex',justifyContent:'center'}}>
            {CLIENT_CONFIG.brand.logoUrl
              ? <img src={CLIENT_CONFIG.brand.logoUrl} alt={CLIENT_CONFIG.brand.name} style={{height:40,width:'auto',filter:'brightness(0) invert(1)'}} />
              : <div style={{width:48,height:48,borderRadius:12,background:'linear-gradient(135deg,#602DF5,#7A50F7)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:24,color:'#fff',fontWeight:700,fontFamily:'Poppins,sans-serif'}}>
                  {(CLIENT_CONFIG.brand.name||'?')[0].toUpperCase()}
                </div>
            }
          </div>
          <h1 style={S.h1}>{CLIENT_CONFIG.brand.name}</h1>
          <p style={S.sub}>{mode === 'login' ? 'Sign in to your account' : 'Create your account'}</p>

          <form onSubmit={handleSubmit}>
            <label style={S.label}>Email</label>
            <input style={S.input} type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@company.com" required autoComplete="email" />
            <label style={S.label}>Password</label>
            <input style={S.input} type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" required autoComplete={mode==='login'?'current-password':'new-password'} />
            {error && <p style={S.err}>{error}</p>}
            <button type="submit" disabled={busy} style={S.btn}>
              {busy ? 'Please wait…' : mode === 'login' ? 'Sign in' : 'Create account'}
            </button>
          </form>

          <button style={S.toggle} onClick={()=>{setMode(m=>m==='login'?'signup':'login');setError('');}}>
            {mode === 'login' ? "Don't have an account? Sign up" : 'Already have an account? Sign in'}
          </button>
        </div>
      </div>
    );
  }

  window.__crmSignOut = signOut;
  return React.cloneElement(children, { ssoUser: authUser });
}

const SETUP_SQL = `create table if not exists crm_users (

  source_audience_name text,
  primary key (contractor_id, team)
);

alter table crm_contractors add column if not exists source_audience_name text;
alter table crm_contractors add column if not exists added_by uuid references crm_users(id);
alter table crm_audiences add column if not exists default_segment text;
create table if not exists crm_interactions (
  id uuid primary key default gen_random_uuid(),
  contractor_id text not null, type text not null,
  content text, outcome text,
  created_by uuid references crm_users(id),
  created_at timestamp default now()
);
create table if not exists crm_tasks (
  id uuid primary key default gen_random_uuid(),
  contractor_id text not null,
  assigned_to uuid references crm_users(id),
  type text, note text, due_date date,
  is_completed boolean default false,
  created_by uuid references crm_users(id),
  created_at timestamp default now()
);

alter table crm_contractors enable row level security;

alter table crm_tasks enable row level security;

create policy "Allow all" on crm_contractors for all using (true) with check (true);
create policy "Allow all" on crm_interactions for all using (true) with check (true);
create policy "Allow all" on crm_tasks for all using (true) with check (true);

  changed_by uuid references crm_users(id),

const fmt = {
  currency: (n, compact=false) => { if (n==null) return '—'; if (compact) { if (Math.abs(n)>=1e6) return `$${(n/1e6).toFixed(1)}M`; if (Math.abs(n)>=1e3) return `$${(n/1e3).toFixed(0)}K`; } return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n); },
  number: n => n==null?'—':new Intl.NumberFormat('en-US').format(n),
  pct: (n, decimals=1) => n==null?'—':`${Number(n).toFixed(decimals)}%`,
  date: d => d?new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—',
  short: d => d?new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'—',
  timeAgo: d => {
    if (!d) return '—';
    const diff = Date.now()-new Date(d).getTime();
    const m=Math.floor(diff/60000);
    if (m<1) return 'just now';
    if (m<60) return `${m}m ago`;
    const h=Math.floor(m/60);
    if (h<24) return `${h}h ago`;
    return `${Math.floor(h/24)}d ago`;
  },
};

function isOverdue(task) {
  if (!task.due_date || task.is_completed) return false;
  return new Date(task.due_date) < new Date(new Date().toDateString());
}

  const addToast = useCallback((msg, type='info') => {
    const id = Date.now();
    setToasts(t => [...t, {id, msg, type}]);
    setTimeout(() => setToasts(t => t.filter(x => x.id!==id)), 4000);
  }, []);
  const colors = { success:'#D4EDDA', error:'#F8D7DA', info:'#EEEDFE', warn:'#FFF3CD' };

    <ToastCtx.Provider value={addToast}>
      {children}
      <div className="toast">
        {toasts.map(t => (
          <div key={t.id} className="toast-item text-sm"
            style={{background:colors[t.type]||colors.info,border:`1px solid ${borders[t.type]||borders.info}`}}>
            {t.msg}
          </div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
}

// ─── CRM PROVIDER ───────────────────────────────────────────────────────────
function CRMProvider({ children, ssoUser }) {
  const toast = useToast();
  const [users, setUsers] = useState([]);
  const [currentUser, setCurrentUser] = useState(null);
  const [viewingAs, setViewingAs] = useState(null);
  const [contractors, setContractors] = useState({});
  const [interactions, setInteractions] = useState([]);
  const [tasks, setTasks] = useState([]);
  const [audiences, setAudiences] = useState([]);
  const [conversions, setConversions] = useState([]);
  const [conversionSyncing, setConversionSyncing] = useState(false);
  const [lastConversionSync, setLastConversionSync] = useState(null);
  const [duplicateIssues, setDuplicateIssues] = useState([]);
  const [audiencePushes, setAudiencePushes] = useState([]);
  const [notifications, setNotifications] = useState([]);
  const [myDashboards, setMyDashboards] = useState([]);
  const [onsightSnapshots, setOnsightSnapshots] = useState({});
  const [opportunities, setOpportunities] = useState([]);
  const [loading, setLoading] = useState(true);
  const [schemaOk, setSchemaOk] = useState(null);
  const [slackBanner, setSlackBanner] = useState(false);

  const demoMode = !SB;

  async function loadAll() {
    console.log('[CRM] loadAll start, demoMode=', demoMode);
    setLoading(true);

    if (demoMode) {
      const u = LS.get('users');
      setUsers(u);
      const rawC = LS.get('contractors');
      const twoLevel = {};
      rawC.forEach(x => {
        const team = x.team || primaryTeam(CONTRACTOR_MAP.get(x.contractor_id)||{});
        if (!twoLevel[x.contractor_id]) twoLevel[x.contractor_id] = {};
        twoLevel[x.contractor_id][team] = { ...x, team };
      });
      setContractors(twoLevel);
      setInteractions(LS.get('interactions'));
      setTasks(LS.get('tasks'));
      if (u.length > 0) setCurrentUser(u[0]);
      setSchemaOk(true);
      setLoading(false);
      console.log('[CRM] demo mode loaded');
      return;
    }

    try {
      // 1. Load users with a hard 8-second timeout on the query
      console.log('[CRM] querying crm_users...');
      const usersQuery = SB.from('crm_users').select('*').order('created_at');
      const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('Query timeout — retrying without auth')), 8000));
      let udata, uerr;
      try {
        const result = await Promise.race([usersQuery, timeoutPromise]);
        udata = result.data;
        uerr = result.error;
      } catch(timeout) {
        // Query hung — clear everything and reload, no network calls
        console.warn('[CRM] Query timed out, reloading...');
        try { SB.auth.signOut(); } catch(e) {}
        localStorage.clear(); sessionStorage.clear();
        location.reload();
        return;
      }
      console.log('[CRM] crm_users result:', udata?.length, 'rows, error:', uerr);

      if (uerr) {
        if (uerr.code === '42P01' || uerr.message?.includes('does not exist')) {
          setSchemaOk(false); setLoading(false); return;
        }
        throw uerr;
      }

      const activeUsers = (udata || []).filter(u => u.is_active !== false);
      setSchemaOk(true);
      setUsers(activeUsers);

      // 2. Identify current user — NO network calls here, only use what we already have
      // Wait for SSO sync to guarantee the crm_users row exists (5s safety cap for network failures)
      if (window.__syncReady) await Promise.race([window.__syncReady, new Promise(r => setTimeout(r, 5000))]);
      // Fetch the current user directly by email — single row, always correct
      const ssoEmail = window.__ssoEmail;
      let me = null;
      if (ssoEmail) {
        const { data: meRow, error: meErr } = await SB.from('crm_users').select('*').eq('email', ssoEmail).maybeSingle();
        if (meErr) console.error('[CRM] currentUser lookup failed:', meErr);
        if (meRow) {
          me = meRow;
          // Ensure they're in activeUsers (first-login case)
          if (!activeUsers.find(u => u.id === meRow.id)) {
            activeUsers.push(meRow);
            setUsers([...activeUsers]);
          }
        } else {
          console.warn('[CRM] No crm_users row found for', ssoEmail, '— syncUserFromSSO may have failed');
        }
      }
      if (!me && activeUsers.length > 0) me = activeUsers[0];

      console.log('[CRM] currentUser:', me?.name, me?.email, '(ssoEmail:', ssoEmail, ')');
      setCurrentUser(me);

      if (me && !me.slack_user_id && !me.notification_preferences?.slack_enrichment_dismissed) {
        setSlackBanner(true);
      }

      // 3. Unblock UI — IMMEDIATELY, no more awaits between here and rendering
      setLoading(false);
      console.log('[CRM] loading=false, rendering pipeline');

      // 4. Load remaining data in parallel (non-blocking)
      Promise.all([
        SB.from('crm_contractors').select('*'),
        SB.from('crm_interactions').select('*').order('created_at',{ascending:false}).limit(500),
        SB.from('crm_tasks').select('*').order('due_date'),
        SB.from('crm_audiences').select('*').order('dat_created',{ascending:false}),
        SB.from('crm_conversions').select('*').order('converted_at',{ascending:false}).limit(500),
        SB.from('crm_audience_pushes').select('*').order('pushed_at',{ascending:false}).limit(200),
        SB.from('crm_notifications').select('*').eq('user_id', me?.id||'').order('created_at',{ascending:false}).limit(200),
        SB.from('crm_dashboards').select('*').order('updated_at',{ascending:false}),
        SB.from('crm_onsight_snapshots').select('*'),
        SB.from('crm_opportunities').select('*').order('created_at',{ascending:false}).limit(2000),
      ]).then(([{data:cdata},{data:idata},{data:tdata},{data:adata},{data:convData},{data:pushesData},{data:notifsData},{data:dashData},{data:snapshotData},{data:oppData}]) => {
        const twoLevel = {};
        (cdata||[]).forEach(x => {
          const team = x.team || 'ACTIVATION';
          if (!twoLevel[x.contractor_id]) twoLevel[x.contractor_id] = {};
          twoLevel[x.contractor_id][team] = x;
        });
        setContractors(twoLevel);
        setInteractions(idata||[]);
        setTasks(tdata||[]);
        setAudiences(adata||[]);
        setConversions(convData||[]);
        setAudiencePushes(pushesData||[]);
        if (notifsData) setNotifications(notifsData);
        if (dashData) setMyDashboards(dashData);
        // onsight snapshots removed — analytics now read from CONTRACTOR_MAP directly
        if (oppData) setOpportunities(oppData);
        console.log('[CRM] background data loaded:', (cdata||[]).length, 'contractors,', (idata||[]).length, 'interactions,', (tdata||[]).length, 'tasks,', (adata||[]).length, 'audiences,', (convData||[]).length, 'conversions');
      }).catch(e => console.warn('[CRM] background load error:', e));

    } catch(e) {
      console.error('[CRM] loadAll failed:', e);
      toast('Failed to load CRM data: ' + (e.message || e), 'error');
      setSchemaOk(true); // assume schema ok to avoid schema screen
      setLoading(false);
    }
  }

  useEffect(() => { loadAll(); }, []);

  // Real-time notification delivery — subscribe to new rows for the current user
  useEffect(() => {
    if (!SB || !currentUser?.id || demoMode) return;
    const channel = SB.channel('crm-notifs-' + currentUser.id)
      .on('postgres_changes', {
        event: 'INSERT',
        schema: 'public',
        table: 'crm_notifications',
        filter: `user_id=eq.${currentUser.id}`,
      }, payload => {
        setNotifications(prev => {
          if (prev.some(n => n.id === payload.new.id)) return prev;
          return [payload.new, ...prev];
        });
      })
      .subscribe();
    return () => { SB.removeChannel(channel); };
  }, [currentUser?.id, demoMode]);

  // Recompute duplicate issues whenever pipeline data changes
  useEffect(() => {
    if (Object.keys(contractors).length === 0 && interactions.length === 0) return;
    // Flatten two-level state for detectDuplicates (expects flat contractor map with best records)
    const flatContractors = {};
    Object.entries(contractors).forEach(([cid, teams]) => {
      const best = getBestContractorRecord(contractors, cid);
      if (best) flatContractors[cid] = best;
    });
    setDuplicateIssues(detectDuplicates(flatContractors, interactions, conversions));
  }, [contractors, interactions, conversions]);

  // ── Mutation helpers ──
  async function updateStage(contractorId, newStage, team) {
    if (!team) { console.error('updateStage: team is required'); return; }
    // Auto-close when moving to terminal stages
    if (newStage === 'Converted' || newStage === 'Not Interested') {
      const closedReason = newStage === 'Converted' ? 'converted' : 'not_interested';
      await closeOpportunity(contractorId, team, closedReason);
      return;
    }
    const prev = contractors[contractorId]?.[team];
    const updated = {...prev, pipeline_stage:newStage, dat_stage_changed:new Date().toISOString(), dat_updated:new Date().toISOString()};
    setContractors(c=>({...c,[contractorId]:{...c[contractorId],[team]:updated}}));
    try {
      if (demoMode) {
        const arr = LS.get('contractors').map(x=>(x.contractor_id===contractorId&&x.team===team)?updated:x);
        LS.set('contractors', arr);
      } else {
        const {error} = await SB.from('crm_contractors')
          .update({pipeline_stage:newStage, dat_stage_changed:updated.dat_stage_changed, dat_updated:updated.dat_updated})
          .eq('contractor_id', contractorId)
          .eq('team', team);
        if (error) throw error;
      }
      toast('Stage updated','success');
    } catch(e) {
      console.error('updateStage failed:', e);
      setContractors(c=>({...c,[contractorId]:{...c[contractorId],[team]:prev}}));
      toast('Failed to save — check Supabase connection','error');
    }
  }

  async function assignOwner(contractorId, userId, team) {
    if (!team) { console.error('assignOwner: team is required'); return; }
    const prev = contractors[contractorId]?.[team];
    const updated = {...prev, assigned_to:userId, dat_updated:new Date().toISOString()};
    setContractors(c=>({...c,[contractorId]:{...c[contractorId],[team]:updated}}));
    try {
      if (demoMode) {
        LS.set('contractors', LS.get('contractors').map(x=>(x.contractor_id===contractorId&&x.team===team)?updated:x));
      } else {
        const {error} = await SB.from('crm_contractors')
          .update({assigned_to:userId, dat_updated:updated.dat_updated})
          .eq('contractor_id', contractorId)
          .eq('team', team);
        if (error) throw error;
      }
    } catch(e) {
      setContractors(c=>({...c,[contractorId]:{...c[contractorId],[team]:prev}}));
      toast('Failed to assign owner','error');
    }
  }

  async function ensureContractor(id, team) {
    // Only create a record for a team that already has the contractor in pipeline.
    // Never auto-create when profile is viewed cold (e.g. from Dashboard tab).
    if (!team) team = primaryTeam(CONTRACTOR_MAP.get(id)||{});
    // If no record exists for ANY team, the contractor hasn't been added to pipeline — don't create one.
    if (!contractors[id] || Object.keys(contractors[id]).length === 0) return;
    // Contractor is in pipeline under at least one team. Ensure the specific team record exists.
    if (contractors[id]?.[team]) return;
    const fin = CONTRACTOR_MAP.get(id)||{};
    let seg='COLD';
    if (fin.contract_state==='ENDED'||fin.contract_state==='DELETED') seg='GLOBAL_ACCOUNT';
    else if (!fin.is_reserve) seg='RESERVE';
    else if (!fin.ff_net||fin.ff_net<=0) seg='FUTURE_FUND';
    const rec = {contractor_id:id,team,upsell_segment:seg,pipeline_stage:'Identified',lead_score:computeLeadScore(fin),added_by:currentUser?.id||null,dat_created:new Date().toISOString(),dat_updated:new Date().toISOString()};
    setContractors(c=>({...c,[id]:{...c[id],[team]:rec}}));
    try {
      if (demoMode) {
        LS.set('contractors',[...LS.get('contractors'),rec]);
      } else {
        await SB.from('crm_contractors').upsert(rec);
      }
    } catch(e) { console.warn(e); }
  }

  async function addToPipeline(contractorId, segment, assignTo=null, note=null, team=null) {
    const fin = CONTRACTOR_MAP.get(contractorId)||{};
    const t = team || primaryTeam(fin);
    const rec = {
      contractor_id: contractorId,
      team: t,
      upsell_segment: segment,
      pipeline_stage: 'Identified',
      lead_score: computeLeadScore(fin),
      assigned_to: assignTo || null,
      added_by: currentUser?.id || null,
      dat_created: new Date().toISOString(),
      dat_updated: new Date().toISOString(),
    };
    setContractors(c => ({...c, [contractorId]: {...c[contractorId], [t]: rec}}));
    try {
      if (demoMode) {
        LS.set('contractors', [...LS.get('contractors'), rec]);
      } else {
        const {error} = await SB.from('crm_contractors').upsert(rec);
        if (error) throw error;
      }
      if (note && note.trim()) {
        await addInteraction(contractorId, 'note', note.trim());
      }
      toast('Added to pipeline', 'success');
      return true;
    } catch(e) {
      setContractors(c => {
        const updated = {...c};
        if (updated[contractorId]) {
          const teamRecs = {...updated[contractorId]};
          delete teamRecs[t];
          if (Object.keys(teamRecs).length === 0) delete updated[contractorId];
          else updated[contractorId] = teamRecs;
        }
        return updated;
      });
      toast('Failed to add: ' + e.message, 'error');
      return false;
    }
  }

  async function markNotificationRead(notifId) {
    setNotifications(prev => prev.map(n => n.id === notifId ? { ...n, read: true } : n));
    if (!demoMode && SB) await SB.from('crm_notifications').update({ read: true }).eq('id', notifId);
  }

  async function markAllNotificationsRead() {
    setNotifications(prev => prev.map(n => ({ ...n, read: true })));
    if (!demoMode && SB && currentUser?.id) {
      await SB.from('crm_notifications').update({ read: true }).eq('user_id', currentUser.id).eq('read', false);
    }
  }

  async function addInteraction(contractorId, type, content, outcome=null, mentions=[]) {
    const rec = { contractor_id:contractorId, type, content, outcome, created_by:currentUser?.id||null, created_at:new Date().toISOString() };
    setInteractions(prev=>[rec,...prev]);
    try {
      if (demoMode) {
        LS.set('interactions',[rec,...LS.get('interactions')]);
      } else {
        const {error,data} = await SB.from('crm_interactions').insert(rec).select().single();
        if (error) throw error;
        // Store mentions separately so missing column doesn't break the save
        if (mentions.length > 0 && data?.id) {
          SB.from('crm_interactions').update({ mentions }).eq('id', data.id).then(() => {});
        }
        setInteractions(prev=>[data,...prev.slice(1)]);
        // Create in-app notifications for mentioned users
        if (mentions.length > 0 && data?.id) {
          const notifRecs = mentions.map(uid => ({
            user_id: uid,
            from_user_id: currentUser?.id || null,
            contractor_id: contractorId,
            interaction_id: data.id,
            message: `${currentUser?.name||'Someone'} mentioned you in a note on contractor ${contractorId}`,
            read: false,
            created_at: new Date().toISOString(),
          }));
          const { data: newNotifs } = await SB.from('crm_notifications').insert(notifRecs).select();
          if (newNotifs) setNotifications(prev => [...newNotifs, ...prev]);
          // Slack DM if user has slack_handle
          const slackCfg = window.CRM_CONFIG?.integrations?.slack;
          if (slackCfg?.botToken || slackCfg?.userToken) {
            const token = slackCfg.botToken || slackCfg.userToken;
            for (const uid of mentions) {
              const u = users.find(x => x.id === uid);
              if (u?.slack_handle) {
                fetch('https://slack.com/api/chat.postMessage', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                  body: JSON.stringify({
                    channel: u.slack_handle,
                    text: `👋 *${currentUser?.name||'A teammate'}* mentioned you in a CRM note on contractor *${contractorId}*:\n>${content.replace(/</g,'&lt;')}`,
                  }),
                }).catch(() => {});
              }
            }
          }
        }
      }
    } catch(e) { toast('Failed to save','error'); }
  }

  async function updateInteraction(interactionId, changes) {
    setInteractions(prev => prev.map(x => x.id === interactionId ? { ...x, ...changes } : x));
    try {
      if (!demoMode) {
        const { error } = await SB.from('crm_interactions').update(changes).eq('id', interactionId);
        if (error) throw error;
      }
    } catch(e) {
      toast('Failed to update', 'error');
    }
  }

  async function deleteInteraction(interactionId) {
    const prev = interactions.find(x => x.id === interactionId);
    setInteractions(i => i.filter(x => x.id !== interactionId));
