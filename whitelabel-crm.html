  async function syncConversions() {
    if (conversionSyncing) return;
    setConversionSyncing(true);

    try {
      // Step A — detect new conversions via adapter
      const newConversions = await detectNewConversions();

      if (newConversions.length === 0) {
        setLastConversionSync(new Date());
        setConversionSyncing(false);
        return;
      }

      // Step B — deduplicate against existing crm_conversions
      let existingKeys = new Set();
      if (SB) {
        const { data: existing } = await SB
          .from('crm_conversions')
          .select('contractor_id,conversion_type')
          .in('contractor_id', newConversions.map(c => c.contractor_id));
        existingKeys = new Set(
          (existing || []).map(e => `${e.contractor_id}__${e.conversion_type}`)
        );
      }

      const toProcess = newConversions.filter(c =>
        !existingKeys.has(`${c.contractor_id}__${c.type}`)
      );

      if (toProcess.length === 0) {
        setLastConversionSync(new Date());
        setConversionSyncing(false);
        return;
      }

      // Step C — attribute each conversion using local interaction data
      // No extra API calls needed — uses interactions already loaded in context
      const attributed = await Promise.all(
        toProcess.map(c => attributeConversion(c, interactions, contractors))
      );

      // Step D — write to Supabase
      if (SB && attributed.length > 0) {
        const { error } = await SB
          .from('crm_conversions')
          .insert(attributed);
        if (error) throw error;
      }

      // Step E — update local state
      setConversions(prev => [...attributed, ...prev]);

      // Step F — auto-update pipeline stages for converted contractors (all team records)
      for (const conv of attributed) {
        const teamRecs = contractors[conv.contractor_id];
        if (teamRecs && SB) {
          for (const [team, rec] of Object.entries(teamRecs)) {
            if (rec.pipeline_stage !== 'Converted') {
              await SB.from('crm_contractors')
                .update({
                  pipeline_stage: 'Converted',
                  dat_stage_changed: conv.converted_at,
                  dat_updated: new Date().toISOString(),
                })
                .eq('contractor_id', conv.contractor_id)
                .eq('team', team);
            }
          }
          setContractors(prev => {
            const updatedTeams = {};
            Object.entries(prev[conv.contractor_id] || {}).forEach(([t, r]) => {
              updatedTeams[t] = { ...r, pipeline_stage: 'Converted' };
            });
            return { ...prev, [conv.contractor_id]: updatedTeams };
          });
        }
        // Also close matching open opportunities
        const convProductMap = { 'RESERVE': 'Reserve', 'FUTURE_FUND': 'Future Fund', 'GLOBAL_ACCOUNT': 'Personal Account' };
        const matchProduct = convProductMap[conv.conversion_type] || null;
        const openOpps = opportunities.filter(o =>
          o.contractor_id === conv.contractor_id && !o.closed_at &&
          (!matchProduct || o.product === matchProduct)
        );
        for (const opp of openOpps) {
          await closeOpportunityById(opp.id, 'converted');
        }
      }

      setLastConversionSync(new Date());
      console.log(`Sync complete: ${attributed.length} new conversions written`);

    } catch(e) {
      console.error('Conversion sync failed:', e);
    }

    setConversionSyncing(false);
  }

  async function deletePipelineRecord(contractorId, team) {
    if (!team) { console.error('deletePipelineRecord: team is required'); return false; }
    try {
      if (!demoMode && SB) {
        // Delete the pipeline record for this contractor+team (crm_conversions are NOT deleted — historical data)
        await SB.from('crm_contractors')
          .delete()
          .eq('contractor_id', contractorId)
          .eq('team', team);

        // Only delete interactions/tasks if no other team records remain
        const remaining = Object.keys(contractors[contractorId] || {}).filter(t => t !== team);
        if (remaining.length === 0) {
          await SB.from('crm_interactions').delete().eq('contractor_id', contractorId);
          await SB.from('crm_tasks').delete().eq('contractor_id', contractorId);
        }
      }

      // Update local state
      setContractors(prev => {
        const updated = { ...prev };
        if (updated[contractorId]) {
          const teamRecs = { ...updated[contractorId] };
          delete teamRecs[team];
          if (Object.keys(teamRecs).length === 0) delete updated[contractorId];
          else updated[contractorId] = teamRecs;
        }
        return updated;
      });

      toast('Removed from pipeline', 'success');
      return true;
    } catch(e) {
      toast('Failed to remove from pipeline: ' + e.message, 'error');
      return false;
    }
  }

  async function closeOpportunity(contractorId, team, closedReason, note = null) {
    const existing = contractors[contractorId]?.[team];
    if (!existing) return;
    if (existing.closed_at) {
      toast('This opportunity is already closed', 'error');
      return;
    }
    const wasContacted = interactions.some(i => i.contractor_id === contractorId);
    const reEngagementDate = computeReEngagementDate(closedReason, wasContacted);
    const updates = {
      closed_at: new Date().toISOString(),
      closed_reason: closedReason,
      re_engagement_eligible_at: reEngagementDate,
      pipeline_stage: closedReason === 'converted' ? 'Converted'
        : closedReason === 'not_interested' ? 'Not Interested'
        : existing.pipeline_stage,
      dat_updated: new Date().toISOString(),
    };
    setContractors(prev => ({
      ...prev,
      [contractorId]: { ...prev[contractorId], [team]: { ...existing, ...updates } }
    }));
    if (!demoMode && SB) {
      const { error } = await SB.from('crm_contractors')
        .update(updates)
        .eq('contractor_id', contractorId)
        .eq('team', team);
      if (error) {
        setContractors(prev => ({
          ...prev,
          [contractorId]: { ...prev[contractorId], [team]: existing }
        }));
        toast('Failed to close opportunity: ' + error.message, 'error');
        return;
      }
    }
    if (note?.trim() && SB) {
      await SB.from('crm_interactions').insert({
        contractor_id: contractorId,
        type: 'note',
        content: `Opportunity closed (${closedReason}): ${note}`,
        created_by: currentUser?.id,
        created_at: new Date().toISOString(),
      });
    }
    await logAudit(
      'contractor', contractorId, contractorId, 'updated',
      [
        { field: 'closed_reason', from: null, to: closedReason },
        { field: 're_engagement_eligible_at', from: null, to: reEngagementDate },
      ],
      { team, note }
    );
    const reLabel = reEngagementDate
      ? `Re-engagement eligible ${fmt.short(reEngagementDate)}`
      : 'No re-engagement scheduled';
    toast(`Opportunity closed (${closedReason.replace('_',' ')}) · ${reLabel}`, 'success');
  }

  async function createOpportunity(contractorIdOrOpts, product, team, assignTo = null, sourceAudienceId = null) {
    let contractorId = contractorIdOrOpts, reason = null;
    if (contractorIdOrOpts && typeof contractorIdOrOpts === 'object') {
      ({ contractor_id: contractorId, product, team, assigned_to: assignTo = null, source_audience_id: sourceAudienceId = null, reason = null } = contractorIdOrOpts);
    }
    const fin = CONTRACTOR_MAP.get(contractorId) || {};
    const ev = computeExpectedValue(product, fin);
    const prob = STAGE_PROBABILITIES['Identified'] || 10;
    const wv = computeWeightedValue(product, 'Identified', fin);
    const rec = {
      id: crypto.randomUUID(),
      contractor_id: contractorId,
      product,
      team: team || PRODUCT_CATALOG[product]?.defaultTeam || primaryTeam(fin),
      pipeline_stage: 'Identified',
      assigned_to: assignTo || null,
      expected_value: ev,
      probability: prob,
      weighted_value: wv,
      source_audience_id: sourceAudienceId || null,
      generation: 1,
      created_by: currentUser?.id || null,
      created_at: new Date().toISOString(),
      updated_at: new Date().toISOString(),
      dat_stage_changed: new Date().toISOString(),
    };
    setOpportunities(prev => [rec, ...prev]);
    try {
      if (!demoMode && SB) {
        const { data, error } = await SB.from('crm_opportunities').insert(rec).select().single();
        if (error) throw error;
        setOpportunities(prev => prev.map(o => o.id === rec.id ? data : o));
      }
      toast(`Opportunity opened — ${product}`, 'success');
      return rec;
    } catch(e) {
      setOpportunities(prev => prev.filter(o => o.id !== rec.id));
      toast('Failed to create opportunity: ' + e.message, 'error');
      return null;
    }
  }

  async function updateOpportunityStage(oppId, newStage) {
    if (newStage === 'Converted' || newStage === 'Not Interested') {
      await closeOpportunityById(oppId, newStage === 'Converted' ? 'converted' : 'not_interested');
      return;
    }
    const opp = opportunities.find(o => o.id === oppId);
    if (!opp) return;
    const fin = CONTRACTOR_MAP.get(opp.contractor_id) || {};
    const prob = STAGE_PROBABILITIES[newStage] ?? opp.probability;
    const wv = computeWeightedValue(opp.product, newStage, fin);
    const updates = {
      pipeline_stage: newStage,
      probability: prob,
      weighted_value: wv,
      dat_stage_changed: new Date().toISOString(),
      updated_at: new Date().toISOString(),
    };
    setOpportunities(prev => prev.map(o => o.id === oppId ? { ...o, ...updates } : o));
    try {
      if (!demoMode && SB) {
        const { error } = await SB.from('crm_opportunities').update(updates).eq('id', oppId);
        if (error) throw error;
      }
      toast('Stage updated', 'success');
    } catch(e) {
      setOpportunities(prev => prev.map(o => o.id === oppId ? opp : o));
      toast('Failed to update stage', 'error');
    }
  }

  async function closeOpportunityById(oppId, closedReason, note = null) {
    const opp = opportunities.find(o => o.id === oppId);
    if (!opp) return;
    if (opp.closed_at) { toast('Opportunity already closed', 'error'); return; }
    const wasContacted = interactions.some(i => i.contractor_id === opp.contractor_id);
    const reEngDate = computeReEngagementDate(closedReason, wasContacted);
    const updates = {
      closed_at: new Date().toISOString(),
      closed_reason: closedReason,
      re_engagement_eligible_at: reEngDate,
      pipeline_stage: closedReason === 'converted' ? 'Converted' : closedReason === 'not_interested' ? 'Not Interested' : opp.pipeline_stage,
      probability: closedReason === 'converted' ? 100 : 0,
      weighted_value: closedReason === 'converted' ? opp.expected_value : 0,
      updated_at: new Date().toISOString(),
    };
    setOpportunities(prev => prev.map(o => o.id === oppId ? { ...o, ...updates } : o));
    try {
      if (!demoMode && SB) {
        const { error } = await SB.from('crm_opportunities').update(updates).eq('id', oppId);
        if (error) throw error;
        if (note?.trim()) {
          await SB.from('crm_interactions').insert({
            contractor_id: opp.contractor_id,
            type: 'note',
            content: `Opp closed (${closedReason}) — ${opp.product}: ${note}`,
            created_by: currentUser?.id,
            created_at: new Date().toISOString(),
          });
        }
      }
      const reLabel = reEngDate ? `Re-engage ${fmt.short(reEngDate)}` : 'No re-engagement';
      toast(`Opportunity closed (${closedReason.replace(/_/g,' ')}) · ${reLabel}`, 'success');
    } catch(e) {
      setOpportunities(prev => prev.map(o => o.id === oppId ? opp : o));
      toast('Failed to close opportunity', 'error');
    }
  }

  async function createReEngagementOpportunity(fromOppId) {
    const source = opportunities.find(o => o.id === fromOppId);
    if (!source || !source.closed_at) return;
    if (!isReEngagementEligible(source)) { toast('Not yet eligible for re-engagement', 'warn'); return; }
    const newOpp = await createOpportunity(source.contractor_id, source.product, source.team, source.assigned_to, source.source_audience_id);
    if (newOpp) {
      const gen = (source.generation || 1) + 1;
      if (!demoMode && SB) {
        await SB.from('crm_opportunities').update({ generation: gen }).eq('id', newOpp.id).catch(() => {});
      }
      setOpportunities(prev => prev.map(o => o.id === newOpp.id ? { ...o, generation: gen } : o));
      toast(`Re-engagement opened (Gen ${gen})`, 'success');
    }
  }

  async function saveAudience(audienceData) {
    const isNew = !audienceData.id;
    const { matches, exclusionBreakdown } = evaluateAudience(
      audienceData, interactions, conversions, contractors, audiences
    );
    const rec = {
      ...audienceData,
      ...(isNew ? { created_by: currentUser?.id || null } : {}),
      dat_updated: new Date().toISOString(),
      ...(isNew ? { dat_created: new Date().toISOString() } : {}),
      member_count: matches.length,
    };
    if (audienceData.audience_type === 'static') {
      rec.static_member_ids = matches;
    }
    if (!isNew) {
      // Never allow created_by or dat_created to be overwritten on update
      delete rec.created_by;
      delete rec.dat_created;
    }
    try {
      if (demoMode) {
        const full = { ...rec, id: rec.id || crypto.randomUUID(), dat_created: new Date().toISOString() };
        setAudiences(prev => isNew ? [full, ...prev] : prev.map(a => a.id === full.id ? full : a));
        toast('Audience saved', 'success');
        return full;
      }
      const { data, error } = await SB.from('crm_audiences').upsert(rec, { onConflict: 'id' }).select().single();
      if (error) throw error;
      setAudiences(prev => isNew ? [data, ...prev] : prev.map(a => a.id === data.id ? data : a));
      toast('Audience saved', 'success');

      // Audit log
      if (isNew) {
        await logAudit(
          'audience', data.id, data.name, 'created',
          Object.entries({
            name: data.name,
            description: data.description,
            audience_type: data.audience_type,
            team: data.team,
            size_limit: data.size_limit,
            filter_rules: JSON.stringify(data.filter_rules),
            member_count: data.member_count,
          }).map(([field, value]) => ({ field, value }))
        );
      } else {
        const existing = audiences.find(a => a.id === audienceData.id);
        const changedFields = [];
        const trackFields = ['name','description','audience_type','team','size_limit','filter_rules'];
        trackFields.forEach(field => {
          const before = field === 'filter_rules' ? JSON.stringify(existing?.[field]) : existing?.[field];
          const after  = field === 'filter_rules' ? JSON.stringify(audienceData[field]) : audienceData[field];
          if (before !== after) changedFields.push({ field, from: before ?? null, to: after ?? null });
        });
        if (changedFields.length > 0) {
          await logAudit('audience', data.id, data.name, 'updated', changedFields);
        }
      }

      return data;
    } catch(e) {
      toast('Failed to save audience: ' + e.message, 'error');
      return null;
    }
  }

  async function pushAudience(audienceId, integration, pushExclusions = null) {
    const audience = audiences.find(a => a.id === audienceId);
    if (!audience) return;
    const effectiveAudience = pushExclusions ? { ...audience, ...pushExclusions } : audience;
    const { matches: snapshotIds, exclusionBreakdown } = evaluateAudience(
      effectiveAudience, interactions, conversions, contractors, audiences
    );

    let pushStatus = 'pending';
    let pushError = null;
    let brazeResult = null;

    try {
      // ── Braze API push ──────────────────────────────────────────────
      if (integration === 'braze') {
        const brazeCfg = window.CRM_CONFIG?.integrations?.braze;
        if (!brazeCfg?.apiKey || !brazeCfg?.instanceUrl) throw new Error('Braze not configured — add API key and instance URL in Settings');

        const audienceSlug = 'crm_audience_' + audience.name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');

        // Get previous push snapshot to compute removals
        let previousIds = [];
        if (!demoMode && SB) {
          const { data: prevPush } = await SB.from('crm_audience_pushes')
            .select('snapshot_ids')
            .eq('audience_id', audienceId).eq('integration', 'braze').eq('status', 'success')
            .order('pushed_at', { ascending: false }).limit(1).maybeSingle();
          if (prevPush?.snapshot_ids) previousIds = prevPush.snapshot_ids;
        }

        const currentSet = new Set(snapshotIds);
        const previousSet = new Set(previousIds);
        const toAdd = snapshotIds.filter(id => !previousSet.has(id));
        const toRemove = previousIds.filter(id => !currentSet.has(id));

        // Build Braze /users/track attribute payloads
        const addPayloads = snapshotIds.map(id => ({
          external_id: String(id),
          [audienceSlug]: true,
          [`${audienceSlug}_updated_at`]: new Date().toISOString(),
        }));
        const removePayloads = toRemove.map(id => ({
          external_id: String(id),
          [audienceSlug]: false,
          [`${audienceSlug}_updated_at`]: new Date().toISOString(),
        }));
        const allPayloads = [...addPayloads, ...removePayloads];

        // Send in batches of 75 (Braze limit)
        const BATCH = 75;
        let totalProcessed = 0;
        for (let i = 0; i < allPayloads.length; i += BATCH) {
          const batch = allPayloads.slice(i, i + BATCH);
          const resp = await fetch(`${brazeCfg.instanceUrl.replace(/\/+$/, '')}/users/track`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${brazeCfg.apiKey}` },
            body: JSON.stringify({ attributes: batch }),
          });
          if (!resp.ok) {
            const errBody = await resp.text().catch(() => '');
            throw new Error(`Braze API ${resp.status}: ${errBody.slice(0, 200)}`);
          }
          totalProcessed += batch.length;
        }

        pushStatus = 'success';
        brazeResult = {
          attribute: audienceSlug,
          added: toAdd.length, kept: snapshotIds.length - toAdd.length,
          removed: toRemove.length, total_synced: totalProcessed,
        };
      }
      // ── Other integrations (record-only for now) ────────────────────
      // Zendesk and others: log as pending until implemented

      const pushRec = {
        id: crypto.randomUUID(),
        audience_id: audienceId, integration,
        pushed_by: currentUser?.id || null,
        snapshot_ids: snapshotIds, snapshot_count: snapshotIds.length,
        status: pushStatus, pushed_at: new Date().toISOString(),
        exclusion_snapshot: {
          ...exclusionBreakdown,
          base_count: snapshotIds.length + exclusionBreakdown.total,
          final_count: snapshotIds.length,
          ...(brazeResult ? { braze: brazeResult } : {}),
        },
      };
      if (!demoMode && SB) {
        await SB.from('crm_audience_pushes').insert(pushRec);
        // Update last_push_at on the audience row
        await SB.from('crm_audiences').update({ last_push_at: pushRec.pushed_at }).eq('id', audienceId);
      }
      // Refresh local push history state
      setAudiencePushes(prev => [pushRec, ...prev]);
      // Update audience's last_push_at in local state
      setAudiences(prev => prev.map(a => a.id === audienceId ? { ...a, last_push_at: pushRec.pushed_at } : a));

      if (integration === 'braze' && brazeResult) {
        toast(
          `Braze synced — ${snapshotIds.length} tagged "${brazeResult.attribute}"` +
          (brazeResult.removed > 0 ? `, ${brazeResult.removed} removed` : '') +
          (exclusionBreakdown.total > 0 ? ` (${exclusionBreakdown.total} excluded)` : ''),
          'success'
        );
      } else {
        toast(
          `${integration} push queued — ${snapshotIds.length} contractors` +
          (exclusionBreakdown.total > 0 ? ` (${exclusionBreakdown.total} excluded)` : ''),
          'success'
        );
      }

      await logAudit(
        'audience', audienceId, audience?.name, 'pushed',
        null,
        { integration, snapshot_count: snapshotIds.length, exclusion_breakdown: exclusionBreakdown, ...(brazeResult || {}) }
      );
    } catch(e) {
      // Log failed push
      const failedRec = {
        id: crypto.randomUUID(),
        audience_id: audienceId, integration,
        pushed_by: currentUser?.id || null,
        snapshot_ids: snapshotIds, snapshot_count: snapshotIds.length,
        status: 'failed', pushed_at: new Date().toISOString(),
        exclusion_snapshot: { error: e.message },
      };
      if (!demoMode && SB) {
        await SB.from('crm_audience_pushes').insert(failedRec).catch(() => {});
      }
      setAudiencePushes(prev => [failedRec, ...prev]);
      toast('Push failed: ' + e.message, 'error');
    }
  }

  async function saveDashboard(data) {
    const now = new Date().toISOString();
    if (data.id) {
      const updated = { ...data, updated_at: now };
      setMyDashboards(prev => prev.map(d => d.id === data.id ? updated : d));
      if (!demoMode && SB) await SB.from('crm_dashboards').update(updated).eq('id', data.id);
      return updated;
    } else {
      const rec = { ...data, owner_id: currentUser?.id || null, created_at: now, updated_at: now };
      if (!demoMode && SB) {
        const { data: inserted } = await SB.from('crm_dashboards').insert(rec).select().single();
        if (inserted) { setMyDashboards(prev => [inserted, ...prev]); return inserted; }
      }
      const withId = { ...rec, id: crypto.randomUUID() };
      setMyDashboards(prev => [withId, ...prev]);
      return withId;
    }
  }

  async function deleteDashboard(id) {
    setMyDashboards(prev => prev.filter(d => d.id !== id));
    if (!demoMode && SB) await SB.from('crm_dashboards').delete().eq('id', id);
  }

  const value = {
    demoMode, loading, schemaOk,
    users, currentUser, setUsers, setCurrentUser,
    viewingAs, setViewingAs, effectiveViewUser,
    slackBanner, dismissSlackBanner, connectSlack,
    contractors, interactions, tasks,
    getContractorRecord, getAllContractorRecords, isInPipeline, getBestContractorRecord,
    updateStage, assignOwner, ensureContractor, addToPipeline, deletePipelineRecord,
    closeOpportunity, reopenOpportunity,
    opportunities, createOpportunity, updateOpportunityStage, closeOpportunityById, createReEngagementOpportunity,
    addInteraction, updateInteraction, deleteInteraction, addTask, toggleTask, addUser,
    notifications, markNotificationRead, markAllNotificationsRead,
    deactivateUser, promoteUser,
    audiences, saveAudience, deleteAudience, pushAudience, logAudit,
    audiencePushes,
    conversions, conversionSyncing, lastConversionSync, syncConversions,
    duplicateIssues,
    myDashboards, saveDashboard, deleteDashboard,
    onsightSnapshots,
    reload: loadAll,
  };

  // Expose setViewingAs globally for the banner button
  window.__crmCtx = { setViewingAs, setTeamFilter: () => {} }; // setTeamFilter injected by CRMApp

  return <CRMCtx.Provider value={value}>{children}</CRMCtx.Provider>;
}

  const myRecs  = useMemo(() => allRecs.filter(r => r.assigned_to === currentUser?.id), [allRecs, currentUser]);

  const stageCounts = useMemo(() => {
    const s = { Identified:0, Contacted:0, Engaged:0, Converted:0, 'Not Interested':0 };
    allRecs.forEach(r => { if (s[r.pipeline_stage] != null) s[r.pipeline_stage]++; });
    return Object.entries(s).map(([stage, count]) => ({ stage, count }));
  }, [allRecs]);

  const segCounts = useMemo(() => {
    const s = {};
    allRecs.forEach(r => { s[r.upsell_segment] = (s[r.upsell_segment]||0)+1; });
    return Object.entries(s).map(([seg, count]) => ({ seg, count })).sort((a,b)=>b.count-a.count);
  }, [allRecs]);

  const ownerCounts = useMemo(() => {
    const s = {};
    allRecs.forEach(r => {
      const uid = r.assigned_to;
      if (!uid) { s['Unassigned'] = (s['Unassigned']||0)+1; return; }
      const u = users.find(x=>x.id===uid);
      const name = u ? (u.full_name||u.email) : 'Unknown';
      s[name] = (s[name]||0)+1;
    });
    return Object.entries(s).map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count).slice(0,8);
  }, [allRecs, users]);

  const countryCounts = useMemo(() => {
    const s = {};
    allRecs.forEach(r => {
      const fin = CONTRACTOR_MAP.get(r.contractor_id)||{};
      const c = fin.country||'Unknown';
      s[c] = (s[c]||0)+1;
    });
    return Object.entries(s).map(([country,count])=>({country,count})).sort((a,b)=>b.count-a.count).slice(0,10);
  }, [allRecs]);

  const interactionTrend = useMemo(() => {
    const days = {};
    for (let i=29; i>=0; i--) {
      const d = new Date(); d.setDate(d.getDate()-i);
      days[d.toISOString().slice(0,10)] = 0;
    }
    interactions.forEach(x => { const d = (x.created_at||'').slice(0,10); if (days[d]!=null) days[d]++; });
    return Object.entries(days).map(([date,count])=>({date:date.slice(5),count}));
  }, [interactions]);

  const overdueTasks = useMemo(() => tasks.filter(t => !t.is_completed && t.due_date && t.due_date < today && t.assigned_to === currentUser?.id), [tasks, today, currentUser]);
  const myOpenTasks  = useMemo(() => tasks.filter(t => !t.is_completed && t.assigned_to === currentUser?.id).sort((a,b)=>(a.due_date||'9999') < (b.due_date||'9999') ? -1 : 1), [tasks, currentUser]);

  const topAudiences = useMemo(() => [...audiences].sort((a,b) => (b.member_count||0)-(a.member_count||0)).slice(0,8), [audiences]);

  const convertedMonth = useMemo(() => allRecs.filter(r => r.pipeline_stage==='Converted' && (r.dat_stage_changed||'').startsWith(thisMonth)).length, [allRecs, thisMonth]);

  const recentAdditions = useMemo(() => [...allRecs].sort((a,b)=>new Date(b.dat_created||0)-new Date(a.dat_created||0)).slice(0,10), [allRecs]);

  const reserveRate = useMemo(() => {
    let total=0, res=0;
    for (const [,fin] of CONTRACTOR_MAP) { total++; if (fin.is_reserve) res++; }
    return total>0 ? (100*res/total).toFixed(1) : 0;
  }, []);

  const totalWallet = useMemo(() => { let s=0; for (const [,fin] of CONTRACTOR_MAP) s+=fin.wallet||0; return s; }, []);

  return { allRecs, myRecs, stageCounts, segCounts, ownerCounts, countryCounts, interactionTrend, overdueTasks, myOpenTasks, topAudiences, convertedMonth, recentAdditions, reserveRate, totalWallet };
}

function OnsightWidgetCard({ widget, onDrillDown, refreshKey }) {
  const [data, setData] = React.useState([]);
  const [viewMode, setViewMode] = React.useState(widget.chart_type || 'bar');
  const [loading, setLoading] = React.useState(true);

  React.useEffect(() => {
    setLoading(true);
    try {
      const agg = widget.aggregation || 'count';
      const xField = widget.x_field;
      const yField = widget.y_field;
      const groups = {};

      for (const [, fin] of CONTRACTOR_MAP) {
        const key = String(fin[xField] || '(none)');
        if (!groups[key]) groups[key] = { _count: 0, _sum: 0, _values: [] };
        groups[key]._count += 1;
        const numVal = Number(fin[yField]) || 0;
        groups[key]._sum += numVal;
        groups[key]._values.push(numVal);
        if (agg === 'rate' && fin[yField]) groups[key]._truthy = (groups[key]._truthy || 0) + 1;
      }

      const rows = Object.entries(groups).map(([k, g]) => {
        let yVal;
        if (agg === 'count') yVal = g._count;
        else if (agg === 'sum') yVal = Math.round(g._sum * 100) / 100;
        else if (agg === 'avg') yVal = g._count > 0 ? Math.round(g._sum / g._count * 100) / 100 : 0;
        else if (agg === 'rate') yVal = g._count > 0 ? Math.round((g._truthy || 0) / g._count * 10000) / 100 : 0;
        else yVal = g._count;
        return { [xField]: k, [yField === 'count' ? 'count' : yField]: yVal, _count: g._count };
      });

      rows.sort((a, b) => (b[yField === 'count' ? 'count' : yField] || 0) - (a[yField === 'count' ? 'count' : yField] || 0));
      setData(rows.slice(0, 25));
    } catch(e) {
      console.warn('AnalyticsWidgetCard error:', e);
      setData([]);
    }
    setLoading(false);
  }, [widget.type, refreshKey]);

  const yKey = widget.y_field === 'count' ? 'count' : widget.y_field;

  return (
    <div className="card p-4" style={{minHeight:220}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
        <div>
          <div style={{fontWeight:600,fontSize:13,color:'var(--text-primary)'}}>{widget.label}</div>
          {widget.description && <div style={{fontSize:11,color:'var(--text-secondary)',marginTop:2}}>{widget.description}</div>}
        </div>
        <div style={{display:'flex',gap:4}}>
          <button onClick={()=>setViewMode('bar')} style={{fontSize:11,padding:'2px 8px',borderRadius:6,border:'0.5px solid var(--border-default)',background:viewMode==='bar'?'#602DF5':'var(--bg-subtle)',color:viewMode==='bar'?'#fff':'var(--text-secondary)',cursor:'pointer'}}>Chart</button>
          <button onClick={()=>setViewMode('table')} style={{fontSize:11,padding:'2px 8px',borderRadius:6,border:'0.5px solid var(--border-default)',background:viewMode==='table'?'#602DF5':'var(--bg-subtle)',color:viewMode==='table'?'#fff':'var(--text-secondary)',cursor:'pointer'}}>Table</button>
        </div>
      </div>

      {loading ? (
        <div style={{height:140,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text-muted)',fontSize:12}}>Loading…</div>
      ) : data.length === 0 ? (
        <div style={{height:140,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text-muted)',fontSize:12}}>No data available</div>
      ) : viewMode === 'bar' ? (
        <ResponsiveContainer width="100%" height={160}>
          <BarChart data={data} margin={{top:4,right:8,left:0,bottom:24}}>
            <CartesianGrid strokeDasharray="3 3" stroke="var(--border-default)" />
            <XAxis dataKey={widget.x_field} tick={{fontSize:10,fill:'var(--text-secondary)'}} angle={-30} textAnchor="end" interval={0} />
            <YAxis tick={{fontSize:10,fill:'var(--text-secondary)'}} />
            <RTooltip contentStyle={{background:'#fff',border:'0.5px solid var(--border-strong)',borderRadius:8,fontSize:12}} />
            <Bar dataKey={yKey} fill="#602DF5" radius={[4,4,0,0]}
              onClick={widget.drill_down_field ? (entry) => onDrillDown && onDrillDown(widget, entry) : undefined}
              style={widget.drill_down_field ? {cursor:'pointer'} : {}}
            />
          </BarChart>
        </ResponsiveContainer>
      ) : (
        <div style={{overflowX:'auto',maxHeight:180}}>
          <table style={{width:'100%',fontSize:12,borderCollapse:'collapse'}}>
            <thead>
              <tr style={{borderBottom:'0.5px solid var(--border-default)'}}>
                <th style={{textAlign:'left',padding:'4px 8px',color:'var(--text-secondary)',fontWeight:600}}>{widget.x_field}</th>
                <th style={{textAlign:'right',padding:'4px 8px',color:'var(--text-secondary)',fontWeight:600}}>{widget.y_label || yKey}</th>
              </tr>
            </thead>
            <tbody>
              {data.map((row,i) => (
                <tr key={i} style={{borderBottom:'0.5px solid var(--border-default)'}}>
                  <td style={{padding:'4px 8px',color:'var(--text-primary)'}}>{row[widget.x_field]}</td>
                  <td style={{padding:'4px 8px',color:'var(--text-primary)',textAlign:'right'}}>{row[yKey]?.toLocaleString?.() ?? row[yKey]}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

  const crmFiltered = WIDGET_CATALOG.filter(w =>
    w.label.toLowerCase().includes(search.toLowerCase()) || w.desc.toLowerCase().includes(search.toLowerCase())
  );
  const onsightFiltered = ONSIGHT_WIDGET_CATALOG.filter(w =>
    activeCategory !== 'CRM' && w.category === activeCategory
  );
  const searchingAll = search.length > 0;
  const onsightSearchFiltered = searchingAll
    ? ONSIGHT_WIDGET_CATALOG.filter(w => w.label.toLowerCase().includes(search.toLowerCase()) || w.desc.toLowerCase().includes(search.toLowerCase()))
    : onsightFiltered;

  const categories = ['CRM', ...ONSIGHT_WIDGET_CATEGORIES];

  const WCard = ({w, isOnsight}) => (
    <button key={w.type} onClick={()=>{onAdd(w);onClose();}}
      style={{padding:'10px 12px',borderRadius:10,textAlign:'left',cursor:'pointer',fontFamily:'Poppins,sans-serif',display:'flex',gap:8,alignItems:'flex-start',
        background:isOnsight?'rgba(96,45,245,0.03)':'#F5F4FA',
        border:`0.5px solid ${isOnsight?'rgba(96,45,245,0.15)':'#E2DFEF'}`}}
      onMouseEnter={e=>{e.currentTarget.style.borderColor='#602DF5';e.currentTarget.style.background='#EEEDFE';}}
      onMouseLeave={e=>{e.currentTarget.style.borderColor=isOnsight?'rgba(96,45,245,0.15)':'#E2DFEF';e.currentTarget.style.background=isOnsight?'rgba(96,45,245,0.03)':'#F5F4FA';}}>
      <span style={{fontSize:18,flexShrink:0}}>{w.icon}</span>
      <div>
        <div style={{fontSize:12,fontWeight:600,color:'#1A1630',marginBottom:2}}>{w.label}</div>
        <div style={{fontSize:10,color:'#9590C0',lineHeight:1.4}}>{w.desc}</div>
        {isOnsight && <div style={{fontSize:9,marginTop:4,padding:'1px 5px',borderRadius:3,display:'inline-block',background:'rgba(96,45,245,0.08)',color:'#602DF5',fontWeight:500}}>Live Onsight data</div>}
        {!isOnsight && <div style={{marginTop:4,fontSize:10,color:'#B8B4D4'}}>{w.size==='sm'?'Small (1 col)':'Medium (2 col)'}</div>}
      </div>
    </button>
  );

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(26,22,48,0.6)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',padding:24}} onClick={onClose}>
      <div style={{background:'#FFFFFF',border:'0.5px solid #E2DFEF',borderRadius:16,width:'100%',maxWidth:640,maxHeight:'82vh',display:'flex',flexDirection:'column'}} onClick={e=>e.stopPropagation()}>
        <div style={{padding:'20px 24px 12px',borderBottom:'0.5px solid #E2DFEF'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
            <h3 style={{fontSize:16,fontWeight:700,color:'#1A1630',margin:0}}>Add Widget</h3>
            <button onClick={onClose} style={{background:'none',border:'none',fontSize:20,color:'#9590C0',cursor:'pointer',lineHeight:1}}>×</button>
          </div>
          <input className="filter-input text-sm" style={{width:'100%',marginBottom:10}} placeholder="Search widgets…" value={search} onChange={e=>setSearch(e.target.value)} autoFocus />
          {!searchingAll && (
            <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
              {categories.map(cat=>(
                <button key={cat} onClick={()=>setActiveCategory(cat)}
                  style={{fontSize:11,padding:'3px 10px',borderRadius:999,border:'none',cursor:'pointer',fontFamily:'Poppins,sans-serif',fontWeight:500,
                    background:activeCategory===cat?'linear-gradient(135deg,#602DF5,#7A50F7)':'#F0EEF8',
                    color:activeCategory===cat?'#fff':'#9590C0'}}>
                  {cat}
                </button>
              ))}
            </div>
          )}
        </div>
        <div style={{overflowY:'auto',padding:16,flex:1}}>
          {/* CRM widgets */}
          {(activeCategory==='CRM'||searchingAll) && crmFiltered.length > 0 && (
            <div style={{marginBottom:16}}>
              {searchingAll && <div style={{fontSize:10,fontWeight:600,color:'#9590C0',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:8}}>CRM Data</div>}
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                {crmFiltered.map(w=><WCard key={w.type} w={w} isOnsight={false} />)}
              </div>
            </div>
          )}
          {/* Onsight widgets */}
          {activeCategory!=='CRM' && !searchingAll && onsightFiltered.length > 0 && (
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
              {onsightFiltered.map(w=><WCard key={w.type} w={w} isOnsight={true} />)}
            </div>
          )}
          {searchingAll && onsightSearchFiltered.length > 0 && (
            <div>
              {crmFiltered.length > 0 && <div style={{fontSize:10,fontWeight:600,color:'#9590C0',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:8,marginTop:4}}>Onsight Data</div>}
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                {onsightSearchFiltered.map(w=><WCard key={w.type} w={w} isOnsight={true} />)}
              </div>
            </div>
          )}
          {crmFiltered.length===0 && onsightSearchFiltered.length===0 && onsightFiltered.length===0 && (
            <div style={{textAlign:'center',padding:'24px 0',color:'#B8B4D4',fontSize:12}}>No widgets match "{search}"</div>
          )}
        </div>
      </div>
    </div>
  );
}

function DashboardBuilderModal({ existing, onSave, onClose }) {
  const { users, currentUser } = useCRM();
  const TEAMS = [...new Set(users.map(u=>u.team).filter(Boolean))];
  const [name, setName] = useState(existing?.name||'');
  const [visibility, setVisibility] = useState(existing?.visibility||'private');
  const [team, setTeam] = useState(existing?.team||'');
  const [saving, setSaving] = useState(false);

  async function handleSave() {
    if (!name.trim()) return;
    setSaving(true);
    await onSave({ ...(existing||{}), name:name.trim(), visibility, team: visibility==='team'?team:null });
    setSaving(false);
    onClose();
  }

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(26,22,48,0.6)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',padding:24}} onClick={onClose}>
      <div style={{background:'#FFFFFF',border:'0.5px solid #E2DFEF',borderRadius:16,width:'100%',maxWidth:440,padding:28}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
          <h3 style={{fontSize:16,fontWeight:700,color:'#1A1630',margin:0}}>{existing?.id?'Edit Dashboard':'New Dashboard'}</h3>
          <button onClick={onClose} style={{background:'none',border:'none',fontSize:20,color:'#9590C0',cursor:'pointer'}}>×</button>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          <div>
            <label style={{fontSize:11,fontWeight:600,color:'#9590C0',display:'block',marginBottom:5,textTransform:'uppercase',letterSpacing:'0.05em'}}>Dashboard Name</label>
            <input className="filter-input text-sm" style={{width:'100%'}} placeholder="e.g. My Activation Pipeline" value={name} onChange={e=>setName(e.target.value)} autoFocus onKeyDown={e=>e.key==='Enter'&&handleSave()} />
          </div>
          <div>
            <label style={{fontSize:11,fontWeight:600,color:'#9590C0',display:'block',marginBottom:8,textTransform:'uppercase',letterSpacing:'0.05em'}}>Visibility</label>
            <div style={{display:'flex',gap:8}}>
              {[{v:'private',label:'🔒 Only Me'},{v:'team',label:'👥 My Team'}].map(opt=>(
                <button key={opt.v} onClick={()=>setVisibility(opt.v)}
                  style={{flex:1,padding:'9px 0',borderRadius:8,border:`1.5px solid ${visibility===opt.v?'#602DF5':'#E2DFEF'}`,background:visibility===opt.v?'#EEEDFE':'#F5F4FA',color:visibility===opt.v?'#602DF5':'#9590C0',fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'Poppins,sans-serif'}}>
                  {opt.label}
                </button>
              ))}
            </div>
          </div>
          {visibility==='team' && (
            <div>
              <label style={{fontSize:11,fontWeight:600,color:'#9590C0',display:'block',marginBottom:5,textTransform:'uppercase',letterSpacing:'0.05em'}}>Team</label>
              <select className="filter-input text-sm" style={{width:'100%'}} value={team} onChange={e=>setTeam(e.target.value)}>
                <option value="">Select team…</option>
                {TEAMS.map(t=><option key={t} value={t}>{t}</option>)}
              </select>
            </div>
          )}
        </div>
        <div style={{display:'flex',gap:8,marginTop:20}}>
          <button onClick={onClose} style={{flex:1,padding:'9px 0',borderRadius:8,border:'0.5px solid #E2DFEF',background:'#F5F4FA',color:'#9590C0',fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'Poppins,sans-serif'}}>Cancel</button>
          <button onClick={handleSave} disabled={!name.trim()||saving}
            style={{flex:2,padding:'9px 0',borderRadius:8,background:name.trim()?'linear-gradient(135deg,#602DF5,#7A50F7)':'#E2DFEF',border:'none',color:name.trim()?'#fff':'#B8B4D4',fontSize:13,fontWeight:600,cursor:name.trim()?'pointer':'default',fontFamily:'Poppins,sans-serif'}}>
            {saving?'Saving…':existing?.id?'Save Changes':'Create Dashboard'}
          </button>
        </div>
      </div>
    </div>
  );
}

            <h3 style={{fontSize:16,fontWeight:600,color:'#1A1630',marginBottom:6}}>No dashboards yet</h3>

}

function CustomDashboardView({ dashboardId }) {
  const { myDashboards, saveDashboard, currentUser } = useCRM();
  const nav = useNavigate();
  const [editMode, setEditMode] = useState(false);
  const [showPicker, setShowPicker] = useState(false);
  const [showBuilder, setShowBuilder] = useState(false);
  const [audienceFromChart, setAudienceFromChart] = useState(null);

  const dashboard = myDashboards.find(d=>d.id===dashboardId);
  const isOwner = dashboard?.owner_id === currentUser?.id;
  const widgets = dashboard?.widgets || [];

  if (!dashboard) return (
    <div className="p-6 max-w-screen-xl mx-auto">
      <button onClick={()=>nav('/my-dashboards')} style={{background:'none',border:'none',color:'#9590C0',cursor:'pointer',fontSize:12,marginBottom:16,fontFamily:'Poppins,sans-serif'}}>← Back to Dashboards</button>
      <div style={{textAlign:'center',padding:60,color:'#9590C0',fontSize:13}}>Dashboard not found.</div>
    </div>
  );

  async function addWidget(catalogItem) {
    const isOnsight = !!ONSIGHT_WIDGET_CATALOG.find(c=>c.type===catalogItem.type);
    const newWidget = {
      id: Date.now().toString(),
      type: catalogItem.type,
      title: catalogItem.label,
      size: catalogItem.size || 'lg',
      is_onsight: isOnsight,
      chart_type: catalogItem.default_chart || 'bar',
      cached_data: [],
      last_fetched: null,
    };
    await saveDashboard({ ...dashboard, widgets: [...widgets, newWidget] });
  }

  async function removeWidget(widgetId) {
    await saveDashboard({ ...dashboard, widgets: widgets.filter(w=>w.id!==widgetId) });
  }

  async function handleCacheUpdate(widgetId, patch) {
    const updated = widgets.map(w => w.id===widgetId ? {...w,...patch} : w);
    await saveDashboard({ ...dashboard, widgets: updated });
  }

  const crmWidgets = widgets.filter(w => !w.is_onsight);
  const onsightWidgets = widgets.filter(w => w.is_onsight);
  const smWidgets = crmWidgets.filter(w => (WIDGET_CATALOG.find(c=>c.type===w.type)||{}).size==='sm');
  const lgWidgets = crmWidgets.filter(w => (WIDGET_CATALOG.find(c=>c.type===w.type)||{}).size!=='sm');

  return (
    <div style={{background:'#F5F4FA',minHeight:'100vh'}}>
      {showPicker && <WidgetPickerModal onAdd={addWidget} onClose={()=>setShowPicker(false)} />}
      {showBuilder && <DashboardBuilderModal existing={dashboard} onSave={saveDashboard} onClose={()=>setShowBuilder(false)} />}
      {audienceFromChart && <CreateAudienceFromChartModal prefill={audienceFromChart} onClose={()=>setAudienceFromChart(null)} />}
      <div style={{background:'#FFFFFF',borderBottom:'0.5px solid #E2DFEF',padding:'14px 24px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,flexWrap:'wrap'}}>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <button onClick={()=>nav('/my-dashboards')} style={{background:'none',border:'none',color:'#9590C0',cursor:'pointer',fontSize:12,fontFamily:'Poppins,sans-serif',padding:0,display:'flex',alignItems:'center',gap:4}}>← Back</button>
          <div style={{width:1,height:16,background:'#E2DFEF'}} />
          <div>
            <h2 style={{fontSize:16,fontWeight:700,color:'#1A1630',margin:0}}>{dashboard.name}</h2>
            <span style={{fontSize:10,color:'#B8B4D4'}}>Auto-updated · {dashboard.visibility==='private'?'🔒 Private':dashboard.team?`👥 ${dashboard.team}`:'👥 Team'}</span>
          </div>
        </div>
        {isOwner && (
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            {editMode && <button onClick={()=>setShowBuilder(true)} style={{padding:'7px 14px',borderRadius:8,border:'0.5px solid #E2DFEF',background:'#F5F4FA',color:'#9590C0',fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'Poppins,sans-serif'}}>⚙️ Settings</button>}
            {editMode && <button onClick={()=>setShowPicker(true)} style={{padding:'7px 14px',borderRadius:8,background:'linear-gradient(135deg,#602DF5,#7A50F7)',border:'none',color:'#fff',fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'Poppins,sans-serif'}}>+ Add Widget</button>}
            <button onClick={()=>setEditMode(m=>!m)}
              style={{padding:'7px 14px',borderRadius:8,border:`1.5px solid ${editMode?'#602DF5':'#E2DFEF'}`,background:editMode?'#EEEDFE':'#F5F4FA',color:editMode?'#602DF5':'#9590C0',fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'Poppins,sans-serif'}}>
              {editMode?'✓ Done Editing':'✏️ Edit Layout'}
            </button>
          </div>
        )}
      </div>

      <div style={{padding:24,maxWidth:1400,margin:'0 auto'}}>
        {widgets.length === 0 && !editMode && (
          <div style={{textAlign:'center',padding:'80px 24px',background:'#FFFFFF',border:'0.5px dashed #C4B8F7',borderRadius:12}}>
            <div style={{fontSize:48,marginBottom:12}}>📊</div>
            <h3 style={{fontSize:16,fontWeight:600,color:'#1A1630',marginBottom:6}}>This dashboard is empty</h3>
            <p style={{fontSize:12,color:'#9590C0',marginBottom:20}}>Add widgets to start tracking your metrics.</p>
            {isOwner && <button onClick={()=>{setEditMode(true);setShowPicker(true);}} style={{padding:'9px 20px',borderRadius:999,background:'linear-gradient(135deg,#602DF5,#7A50F7)',color:'#fff',border:'none',cursor:'pointer',fontSize:13,fontWeight:600,fontFamily:'Poppins,sans-serif'}}>+ Add Widgets</button>}
          </div>
        )}

        {/* KPI row — small CRM widgets */}
        {smWidgets.length > 0 && (
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:14,marginBottom:16}}>
            {smWidgets.map(w => <WidgetCard key={w.id} widget={w} onRemove={removeWidget} editMode={editMode} />)}
          </div>
        )}

        {/* Chart grid — medium/large CRM widgets */}
        {lgWidgets.length > 0 && (
          <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:14,marginBottom:16}}>
            {lgWidgets.map(w => <WidgetCard key={w.id} widget={w} onRemove={removeWidget} editMode={editMode} />)}
          </div>
        )}

        {/* Onsight widgets — each spans 2 cols */}
        {onsightWidgets.length > 0 && (
          <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:14,marginBottom:16}}>
            {onsightWidgets.map(w => (
              <OnsightWidgetCard
                key={w.id}
                widget={w}
                onRemove={removeWidget}
                editMode={editMode}
                onCreateAudience={setAudienceFromChart}
              />
            ))}
          </div>
        )}

        {editMode && (
          <button onClick={()=>setShowPicker(true)} style={{marginTop:16,width:'100%',padding:'12px 0',borderRadius:10,border:'1.5px dashed #C4B8F7',background:'#EEEDFE',color:'#602DF5',fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'Poppins,sans-serif'}}>
            + Add Widget
          </button>
        )}
      </div>
    </div>
  );
}

  const schedBreakdown = useMemo(() => {
    const totals = {ANNUAL:0,MONTHLY:0,ANNUAL_MONTHLY:0};
    cohortData.forEach(r=>{totals.ANNUAL+=r.ANNUAL||0;totals.MONTHLY+=r.MONTHLY||0;totals.ANNUAL_MONTHLY+=r.ANNUAL_MONTHLY||0;});
    return [{name:'Annual',value:totals.ANNUAL,color:DASH_C1},{name:'Monthly',value:totals.MONTHLY,color:DASH_C2},{name:'Annual Monthly',value:totals.ANNUAL_MONTHLY,color:DASH_C3}].filter(d=>d.value>0);
  },[cohortData]);
  const reserveRow = avgBalData.find(r=>r.segment==='Reserve');
  const nonReserveRow = avgBalData.find(r=>r.segment==='Non-Reserve');
  const pctDelta = (a,b) => b>0?`${a>=b?'+':''}${Math.round((a-b)/b*100)}%`:'–';
  const topCountries = DASH_DATA.topCountries.map(r=>({...r,isSelected:r.country===selectedCountry}));

              <Pie data={schedBreakdown} cx="50%" cy="50%" outerRadius={76} dataKey="value" label={({value})=>value>0?value:''} labelLine={true}>

              <div key={i} style={{display:'flex',justifyContent:'space-between',fontSize:12,alignItems:'center'}}>

        </DashSection>
        <DashSection title="Reserve vs Non-Reserve: Avg Balances" subtitle={selectedCountry||'Global — key financial metrics by subscription status'}>
          <ResponsiveContainer width="100%" height={230}>
            <BarChart data={avgBalData} barSize={28}>
              <CartesianGrid strokeDasharray="3 3" stroke={DASH_CHART_GRID} />
              <XAxis dataKey="segment" tick={{fill:DASH_TICK,fontSize:12}} />
              <YAxis tick={{fill:DASH_TICK,fontSize:11}} tickFormatter={v=>`$${v>=1000?(v/1000).toFixed(0)+'K':v}`} />
              <RTooltip content={<DashTooltip formatter={v=>fmt.currency(v)} />} />
              <Legend wrapperStyle={{fontSize:11,color:'#9590C0'}} />

          {reserveRow && nonReserveRow && (
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginTop:12}}>
              {[
                {label:'Reserve Avg Wallet',v:fmt.currency(reserveRow.avg_wallet),delta:pctDelta(reserveRow.avg_wallet,nonReserveRow.avg_wallet)},
                {label:'Reserve Avg FF Balance',v:fmt.currency(reserveRow.avg_ff_balance),delta:pctDelta(reserveRow.avg_ff_balance,nonReserveRow.avg_ff_balance)},

function OpportunitiesKanbanView({ contractorFilter, teamFilter }) {
  const { opportunities, users, updateOpportunityStage, closeOpportunityById, createOpportunity, loading } = useCRM();
  const toast = useToast();
  const [showClosed, setShowClosed] = useState(false);
  const [activeTeamFilter, setActiveTeamFilter] = useState(teamFilter || 'all');
  const [showOpenModal, setShowOpenModal] = useState(false);
  const [closingId, setClosingId] = useState(null);

  const visibleStages = PIPELINE_STAGES.filter(s => s !== 'Not Interested');

  const filtered = useMemo(() => {
    return opportunities.filter(o => {
      if (contractorFilter && o.contractor_id !== contractorFilter) return false;
      if (!showClosed && o.closed_at) return false;
      if (activeTeamFilter !== 'all' && o.team !== activeTeamFilter) return false;
      return true;
    });
  }, [opportunities, contractorFilter, showClosed, activeTeamFilter]);

  const byStage = useMemo(() => {
    const m = {};
    visibleStages.forEach(s => { m[s] = []; });
    filtered.forEach(o => {
      const s = o.closed_at ? 'Converted' : (o.pipeline_stage || 'Identified');
      if (m[s]) m[s].push(o);
    });
    return m;
  }, [filtered]);

  // KPI cards
  const openOpps = opportunities.filter(o => !o.closed_at);
  const totalEV = openOpps.reduce((s, o) => s + (o.expected_value || 0), 0);
  const totalWV = openOpps.reduce((s, o) => s + (o.weighted_value || 0), 0);
  const convertedCount = opportunities.filter(o => o.closed_at && o.closed_reason === 'converted').length;

  async function handleDrop(oppId, newStage) {
    const ok = await updateOpportunityStage(oppId, newStage);
    if (!ok) toast('Failed to update stage', 'error');
  }

  async function handleClose(oppId) {
    setClosingId(oppId);
  }

  return (
    <div>
      {/* KPI row */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:12, marginBottom:20 }}>
        {[
          { label:'Open Opportunities', value: openOpps.length, icon:'🎯' },
          { label:'Total Expected Value', value: `$${totalEV.toFixed(0)}`, icon:'💰' },
          { label:'Weighted Pipeline', value: `$${totalWV.toFixed(0)}`, icon:'⚖️' },
          { label:'Converted', value: convertedCount, icon:'✅' },
        ].map(k => (
          <div key={k.label} className="card p-4" style={{ textAlign:'center' }}>
            <div style={{ fontSize:20, marginBottom:4 }}>{k.icon}</div>
            <div style={{ fontSize:18, fontWeight:700, color:'#1A1630' }}>{k.value}</div>
            <div style={{ fontSize:11, color:'#9590C0' }}>{k.label}</div>
          </div>
        ))}
      </div>

      {/* Controls */}
      <div style={{ display:'flex', gap:8, alignItems:'center', marginBottom:16, flexWrap:'wrap' }}>
        <div style={{ display:'flex', gap:6 }}>
          {[{key:'all',label:'All Teams'}, ...Object.entries(TEAMS).map(([k,v])=>({key:k,label:v.label}))].map(t => (
            <button key={t.key} onClick={() => setActiveTeamFilter(t.key)}
              style={{ padding:'5px 12px', borderRadius:8, fontSize:12, fontWeight:600, cursor:'pointer', fontFamily:'Poppins,sans-serif', border:'none',
                background: activeTeamFilter === t.key ? '#602DF5' : '#F5F4FA',
                color: activeTeamFilter === t.key ? '#fff' : '#9590C0' }}>
              {t.label}
            </button>
          ))}
        </div>
        <label style={{ display:'flex', alignItems:'center', gap:6, fontSize:11, color:'#9590C0', cursor:'pointer', marginLeft:'auto' }}>
          <input type="checkbox" checked={showClosed} onChange={e => setShowClosed(e.target.checked)} style={{ accentColor:'#602DF5' }} />
          Show closed
        </label>
        {!contractorFilter && (
          <button onClick={() => setShowOpenModal(true)}
            style={{ padding:'6px 14px', borderRadius:8, fontSize:12, fontWeight:600, cursor:'pointer', background:'#602DF5', color:'#fff', border:'none', fontFamily:'Poppins,sans-serif' }}>
            + Opportunity
          </button>
        )}
      </div>

      {/* Kanban */}
      <div className="kanban-board">
        {visibleStages.map(stage => (
          <OpportunityColumn key={stage} stage={stage} opps={byStage[stage] || []}
            fin={{}} users={users} onClose={handleClose} onDrop={handleDrop} />
        ))}
      </div>

      {showOpenModal && (
        <OpenOpportunityModal onClose={() => setShowOpenModal(false)} />
      )}
      {closingId && (
        <CloseOpportunityByIdModal oppId={closingId} onClose={() => setClosingId(null)} />
      )}
    </div>
  );
}

function OpenOpportunityModal({ contractorId: defaultContractorId, defaultProduct, onClose }) {
  const { createOpportunity, users, currentUser } = useCRM();
  const toast = useToast();
  const [contractorId, setContractorId] = useState(defaultContractorId || '');
  const [product, setProduct] = useState(defaultProduct || 'Reserve');
  const [team, setTeam] = useState(PRODUCT_CATALOG[defaultProduct || 'Reserve']?.defaultTeam || 'ACTIVATION');
  const [stage, setStage] = useState('Identified');
  const [assignedTo, setAssignedTo] = useState(currentUser?.id || '');
  const [reason, setReason] = useState('');
  const [saving, setSaving] = useState(false);

  const cat = PRODUCT_CATALOG[product] || {};
  const fin = contractorId ? (CONTRACTOR_MAP.get(contractorId) || {}) : {};
  const ev = product ? computeExpectedValue(product, fin) : 0;
  const wv = product ? computeWeightedValue(product, stage, fin) : 0;

  function handleProductChange(p) {
    setProduct(p);
    setTeam(PRODUCT_CATALOG[p]?.defaultTeam || 'ACTIVATION');
  }

  async function handleSave() {
    if (!contractorId) { toast('Contractor ID required', 'error'); return; }
    setSaving(true);
    const ok = await createOpportunity({ contractor_id: contractorId, product, team, pipeline_stage: stage, assigned_to: assignedTo || null, reason: reason || null });
    setSaving(false);
    if (ok !== false) { toast('Opportunity created', 'success'); onClose(); }
    else toast('Failed to create opportunity', 'error');
  }

  return (
    <Modal open={true} onClose={onClose} title="Open Opportunity" width="max-w-md">
      <div className="space-y-4">
        {!defaultContractorId && (
          <div>
            <label className="block text-xs mb-1" style={{ color:'#9590C0' }}>Contractor ID</label>
            <input className="filter-input w-full text-sm" placeholder="contractor_id…" value={contractorId} onChange={e => setContractorId(e.target.value.trim())} />
          </div>
        )}
        <div>
          <label className="block text-xs mb-1" style={{ color:'#9590C0' }}>Product</label>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:6 }}>
            {Object.entries(PRODUCT_CATALOG).map(([k, v]) => (
              <button key={k} onClick={() => handleProductChange(k)}
                style={{ padding:'8px 10px', borderRadius:8, fontSize:12, fontWeight:600, cursor:'pointer', fontFamily:'Poppins,sans-serif', textAlign:'left',
                  border: product === k ? `1.5px solid ${v.color}` : '0.5px solid #E2DFEF',
                  background: product === k ? `${v.color}15` : '#FAFAFA',
                  color: product === k ? v.color : '#9590C0' }}>
                {v.icon} {v.label}
              </button>
            ))}
          </div>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
          <div>
            <label className="block text-xs mb-1" style={{ color:'#9590C0' }}>Team</label>
            <select className="filter-input w-full text-sm" value={team} onChange={e => setTeam(e.target.value)}>
              {Object.entries(TEAMS).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
            </select>
          </div>
          <div>
            <label className="block text-xs mb-1" style={{ color:'#9590C0' }}>Stage</label>
            <select className="filter-input w-full text-sm" value={stage} onChange={e => setStage(e.target.value)}>
              {PIPELINE_STAGES.filter(s => s !== 'Not Interested' && s !== 'Converted').map(s => <option key={s}>{s}</option>)}
            </select>
          </div>
        </div>
        <div>
          <label className="block text-xs mb-1" style={{ color:'#9590C0' }}>Assign to</label>
          <select className="filter-input w-full text-sm" value={assignedTo} onChange={e => setAssignedTo(e.target.value)}>
            <option value="">Unassigned</option>
            {users.map(u => <option key={u.id} value={u.id}>{u.name || u.email}</option>)}
          </select>
        </div>
        <div>
          <label className="block text-xs mb-1" style={{ color:'#9590C0' }}>Reason / note (optional)</label>
          <input className="filter-input w-full text-sm" placeholder="Why this opportunity?" value={reason} onChange={e => setReason(e.target.value)} />
        </div>
        {/* Value preview */}
        <div style={{ background:'#F5F4FA', borderRadius:8, padding:'10px 14px', display:'flex', gap:16, fontSize:12 }}>
          <span title={`Expected Value — estimated annual revenue ${CLIENT_CONFIG.brand.name} earns if this lead fully adopts the product.`} style={{cursor:'help',color:'#9590C0'}}>EV <strong style={{ color:'#1A1630' }}>${ev}</strong></span>
          <span title="Stage Probability — likelihood of converting at this pipeline stage: Identified 10%, Contacted 25%, Engaged 60%, Converted 100%." style={{cursor:'help',color:'#9590C0'}}>Prob <strong style={{ color:'#1A1630' }}>{STAGE_PROBABILITIES[stage]}%</strong></span>
          <span title="Weighted Value — EV × stage probability. The risk-adjusted value used to size and prioritize the pipeline." style={{cursor:'help',color:'#9590C0'}}>WV <strong style={{ color:'#602DF5' }}>${wv}</strong></span>
        </div>
        {cat.netMarginNote && <div style={{ fontSize:10, color:'#9590C0', fontStyle:'italic' }}>{cat.netMarginNote}</div>}
        <div style={{ display:'flex', gap:8, justifyContent:'flex-end' }}>
          <button onClick={onClose} style={{ padding:'8px 16px', borderRadius:8, fontSize:12, border:'0.5px solid #E2DFEF', background:'#fff', color:'#9590C0', cursor:'pointer', fontFamily:'Poppins,sans-serif' }}>Cancel</button>
          <button onClick={handleSave} disabled={saving || !contractorId}
            style={{ padding:'8px 16px', borderRadius:8, fontSize:12, fontWeight:600, background:'#602DF5', color:'#fff', border:'none', cursor:'pointer', fontFamily:'Poppins,sans-serif', opacity: saving||!contractorId ? 0.5 : 1 }}>
            {saving ? 'Saving…' : 'Open Opportunity'}
          </button>
        </div>
      </div>
    </Modal>
  );
}

function CloseOpportunityByIdModal({ oppId, onClose }) {
  const { closeOpportunityById, opportunities } = useCRM();
  const toast = useToast();
  const [reason, setReason] = useState('not_interested');
  const [saving, setSaving] = useState(false);
  const opp = opportunities.find(o => o.id === oppId);

  async function handleClose() {
    setSaving(true);
    const ok = await closeOpportunityById(oppId, reason);
    setSaving(false);
    if (ok !== false) { toast('Opportunity closed', 'success'); onClose(); }
    else toast('Failed to close', 'error');
  }

  return (
    <Modal open={true} onClose={onClose} title="Close Opportunity" width="max-w-sm">
      <div className="space-y-4">
        {opp && (
          <div style={{ background:'#F5F4FA', borderRadius:8, padding:'10px 14px', fontSize:12 }}>
            <span style={{ fontWeight:600, color:'#1A1630' }}>{opp.product}</span>
            <span style={{ color:'#9590C0' }}> · {opp.pipeline_stage}</span>
          </div>
        )}
        <div>
          <label className="block text-xs mb-2" style={{ color:'#9590C0' }}>Close reason</label>
          <div className="space-y-2">
            {[
              { value:'converted', label:'Converted', desc:'Contractor adopted this product' },
              { value:'not_interested', label:'Not Interested', desc:'Declined or unresponsive' },
              { value:'duplicate', label:'Duplicate', desc:'Already tracked elsewhere' },
              { value:'invalid', label:'Invalid', desc:'Not a real opportunity' },
            ].map(r => (
              <label key={r.value} style={{ display:'flex', alignItems:'flex-start', gap:8, cursor:'pointer', padding:'8px 10px', borderRadius:8, border: reason===r.value ? '1.5px solid #602DF5' : '0.5px solid #E2DFEF', background: reason===r.value ? '#EEEDFE' : '#FAFAFA' }}>
                <input type="radio" name="closeReason" value={r.value} checked={reason===r.value} onChange={()=>setReason(r.value)} style={{ accentColor:'#602DF5', marginTop:2 }} />
                <div>
                  <div style={{ fontSize:12, fontWeight:600, color:'#1A1630' }}>{r.label}</div>
                  <div style={{ fontSize:10, color:'#9590C0' }}>{r.desc}</div>
                </div>
              </label>
            ))}
          </div>
        </div>
        <div style={{ display:'flex', gap:8, justifyContent:'flex-end' }}>
          <button onClick={onClose} style={{ padding:'8px 16px', borderRadius:8, fontSize:12, border:'0.5px solid #E2DFEF', background:'#fff', color:'#9590C0', cursor:'pointer', fontFamily:'Poppins,sans-serif' }}>Cancel</button>
          <button onClick={handleClose} disabled={saving}
            style={{ padding:'8px 16px', borderRadius:8, fontSize:12, fontWeight:600, background:'#EF4444', color:'#fff', border:'none', cursor:'pointer', fontFamily:'Poppins,sans-serif', opacity: saving ? 0.5 : 1 }}>
            {saving ? 'Closing…' : 'Close Opportunity'}
          </button>
        </div>
      </div>
    </Modal>
  );
}

function OpportunitiesProfileTab({ contractorId }) {
  const { opportunities, users, currentUser, updateOpportunityStage, closeOpportunityById, createReEngagementOpportunity } = useCRM();
  const toast = useToast();
  const fin = CONTRACTOR_MAP.get(contractorId) || {};
  const myOpps = opportunities.filter(o => o.contractor_id === contractorId);
  const openOpps = myOpps.filter(o => !o.closed_at);
  const closedOpps = myOpps.filter(o => o.closed_at);
  const [stageSaving, setStageSaving] = useState(null);
  const [closingId, setClosingId] = useState(null);
  const [reEngaging, setReEngaging] = useState(null);

  async function handleStageChange(oppId, newStage) {
    setStageSaving(oppId);
    await updateOpportunityStage(oppId, newStage);
    setStageSaving(null);
  }

  async function handleReEngage(opp) {
    setReEngaging(opp.id);
    const ok = await createReEngagementOpportunity(opp);
    setReEngaging(null);
    if (ok !== false) toast('Re-engagement opportunity created', 'success');
    else toast('Failed to re-engage', 'error');
  }

  const isReEngagementEligible = (opp) => {
    if (!opp.closed_at || !opp.re_engagement_eligible_at) return false;
    return new Date(opp.re_engagement_eligible_at) <= new Date();
  };

  return (
    <div>
      {/* Open opportunities */}
      <div className="mb-6">
        <div className="text-xs font-semibold mb-3" style={{ color:'#9590C0' }}>Open ({openOpps.length})</div>
        {openOpps.length === 0 && (
          <div className="text-sm py-4 text-center" style={{ color:'#B8B4D4' }}>No open opportunities. Use "+ Open Opportunity" to create one.</div>
        )}
        {openOpps.map(opp => {
          const cat = PRODUCT_CATALOG[opp.product] || {};
          const owner = users.find(u => u.id === opp.assigned_to);
          const ev = computeExpectedValue(opp.product, fin);
          const wv = computeWeightedValue(opp.product, opp.pipeline_stage, fin);
          return (
            <div key={opp.id} className="card p-4 mb-3">
              <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:8 }}>
                <span style={{ fontSize:18 }}>{cat.icon || '🎯'}</span>
                <span style={{ fontSize:13, fontWeight:600, color:'#1A1630', flex:1 }}>{opp.product}</span>
                <select value={opp.pipeline_stage} disabled={stageSaving === opp.id}
                  onChange={e => handleStageChange(opp.id, e.target.value)}
                  style={{ fontSize:11, padding:'2px 8px', borderRadius:6, border:'0.5px solid #E2DFEF', background: STAGE_COLORS[opp.pipeline_stage]||'#F0EEF8', color: STAGE_TEXT[opp.pipeline_stage]||'#7C73BA', fontFamily:'Poppins,sans-serif', cursor:'pointer' }}>
                  {PIPELINE_STAGES.filter(s => s !== 'Not Interested' && s !== 'Converted').map(s => <option key={s}>{s}</option>)}
                </select>
                <button onClick={() => setClosingId(opp.id)}
                  style={{ fontSize:12, color:'#9590C0', background:'none', border:'none', cursor:'pointer', padding:'2px 6px', borderRadius:4 }}
                  onMouseEnter={e => e.currentTarget.style.color='#EF4444'}
                  onMouseLeave={e => e.currentTarget.style.color='#9590C0'}>✕</button>
              </div>
              {opp.reason && <div style={{ fontSize:11, color:'#9590C0', marginBottom:6 }}>{opp.reason}</div>}
              <div style={{ display:'flex', gap:10, fontSize:11, color:'#9590C0' }}>
                <span title={`Expected Value — estimated annual revenue ${CLIENT_CONFIG.brand.name} earns if this lead fully adopts the product.`} style={{cursor:'help'}}>EV <strong style={{ color:'#1A1630' }}>${ev}</strong></span>
                <span>·</span>
                <span title="Stage Probability — likelihood of converting at this pipeline stage: Identified 10%, Contacted 25%, Engaged 60%, Converted 100%." style={{cursor:'help'}}>{STAGE_PROBABILITIES[opp.pipeline_stage] ?? 10}%</span>
                <span>·</span>
                <span title="Weighted Value — EV × stage probability. The risk-adjusted value used to size and prioritize the pipeline." style={{cursor:'help'}}>WV <strong style={{ color:'#602DF5' }}>${wv}</strong></span>
                {owner && <><span>·</span><span>{owner.name || owner.email}</span></>}
              </div>
            </div>
          );
        })}
      </div>

      {/* Closed history */}
      {closedOpps.length > 0 && (
        <div>
          <div className="text-xs font-semibold mb-3" style={{ color:'#9590C0' }}>History ({closedOpps.length})</div>
          {closedOpps.map(opp => {
            const cat = PRODUCT_CATALOG[opp.product] || {};
            const eligible = isReEngagementEligible(opp);
            const alreadyReEngaged = openOpps.some(o => o.product === opp.product && (o.generation || 1) > 1);
            return (
              <div key={opp.id} className="p-3 mb-2 rounded-lg" style={{ background:'#FAFAFA', border:'0.5px solid #E2DFEF', opacity: 0.8 }}>
                <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                  <span style={{ fontSize:14 }}>{cat.icon || '🎯'}</span>
                  <span style={{ fontSize:12, fontWeight:600, color:'#1A1630', flex:1 }}>{opp.product}</span>
                  <span style={{ fontSize:10, padding:'2px 6px', borderRadius:4, background: opp.closed_reason==='converted'?'#DCFCE7':'#FEE2E2', color: opp.closed_reason==='converted'?'#166534':'#991B1B', fontWeight:600 }}>
                    {opp.closed_reason || 'closed'}
                  </span>
                  {eligible && !alreadyReEngaged && (
                    <button onClick={() => handleReEngage(opp)} disabled={reEngaging === opp.id}
                      style={{ fontSize:10, padding:'3px 8px', borderRadius:6, background:'#602DF5', color:'#fff', border:'none', cursor:'pointer', fontFamily:'Poppins,sans-serif', fontWeight:600, opacity: reEngaging===opp.id ? 0.5 : 1 }}>
                      {reEngaging === opp.id ? '…' : 'Re-engage'}
                    </button>
                  )}
                </div>
                <div style={{ fontSize:10, color:'#B8B4D4', marginTop:4 }}>
                  Closed {fmt.timeAgo(opp.closed_at)} · Gen {opp.generation || 1}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {closingId && <CloseOpportunityByIdModal oppId={closingId} onClose={() => setClosingId(null)} />}
    </div>
  );
}
