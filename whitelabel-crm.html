  const [showAddModal, setShowAddModal] = useState(null);
  const [importing, setImporting] = useState(false);
  const [audienceFilter, setAudienceFilter] = useState('');
  const [importMsg, setImportMsg] = useState('');
  const rowsPerPage = 50;

  const contacts = CONTACTS_LOOKUP;

  // Classify all contractors by segment
  const allRows = useMemo(() => {
    const out = [];
    for (const [id, fin] of CONTRACTOR_MAP) {
      let seg = 'COLD';
      if (fin.contract_state === 'ENDED' || fin.contract_state === 'DELETED') seg = 'GLOBAL_ACCOUNT';
      else if (!fin.is_reserve) seg = 'RESERVE';
      else if (!fin.ff_net || fin.ff_net <= 0) seg = 'FUTURE_FUND';
      const contact = contacts[id] || [];
      out.push({
        id, country: fin.country || '', segment: seg,
        score: computeLeadScore(fin), comp: fin.comp || 0,
        card_spend: fin.card_spend || 0, wallet: fin.wallet || 0,
        is_reserve: fin.is_reserve, days_since: fin.days_since || fin.days_since_ended || 0,
        name: contact[0] || '', email: contact[1] || '',
        company: fin.company || null,
        has_active_contract: fin.has_active_contract ?? (fin.contract_state === 'ACTIVE'),
        inPipeline: isInPipeline(contractors, id),
        pipelineStage: getBestContractorRecord(contractors, id)?.pipeline_stage || null,
        lastContacted: getLastContacted(id, interactions),
      });
    }
    return out;
  }, [contractors]);

  const filtered = useMemo(() => {
    let d = allRows;
    if (search) {
      const q = search.toLowerCase();
      d = d.filter(r => r.name.toLowerCase().includes(q) || r.id.toLowerCase().includes(q) || r.email.toLowerCase().includes(q) || r.country.toLowerCase().includes(q));
    }
    if (segFilter) d = d.filter(r => r.segment === segFilter);
    if (contractFilter === 'active') d = d.filter(r => r.has_active_contract);
    if (contractFilter === 'inactive') d = d.filter(r => !r.has_active_contract);
    if (sortBy === 'lastContacted') {
      d = [...d].sort((a, b) => (new Date(b.lastContacted||0)) - (new Date(a.lastContacted||0)));
    } else {
      const sk = sortBy;
      d = [...d].sort((a, b) => (b[sk] || 0) - (a[sk] || 0));
    }
    return d;
  }, [allRows, search, segFilter, contractFilter, sortBy]);

  useEffect(() => { setPage(0); }, [search, segFilter, contractFilter, sortBy]);

  const totalPages = Math.max(1, Math.ceil(filtered.length / rowsPerPage));
  const safePage = Math.min(page, totalPages - 1);

  async function handleImportTop50() {
    if (importing) return;
    setImporting(true);
    setImportMsg('Adding…');

    let added = 0;
    for (const r of toAdd) {
      const ok = await addToPipeline(r.id, r.segment);
      if (ok) added++;
    }
    setImportMsg(`✓ Added ${added} to pipeline`);
    setTimeout(() => { setImporting(false); setImportMsg(''); }, 3000);
  }

  return (
    <div className="p-6 max-w-screen-2xl mx-auto">
      <div className="flex items-center justify-between mb-4 gap-3 flex-wrap">
        <div>
          <h2 className="text-xl font-bold" style={{color:'#1A1630'}}>Leads Database</h2>
          <p className="text-xs mt-1" style={{color:'#9590C0'}}>{CONTRACTOR_MAP.size.toLocaleString()} contractors from Onsight snapshot · Find targets and add to pipeline</p>
        </div>
        <button onClick={handleImportTop50} disabled={importing}
          className="text-xs px-3 py-1.5 rounded-lg disabled:opacity-50" style={{border:'0.5px solid #C4B8F7',color:'#602DF5',background:'#EEEDFE'}}>
          {importing ? importMsg : '+ Import top 50 to Pipeline'}
        </button>
      </div>

      {/* Filters */}
      <div className="flex gap-3 mb-4 flex-wrap items-center">
        <input className="filter-input text-sm flex-1" style={{maxWidth:'320px'}}

          value={search} onChange={e => setSearch(e.target.value)} />
        <div className="flex gap-1 rounded-lg overflow-hidden" style={{border:'0.5px solid #D4D0EE',borderRadius:8,overflow:'hidden'}}>
          {[{v:'',l:'All'},{v:'RESERVE',l:'Reserve'},{v:'FUTURE_FUND',l:'Future Fund'},{v:'COLD',l:'Cold'},{v:'GLOBAL_ACCOUNT',l:'Personal Acct'}].map(o => (
            <button key={o.v} onClick={() => setSegFilter(o.v)}
              style={segFilter===o.v?{background:'#602DF5',color:'#fff'}:{color:'#9590C0',background:'#fff'}} className="px-3 py-1.5 text-xs font-medium">
              {o.l}
            </button>
          ))}
        </div>
        <div className="flex gap-1 rounded-lg" style={{border:'0.5px solid #D4D0EE',borderRadius:8,overflow:'hidden'}}>
          {[{v:'',l:'All'},{v:'active',l:'Active'},{v:'inactive',l:'Inactive'}].map(o => (
            <button key={o.v} onClick={() => setContractFilter(o.v)}

        <select className="filter-input text-xs py-1.5" value={sortBy} onChange={e => setSortBy(e.target.value)}>

          <option value="comp">Sort: Compensation</option>
          <option value="days_since">Sort: Tenure</option>
          <option value="lastContacted">Sort: Last Contacted</option>
        </select>
        {audiences.length > 0 && (
          <select className="filter-input text-xs py-1.5" value={audienceFilter} onChange={e => setAudienceFilter(e.target.value)}>
            <option value="">All Audiences</option>
            {audiences.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}

        <span className="text-xs" style={{color:'#9590C0'}}>{fmt.number(filtered.length)} results</span>
      </div>

      {/* Table */}
      <div className="card overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr style={{borderBottom:'0.5px solid #E2DFEF'}}>
                {['Name','Contractor ID','Country','Company','Segment','Score','Monthly Comp','Card Spend','Wallet','Reserve','Last Contacted','Teams','Pipeline',''].map(h => (
                  <th key={h} className="text-left px-3 py-2.5 text-xs uppercase tracking-wide font-medium whitespace-nowrap" style={{color:'#9590C0'}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {pageRows.map(r => (
                <tr key={r.id} className="cursor-pointer" style={{borderBottom:'0.5px solid #F0EEF8'}}
                  onClick={() => nav('/contractor/' + r.id)}
                  onMouseEnter={e=>e.currentTarget.style.background='#FAFAFE'}
                  onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                  <td className="px-3 py-2.5 text-sm truncate" style={{maxWidth:'180px',color:'#1A1630'}}>{r.name || '—'}</td>
                  <td className="px-3 py-2.5">
                    <a href={'#/contractor/' + r.id} onClick={e => e.stopPropagation()}

                  </td>
                  <td className="px-3 py-2.5 text-xs" style={{color:'#9590C0'}}>{cflag(r.country)} {r.country}</td>
                  <td className="px-3 py-2.5 text-xs" style={{color:'#1A1630',maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.company || <span style={{color:'#B8B4D4'}}>—</span>}</td>
                  <td className="px-3 py-2.5"><SegBadge segment={r.segment} /></td>
                  <td className="px-3 py-2.5"><ScoreBadge score={r.score} /></td>
                  <td className="px-3 py-2.5" style={{color:'#1A1630'}}>{fmt.currency(r.comp)}</td>
                  <td className="px-3 py-2.5" style={{color:'#1A1630'}}>{fmt.currency(r.card_spend)}</td>
                  <td className="px-3 py-2.5" style={{color:'#1A1630'}}>{fmt.currency(r.wallet)}</td>

                    <div style={{display:'flex',flexDirection:'column',gap:3}}>
                      <TeamBadge team={primaryTeam(CONTRACTOR_MAP.get(r.id)||{})} />

                    </div>
                  </td>
                  <td className="px-3 py-2.5">

                  <td className="px-3 py-2.5 text-right" onClick={e => e.stopPropagation()}>

                      ? <span className="text-xs px-2 py-1 rounded" style={{color:'#155724',background:'#D4EDDA'}}>In Pipeline ✓</span>
                      : <button onClick={() => setShowAddModal(r)}
                          className="text-xs px-2 py-1 rounded border border-teal-800/60 text-teal-400 hover:bg-teal-900/30">+ Pipeline</button>}

              ))}
              {pageRows.length === 0 && (
                <tr><td colSpan={14} className="px-3 py-10 text-center" style={{color:'#B8B4D4'}}>No contractors match the current filters.</td></tr>

      {/* Pagination */}
      {totalPages > 1 && (
        <div className="flex items-center justify-between mt-4">
          <button onClick={() => setPage(p => Math.max(0, p - 1))} disabled={safePage === 0}

          <span className="text-xs text-slate-500">Page {safePage + 1} of {totalPages}</span>

  );
}

// Inline add-to-pipeline modal for CRM (shares data with CRM context)
function AddToPipelineInline({ row, onClose, triggerStyle, triggerLabel }) {
  const { users, currentUser, addToPipeline, duplicateIssues } = useCRM();
  // Self-contained open state when used as a trigger button (no onClose prop)
  const [open, setOpen] = useState(!triggerStyle);
  const [assignTo, setAssignTo] = useState(currentUser?.id || '');
  const [note, setNote] = useState('');
  const [saving, setSaving] = useState(false);
  const [coordChecked, setCoordChecked] = useState(false);
  const [selectedTeam, setSelectedTeam] = useState(primaryTeam(CONTRACTOR_MAP.get(row.id)||{}));

  // Fix 4: Conflict check state
  const [checkingOwner, setCheckingOwner] = useState(true);
  const [existingOwner, setExistingOwner] = useState(null); // { name, stage, assigned_to }
  const [overrideMode, setOverrideMode] = useState(false);
  const [overrideAssignTo, setOverrideAssignTo] = useState(currentUser?.id || '');

  const warnings = getCrossTeamWarning(row.id, currentUser?.team);
  const needsCheck = warnings.some(w => w.type === 'multi_team');

  // Fix 4: Check for existing pipeline record on mount
  useEffect(() => {
    let cancelled = false;
    async function checkConflict() {
      setCheckingOwner(true);
      if (!SB) { setCheckingOwner(false); return; }
      try {
        const { data } = await SB.from('crm_contractors')
          .select('contractor_id, team, pipeline_stage, assigned_to')
          .eq('contractor_id', row.id)
          .eq('team', selectedTeam)
          .maybeSingle();
        if (!cancelled && data) {
          const ownerUser = data.assigned_to ? users.find(u => u.id === data.assigned_to) : null;
          setExistingOwner({ name: ownerUser?.name || 'Unassigned', stage: data.pipeline_stage, assigned_to: data.assigned_to });
        }
      } catch(e) {
        console.warn('Conflict check failed:', e.message);
      }
      if (!cancelled) setCheckingOwner(false);
    }
    checkConflict();
    return () => { cancelled = true; };
  }, [row.id]);

  function handleClose() {
    setOpen(false);
    if (onClose) onClose();
  }

  async function handleAdd() {
    setSaving(true);
    const ok = await addToPipeline(row.id, row.segment || 'COLD', assignTo || null, note || null, selectedTeam);
    setSaving(false);
    if (ok) handleClose();
  }

  async function handleOverride() {
    if (!SB) return;
    setSaving(true);
    try {
      await SB.from('crm_contractors').update({
        assigned_to: overrideAssignTo || null,
        dat_updated: new Date().toISOString(),
      }).eq('contractor_id', row.id).eq('team', selectedTeam);
      handleClose();
      window.location.reload();
    } catch(e) {
      console.warn('Override failed:', e.message);
    }
    setSaving(false);
  }

  const modal = (
    <Modal open={open} onClose={handleClose} title="Add to Pipeline" width="max-w-md">
      <div className="space-y-3">
        {/* Contractor info — always visible */}
        <div className="flex justify-between text-sm">
          <span style={{color:'#6B7280'}}>Contractor</span>
          <span className="font-mono" style={{color:'#602DF5'}}>{row.id}</span>
        </div>
        <div className="flex justify-between text-sm">
          <span style={{color:'#6B7280'}}>Segment</span>
          <SegBadge segment={row.segment || 'COLD'} />
        </div>
        <div className="flex justify-between items-center text-sm">
          <span style={{color:'#6B7280'}}>Team pipeline</span>
          <select className="filter-input text-xs py-1" value={selectedTeam} onChange={e => setSelectedTeam(e.target.value)}>
            {Object.entries(TEAMS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
          </select>
        </div>

        {/* Conditional: checking / conflict / normal form */}
        {checkingOwner ? (
          <div style={{fontSize:12,color:'rgba(107,114,128,0.7)',textAlign:'center',padding:'12px 0'}}>
            Checking pipeline…
          </div>
        ) : existingOwner ? (
          <div>
            {/* Conflict panel */}
            <div style={{padding:'12px 14px',borderRadius:10,background:'rgba(239,68,68,0.06)',border:'1px solid rgba(239,68,68,0.25)',marginBottom:12}}>
              <div style={{fontSize:13,fontWeight:600,color:'#EF4444',marginBottom:4}}>Already in pipeline</div>
              <div style={{fontSize:12,color:'rgba(255,255,255,0.6)'}}>
                Owned by <strong style={{color:'rgba(255,255,255,0.85)'}}>{existingOwner.name}</strong>
                {existingOwner.stage && <> · <StageBadge stage={existingOwner.stage} /></>}
              </div>
            </div>
            {!overrideMode ? (
              <div style={{display:'flex',flexDirection:'column',gap:8}}>
                <button onClick={handleClose}
                  style={{width:'100%',padding:'9px 0',borderRadius:8,fontSize:13,background:'rgba(88,86,183,0.15)',color:'rgba(255,255,255,0.6)',border:'none',cursor:'pointer'}}>
                  Skip — keep as-is
                </button>
                <button onClick={() => { window.location.hash = '#/pipeline'; handleClose(); }}
                  style={{width:'100%',padding:'9px 0',borderRadius:8,fontSize:13,background:'rgba(96,45,245,0.08)',color:'#7A50F7',border:'1px solid rgba(96,45,245,0.2)',cursor:'pointer'}}>
                  View in Pipeline →
                </button>
                <button onClick={() => setOverrideMode(true)}
                  style={{width:'100%',padding:'9px 0',borderRadius:8,fontSize:13,background:'rgba(239,68,68,0.08)',color:'#EF4444',border:'1px solid rgba(239,68,68,0.2)',cursor:'pointer'}}>
                  Override &amp; Reassign…
                </button>
              </div>
            ) : (
              <div style={{display:'flex',flexDirection:'column',gap:10}}>
                <div style={{fontSize:11,color:'rgba(239,68,68,0.7)'}}>
                  ⚠️ This will reassign the contractor away from {existingOwner.name}.
                </div>
                <div>
                  <label className="text-xs mb-1 block" style={{color:'#6B7280'}}>Reassign to</label>
                  <select className="filter-input text-sm w-full" value={overrideAssignTo} onChange={e => setOverrideAssignTo(e.target.value)}>
                    {currentUser && <option value={currentUser.id}>{currentUser.name} (you)</option>}
                    <option value="">Unassigned</option>
                    {users.filter(u => u.id !== currentUser?.id && u.is_active !== false).map(u => (
                      <option key={u.id} value={u.id}>{u.name}</option>
                    ))}
                  </select>
                </div>
                <div style={{display:'flex',gap:8}}>
                  <button onClick={() => setOverrideMode(false)}
                    style={{flex:1,padding:'9px 0',borderRadius:8,fontSize:12,background:'rgba(88,86,183,0.15)',color:'rgba(255,255,255,0.5)',border:'none',cursor:'pointer'}}>
                    Cancel
                  </button>
                  <button onClick={handleOverride} disabled={saving}
                    style={{flex:2,padding:'9px 0',borderRadius:8,fontSize:13,fontWeight:600,background:'#EF4444',color:'#FFF',border:'none',cursor:'pointer',opacity:saving?0.6:1}}>
                    {saving ? 'Saving…' : 'Confirm Reassign'}
                  </button>
                </div>
              </div>
            )}
          </div>
        ) : (
          /* Normal add flow */
          <div className="space-y-3">
            {/* Duplicate issues for this contractor */}
            {duplicateIssues.filter(d => d.contractor_id === row.id).map((issue, i) => (
              <div key={i} style={{
                padding:'8px 12px',borderRadius:8,
                background:'rgba(234,179,8,0.06)',border:'1px solid rgba(234,179,8,0.25)',
                fontSize:11,color:'#FCD34D',display:'flex',alignItems:'flex-start',gap:6,
              }}>
                <span style={{flexShrink:0}}>⚠️</span>
                <span>{issue.message}</span>
              </div>
            ))}
            {warnings.map((w,i) => (
              <div key={i} style={{fontSize:11,padding:'8px 12px',borderRadius:8,background:'#FFFBEB',border:'1px solid #FCD34D',color:'#92400E'}}>
                ⚠️ {w.message}
                {w.detail && (
                  <div style={{marginTop:6,display:'flex',flexDirection:'column',gap:3}}>
                    {w.detail.map((op,j) => (
                      <div key={j} style={{display:'flex',alignItems:'center',gap:6}}>
                        <span>→</span><strong>{op.product}</strong>
                        <span style={{color:'#78350F'}}>→</span>
                        <TeamBadge team={op.team} />
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))}
            {needsCheck && (
              <label style={{display:'flex',alignItems:'center',gap:8,fontSize:12,color:'#6B7280',cursor:'pointer'}}>
                <input type="checkbox" checked={coordChecked} onChange={e => setCoordChecked(e.target.checked)} />
                I've coordinated with the relevant team
              </label>
            )}
            <div>
              <label className="text-xs mb-1 block" style={{color:'#6B7280'}}>Assign to</label>
              <select className="filter-input text-sm w-full" value={assignTo} onChange={e => setAssignTo(e.target.value)}>
                {currentUser && <option value={currentUser.id}>{currentUser.name} (you)</option>}
                <option value="">Unassigned</option>
                {users.filter(u => u.id !== currentUser?.id && u.is_active !== false).map(u => (
                  <option key={u.id} value={u.id}>{u.name}</option>
                ))}
              </select>
            </div>
            <div>
              <label className="text-xs mb-1 block" style={{color:'#6B7280'}}>Quick note (optional)</label>
              <textarea rows={2} className="filter-input w-full text-sm resize-none" placeholder="Add context…"
                value={note} onChange={e => setNote(e.target.value)} />
            </div>
            <button onClick={handleAdd} disabled={saving||(needsCheck&&!coordChecked)}
              className="w-full py-2.5 rounded-lg text-white font-semibold text-sm"
              style={{background:'linear-gradient(135deg,#602DF5,#7A50F7)',opacity:(saving||(needsCheck&&!coordChecked))?0.4:1}}>
              {saving ? 'Adding…' : 'Add to Pipeline'}
            </button>
          </div>
        )}
      </div>
    </Modal>
  );

  // When used with a trigger button (in table rows)
  if (triggerStyle) {
    return (
      <>
        <button onClick={() => setOpen(true)} style={triggerStyle}>{triggerLabel || '+ Pipeline'}</button>
        {open && modal}
      </>
    );
  }

  return modal;
}



// ─── AUDIENCE DETAIL ─────────────────────────────────────────────────────────
// ─── AUDIENCE COMMS DETAIL (tab panel) ──────────────────────────────────────
function AudienceCommsDetail({ audience, memberIds }) {
  const { interactions, tasks, audiencePushes, contractors, users, audiences } = useCRM();

  const memberSet = useMemo(() => new Set(memberIds), [memberIds]);
  const today = new Date().toDateString();
  const now = Date.now();
  const weekAgo = now - 7 * 86400000;

  const myPushes = audiencePushes.filter(p => p.audience_id === audience.id);
  const memberInteractions = interactions.filter(i => memberSet.has(i.contractor_id));

  // ── Collision detection ──────────────────────────────────────────
  const tasksDueToday = tasks.filter(t =>
    memberSet.has(t.contractor_id) && !t.is_completed &&
    t.due_date && new Date(t.due_date).toDateString() === today
  );

  const otherPushesToday = audiencePushes.filter(p =>
    p.audience_id !== audience.id &&
    new Date(p.pushed_at).toDateString() === today &&
    p.snapshot_ids?.some(id => memberSet.has(id))
  );

  // FUTURE: once Braze is connected, add Braze send history to collision detection
  // by checking crm_audience_pushes where integration = 'braze' and pushed_at = today
  // No architectural changes needed — just add to otherPushesToday filter

  // Build collision map — contractor → list of comms today
  const collisionMap = {};
  tasksDueToday.forEach(t => {
    if (!collisionMap[t.contractor_id]) collisionMap[t.contractor_id] = [];
    const assignee = users.find(u => u.id === t.assigned_to);
    collisionMap[t.contractor_id].push({ type:'CRM Task', detail:`${t.type||'Task'} — ${assignee?.name?.split(' ')[0]||'Unassigned'}`, color:'#602DF5' });
  });
  otherPushesToday.forEach(push => {
    (push.snapshot_ids || []).forEach(id => {
      if (!memberSet.has(id)) return;
      if (!collisionMap[id]) collisionMap[id] = [];
      collisionMap[id].push({ type:'Other Push', detail:`${push.integration} push`, color:'#F59E0B' });
    });
  });

  const collisions = Object.entries(collisionMap).filter(([,comms]) => comms.length > 1);

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:20}}>

      {/* KPI row */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:12}}>
        {[
          { label:'Total CRM Touches', value:memberInteractions.length.toLocaleString(), sub:'all time', color:'#602DF5' },
          { label:'This Week', value:memberInteractions.filter(i=>new Date(i.created_at).getTime()>=weekAgo).length.toLocaleString(), sub:'CRM interactions', color:'#602DF5' },
          { label:'Total Pushes', value:myPushes.length.toLocaleString(), sub:myPushes[0]?`last ${fmt.timeAgo(myPushes[0].pushed_at)}`:'never pushed', color:'#5856B7' },
          { label:'Contractors Touched', value:new Set(memberInteractions.map(i=>i.contractor_id)).size.toLocaleString(), sub:`of ${memberIds.length} members`, color:'#7A50F7' },
        ].map(k => (
          <div key={k.label} className="card p-4">
            <div style={{fontSize:22,fontWeight:700,color:k.color,marginBottom:2}}>{k.value}</div>
            <div style={{fontSize:11,color:'#1A1630',fontWeight:600,marginBottom:2}}>{k.label}</div>
            <div style={{fontSize:10,color:'#9590C0'}}>{k.sub}</div>
          </div>
        ))}
      </div>

      {/* Collision alert */}
      {collisions.length > 0 && (
        <div style={{padding:'14px 16px',borderRadius:10,background:'rgba(245,158,11,0.08)',border:'1px solid rgba(245,158,11,0.3)'}}>
          <div style={{fontSize:13,fontWeight:600,color:'#F59E0B',marginBottom:10,display:'flex',alignItems:'center',gap:6}}>
            ⚡ {collisions.length} contractor{collisions.length>1?'s':''} receiving multiple comms today
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:6}}>
            {collisions.slice(0,5).map(([contractorId, comms]) => {
              const fin = CONTRACTOR_MAP.get(contractorId) || {};
              return (
                <div key={contractorId} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 10px',borderRadius:7,background:'rgba(245,158,11,0.06)',border:'1px solid rgba(245,158,11,0.15)'}}>
                  <span style={{fontFamily:'monospace',fontSize:11,fontWeight:600,color:'#602DF5',flexShrink:0}}>{contractorId}</span>
                  <span style={{fontSize:11}}>{cflag(fin.country)}</span>
                  <div style={{flex:1,display:'flex',gap:6,flexWrap:'wrap'}}>
                    {comms.map((c, i) => (
                      <span key={i} style={{fontSize:10,padding:'2px 7px',borderRadius:4,background:`${c.color}20`,color:c.color,border:`1px solid ${c.color}40`}}>
                        {c.type}: {c.detail}
                      </span>
                    ))}
                  </div>
                </div>
              );
            })}
            {collisions.length > 5 && (
              <div style={{fontSize:11,color:'#9590C0',textAlign:'center'}}>+{collisions.length-5} more</div>
            )}
          </div>
        </div>
      )}

      {/* Push history timeline */}
      <div>
        <div style={{fontSize:13,fontWeight:600,color:'#1A1630',marginBottom:12}}>Push History</div>
        {myPushes.length === 0 ? (
          <div style={{textAlign:'center',padding:24,color:'#9590C0',fontSize:12}}>
            This audience has never been pushed to an integration
          </div>
        ) : (
          <div className="card overflow-hidden">
            {myPushes.slice(0,10).map((push, i) => (
              <div key={push.id||i} style={{padding:'10px 16px',borderBottom:i<Math.min(myPushes.length,10)-1?'0.5px solid #F0EEF8':'none',display:'flex',alignItems:'center',gap:12}}>
                <div style={{width:28,height:28,borderRadius:6,flexShrink:0,background:'#EEEDFE',border:'0.5px solid #C4B8F7',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14}}>
                  {INTEGRATION_REGISTRY.find(r=>r.key===push.integration)?.icon||'📤'}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:600,color:'#1A1630',marginBottom:2}}>
                    {push.integration} · {(push.snapshot_count||0).toLocaleString()} contractors
                  </div>
                  {push.exclusion_snapshot?.total > 0 && (
                    <div style={{fontSize:10,color:'#9590C0'}}>
                      {push.exclusion_snapshot.total} excluded at push time
                    </div>
                  )}
                </div>
                <div style={{fontSize:11,color:'#9590C0',flexShrink:0}}>{fmt.timeAgo(push.pushed_at)}</div>
                <div style={{fontSize:10,padding:'2px 7px',borderRadius:999,flexShrink:0,
                  background:push.status==='success'?'#D4EDDA':'#F0EEF8',
                  color:push.status==='success'?'#155724':'#9590C0',
                  border:`0.5px solid ${push.status==='success'?'#C3E6CB':'#D4D0EE'}`}}>
                  {push.status||'pending'}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Recent CRM activity */}
      <div>
        <div style={{fontSize:13,fontWeight:600,color:'#1A1630',marginBottom:12}}>Recent CRM Activity</div>
        {memberInteractions.length === 0 ? (
          <div style={{textAlign:'center',padding:24,color:'#9590C0',fontSize:12}}>
            No CRM interactions with this audience yet
          </div>
        ) : (
          <div className="card overflow-hidden">
            {memberInteractions
              .sort((a,b) => new Date(b.created_at) - new Date(a.created_at))
              .slice(0,8)
              .map((interaction, i) => {
                const actor = users.find(u => u.id === interaction.created_by);
                const fin = CONTRACTOR_MAP.get(interaction.contractor_id) || {};
                return (
                  <div key={interaction.id} style={{padding:'10px 16px',borderBottom:i<7?'0.5px solid #F0EEF8':'none',display:'flex',alignItems:'center',gap:10}}>
                    <span style={{fontSize:16,flexShrink:0}}>
                      {interaction.type==='note'?'📝':interaction.type==='email'?'✉️':interaction.type==='call'?'📞':'📌'}
                    </span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12,color:'#9590C0',display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                        <strong style={{color:'#1A1630'}}>{actor?.name?.split(' ')[0]||'Someone'}</strong>
                        <span>logged a {interaction.type}</span>
                        <span style={{fontFamily:'monospace',fontSize:11,color:'#602DF5'}}>{interaction.contractor_id}</span>
                        <span style={{fontSize:11}}>{cflag(fin.country)}</span>
                      </div>
                      {interaction.content && (
                        <div style={{fontSize:11,color:'#9590C0',marginTop:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                          {interaction.content.slice(0,80)}
                        </div>
                      )}
                    </div>
                    <div style={{fontSize:11,color:'#B8B4D4',flexShrink:0}}>{fmt.timeAgo(interaction.created_at)}</div>
                  </div>
                );
              })
            }
          </div>
        )}
      </div>
    </div>
  );
}

// ─── AUDIENCE BROADCASTS PANEL (contractor profile) ─────────────────────────
// Shows audience-level manual communications this contractor was part of.
// Read-only, passive — does NOT write to crm_interactions.
function AudienceBroadcastsPanel({ contractorId }) {
  const { audiences, interactions, conversions, contractors } = useCRM();
  const [entries, setEntries] = useState(null); // null = loading

  // Find which audiences contain this contractor
  const memberAudiences = useMemo(() => {
    return audiences.filter(a => {
      const ids = a.audience_type === 'static'
        ? (a.static_member_ids || [])
        : getAudienceMembers(a, interactions, conversions, contractors, audiences);
      return ids.includes(contractorId);
    });
  }, [audiences, contractorId, interactions, conversions, contractors]);

  useEffect(() => {
    if (memberAudiences.length === 0) { setEntries([]); return; }
    if (!window.SB) { setEntries([]); return; }
    const ids = memberAudiences.map(a => a.id);
    window.SB.from('crm_audit_log')
      .select('*')
      .eq('entity_type', 'audience')
      .eq('action', 'manual_comm')
      .in('entity_id', ids)
      .order('changed_at', { ascending: false })
      .limit(20)
      .then(({ data }) => setEntries(data || []));
  }, [memberAudiences.map(a=>a.id).join(',')]);

  if (entries === null || entries.length === 0) return null;

  // Enrich with audience name
  const audienceMap = Object.fromEntries(memberAudiences.map(a => [a.id, a]));

  return (
    <div style={{marginBottom:16}}>
      <div style={{fontSize:11,fontWeight:600,color:'#9590C0',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:8,display:'flex',alignItems:'center',gap:6}}>
        📢 Audience Broadcasts
        <span style={{fontSize:10,color:'#B8B4D4',fontWeight:400,textTransform:'none',letterSpacing:0}}>— communications sent to audiences this contractor belongs to</span>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:6}}>
        {entries.map(entry => {
          const m = entry.metadata || {};
          const aud = audienceMap[entry.entity_id];
          const isEmail = m.comm_type === 'email';
          return (
            <div key={entry.id} style={{padding:'10px 12px',borderRadius:8,background:'#FAFAFE',border:'0.5px solid #E2DFEF',display:'flex',alignItems:'flex-start',gap:10}}>
              <span style={{fontSize:14,flexShrink:0,marginTop:1}}>{isEmail?'✉️':'📞'}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:2}}>
                  <span style={{fontSize:12,fontWeight:600,color:'#1A1630'}}>Re: {m.subject}</span>
                  {aud && <span style={{fontSize:10,padding:'1px 6px',borderRadius:999,background:'#EEEDFE',color:'#602DF5',border:'0.5px solid #C4B8F7'}}>{aud.name}</span>}
                </div>
                {m.body && <div style={{fontSize:11,color:'#9590C0',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{m.body}</div>}
                <div style={{fontSize:10,color:'#B8B4D4',marginTop:3}}>
                  {m.comm_date ? new Date(m.comm_date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : fmt.timeAgo(entry.changed_at)}
                  {m.recipient_count > 0 && ` · ${m.recipient_count.toLocaleString()} recipients`}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── MANUAL COMMS LOG ────────────────────────────────────────────────────────
function ManualCommsLog({ audienceId, refreshKey }) {
  const [entries, setEntries] = useState([]);
  const [loading, setLoading] = useState(true);
  const { users, currentUser } = useCRM();
  const toast = useToast();

  useEffect(() => {
    async function load() {
      setLoading(true);
      if (!window.SB) { setLoading(false); return; }
      const { data } = await window.SB
        .from('crm_audit_log')
        .select('*')
        .eq('entity_type', 'audience')
        .eq('entity_id', audienceId)
        .eq('action', 'manual_comm')
        .order('changed_at', { ascending: false })
        .limit(50);
      setEntries(data || []);
      setLoading(false);
    }
    load();
  }, [audienceId, refreshKey]);

  if (loading) return <div style={{padding:'16px 0',color:'#9590C0',fontSize:12,textAlign:'center'}}>Loading…</div>;
  if (entries.length === 0) return (
    <div style={{textAlign:'center',padding:'24px 0',color:'#9590C0',fontSize:12}}>
      No manual communications logged yet
    </div>
  );

  async function deleteEntry(id) {
    if (!window.SB) return;
    await window.SB.from('crm_audit_log').delete().eq('id', id);
    setEntries(prev => prev.filter(e => e.id !== id));
    toast('Communication deleted', 'success');
  }

  return (
    <div className="card overflow-hidden">
      {entries.map((entry, i) => {
        const actor = users.find(u => u.id === entry.changed_by);
        const m = entry.metadata || {};
        const isEmail = m.comm_type === 'email';
        const canDelete = currentUser?.role === 'admin' || entry.changed_by === currentUser?.id;
        return (
          <div key={entry.id} style={{padding:'14px 16px',borderBottom:i<entries.length-1?'0.5px solid #F0EEF8':'none'}}>
            <div style={{display:'flex',alignItems:'flex-start',gap:12}}>
              <div style={{width:32,height:32,borderRadius:8,flexShrink:0,background:isEmail?'#EEEDFE':'#F0FDF4',border:`0.5px solid ${isEmail?'#C4B8F7':'#BBF7D0'}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:15}}>
                {isEmail ? '✉️' : '📞'}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4,flexWrap:'wrap'}}>
                  <span style={{fontSize:11,padding:'1px 7px',borderRadius:999,background:isEmail?'#EEEDFE':'#F0FDF4',color:isEmail?'#602DF5':'#15803D',border:`0.5px solid ${isEmail?'#C4B8F7':'#86EFAC'}`,fontWeight:600}}>
                    {isEmail ? 'Email' : 'Call'}
                  </span>
                  {m.subject && (
                    <span style={{fontSize:13,fontWeight:600,color:'#1A1630'}}>Re: {m.subject}</span>
                  )}
                  {m.recipient_count > 0 && (
                    <span style={{fontSize:11,color:'#9590C0',marginLeft:'auto'}}>
                      {m.recipient_count.toLocaleString()} recipients
                    </span>
                  )}
                  {canDelete && (
                    <button onClick={() => { if (window.confirm('Delete this communication?')) deleteEntry(entry.id); }}
                      style={{marginLeft:'auto',background:'none',border:'none',cursor:'pointer',color:'#B8B4D4',fontSize:13,lineHeight:1,padding:'0 2px'}}
                      onMouseEnter={e=>e.currentTarget.style.color='#DC2626'}
                      onMouseLeave={e=>e.currentTarget.style.color='#B8B4D4'}
                      title="Delete">✕</button>
                  )}
                </div>
                {m.body && (
                  <div style={{fontSize:12,color:'#9590C0',lineHeight:1.5,marginBottom:4,whiteSpace:'pre-wrap'}}>
                    {m.body}
                  </div>
                )}
                <div style={{display:'flex',alignItems:'center',gap:6,fontSize:11,color:'#B8B4D4'}}>
                  {actor && <><Avatar user={actor} size={16} /><span>{actor.name.split(' ')[0]}</span><span>·</span></>}
                  <span>{m.comm_date ? new Date(m.comm_date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : fmt.timeAgo(entry.changed_at)}</span>
                  {m.comm_date && <span>· logged {fmt.timeAgo(entry.changed_at)}</span>}
                </div>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function AudienceDetail({ audienceId }) {
  const { audiences, saveAudience, deleteAudience, pushAudience, logAudit, contractors, interactions, users, currentUser, conversions, audiencePushes, addTask, updateStage, createOpportunity } = useCRM();
  const nav = useNavigate();
  const toast = useToast();

  const audience = audiences.find(a => a.id === audienceId);

  const allMemberIds = useMemo(() => {
    if (!audience) return [];
    return audience.audience_type === 'static'
      ? (audience.static_member_ids || [])
      : getAudienceMembers(audience, interactions, conversions, contractors, audiences);
  }, [audience, interactions, conversions, contractors, audiences]);

  const [search, setSearch] = useState('');
  const [sortBy, setSortBy] = useState('lead_score');
  const [sortDir, setSortDir] = useState('desc');
  const [page, setPage] = useState(0);
  const rowsPerPage = 50;

  function toggleSort(key) {
    if (sortBy === key) setSortDir(d => d === 'desc' ? 'asc' : 'desc');
    else { setSortBy(key); setSortDir('desc'); }
    setPage(0);
  }

  const rows = useMemo(() => {
    return allMemberIds.map(id => {
      const fin = CONTRACTOR_MAP.get(id) || {};
      const contact = CONTACTS_LOOKUP[id] || [];
      const crmRec = getBestContractorRecord(contractors, id);
      return {
        id, name: contact[0] || null, country: fin.country || '',
        comp: fin.comp || 0, wallet: fin.wallet || 0, card_spend: fin.card_spend || 0,
        ff_net: fin.ff_net || 0, is_reserve: fin.is_reserve || false,
        score: crmRec?.lead_score ?? computeLeadScore(fin),
        segment: crmRec?.upsell_segment || (!fin.is_reserve ? 'RESERVE' : (!fin.ff_net || fin.ff_net <= 0 ? 'FUTURE_FUND' : 'COLD')),
        company: fin.company || null,
        pipelineStage: crmRec?.pipeline_stage || null,
        inPipeline: !!crmRec,
        lastContacted: getLastContacted(id, interactions),
        team: primaryTeam(fin),
      };
    })
    .filter(r => {
      if (!search) return true;
      const q = search.toLowerCase();
      return r.id.toLowerCase().includes(q) || (r.name||'').toLowerCase().includes(q) || r.country.toLowerCase().includes(q);
    })
    .sort((a, b) => {
      const dir = sortDir === 'desc' ? -1 : 1;
      if (sortBy === 'lead_score')    return dir * ((b.score||0) - (a.score||0));
      if (sortBy === 'wallet')        return dir * ((b.wallet||0) - (a.wallet||0));
      if (sortBy === 'comp')          return dir * ((b.comp||0) - (a.comp||0));
      if (sortBy === 'card_spend')    return dir * ((b.card_spend||0) - (a.card_spend||0));
      if (sortBy === 'lastContacted') return dir * (new Date(b.lastContacted||0) - new Date(a.lastContacted||0));
      if (sortBy === 'name')          return dir * (a.name||'').localeCompare(b.name||'');
      return 0;
    });
  }, [allMemberIds, search, sortBy, sortDir, contractors, interactions]);

  const totalPages = Math.ceil(rows.length / rowsPerPage);
  const safePage = Math.min(page, Math.max(0, totalPages - 1));
  const pageRows = rows.slice(safePage * rowsPerPage, (safePage + 1) * rowsPerPage);

  const notInPipeline = allMemberIds.filter(id => !isInPipeline(contractors, id));
  const alreadyInPipeline = allMemberIds.length - notInPipeline.length;

  // Fix 3: Group already-in-pipeline by owner for the pre-flight overlap summary
  const overlapByOwner = React.useMemo(() => {
    const map = {};
    allMemberIds.filter(id => isInPipeline(contractors, id)).forEach(id => {
      const best = getBestContractorRecord(contractors, id);
      const ownerName = best?.assigned_to
        ? (users.find(u => u.id === best.assigned_to)?.name || 'Unknown')
        : 'Unassigned';
      map[ownerName] = (map[ownerName] || 0) + 1;
    });
    return Object.entries(map).sort((a, b) => b[1] - a[1]);
  }, [allMemberIds, contractors, users]);

  // Bulk add
  const [showBulkAdd, setShowBulkAdd] = useState(false);
  const [bulkSegment, setBulkSegment] = useState(audience?.default_segment || '');
  const [bulkTeam, setBulkTeam] = useState(currentUser?.team || 'ACTIVATION');
  const [bulkProduct, setBulkProduct] = useState('');
  const [bulkAssignMode, setBulkAssignMode] = useState('self'); // 'self' | 'specific' | 'roundrobin' | 'split'
  const [bulkAssignTo, setBulkAssignTo] = useState('');
  const [bulkSplitMembers, setBulkSplitMembers] = useState([]);
  const [bulkAdding, setBulkAdding] = useState(false);
  const [bulkWithTask, setBulkWithTask] = useState(false);
  const [bulkTaskType, setBulkTaskType] = useState('follow_up');
  const [bulkTaskNote, setBulkTaskNote] = useState('');
  const [bulkTaskDue, setBulkTaskDue] = useState('');

  async function handleBulkAdd() {
    setBulkAdding(true);

    // Fix 2: Re-fetch who's already in pipeline right now to avoid stale data
    let alreadyInPipelineNow = new Set();
    if (SB) {
      try {
        const { data } = await SB.from('crm_contractors')
          .select('contractor_id')
          .in('contractor_id', allMemberIds);
        alreadyInPipelineNow = new Set((data || []).map(r => r.contractor_id));
      } catch(e) {
        console.warn('Failed to re-check pipeline:', e.message);
      }
    }

    // Only add contractors genuinely not in pipeline right now
    const toAdd = allMemberIds.filter(id => !alreadyInPipelineNow.has(id));

    const activeUsers = users.filter(u => u.is_active !== false);

    // Sort by lead score descending — highest value assigned first
    const sortedContractors = [...toAdd].sort((a, b) => {
      const scoreA = computeLeadScore(CONTRACTOR_MAP.get(a) || {});
      const scoreB = computeLeadScore(CONTRACTOR_MAP.get(b) || {});
      return scoreB - scoreA;
    });

    // Build assignment map
    const assignmentMap = {};
    const splitPool = bulkSplitMembers.length > 0 ? bulkSplitMembers : activeUsers.map(u => u.id);
    sortedContractors.forEach((id, index) => {
      if (bulkAssignMode === 'self') {
        assignmentMap[id] = currentUser?.id || null;
      } else if (bulkAssignMode === 'specific') {
        assignmentMap[id] = bulkAssignTo || null;
      } else if (bulkAssignMode === 'roundrobin') {
        const assignedUser = activeUsers[index % activeUsers.length];
        assignmentMap[id] = assignedUser?.id || null;
      } else if (bulkAssignMode === 'split') {
        assignmentMap[id] = splitPool[index % splitPool.length] || null;
      }
    });

    let added = 0;
    const addedIds = [];
    for (const id of sortedContractors) {
      const fin = CONTRACTOR_MAP.get(id) || {};
      const seg = bulkSegment || (
        fin.contract_state === 'ENDED' || fin.contract_state === 'DELETED' ? 'GLOBAL_ACCOUNT'
        : !fin.is_reserve ? 'RESERVE'
        : !fin.ff_net || fin.ff_net <= 0 ? 'FUTURE_FUND'
        : 'COLD'
      );
      if (!SB) { added++; addedIds.push(id); continue; }
      // Use insert — skip silently on unique constraint violation
      const rowTeam = bulkTeam || SEG_TO_TEAM[seg] || currentUser?.team || 'ACTIVATION';
      const { error } = await SB.from('crm_contractors').insert({
        contractor_id: id, team: rowTeam, upsell_segment: seg, pipeline_stage: 'Identified',
        lead_score: computeLeadScore(fin), assigned_to: assignmentMap[id],
        source_audience_id: audience.id, source_audience_name: audience.name,
        added_by: currentUser?.id || null,
        dat_created: new Date().toISOString(), dat_updated: new Date().toISOString(),
      });
      if (error && error.code === '23505') {
        console.log(`Skipped ${id} — already in pipeline`);
      } else if (error) {
        console.warn(`Failed to add ${id}:`, error.message);
      } else {
        added++;
        addedIds.push(id);
      }
    }

    // Bulk task creation
    if (bulkWithTask && addedIds.length > 0) {
      for (const id of addedIds) {
        await addTask({
          contractor_id: id,
          type: bulkTaskType,
          note: bulkTaskNote || null,
          due_date: bulkTaskDue || null,
          assigned_to: assignmentMap[id] || null,
        });
      }
    }

    // ── Bulk opportunity creation ────────────────────────────────────
    let oppsCreated = 0;
    for (const id of addedIds) {
      const fin = CONTRACTOR_MAP.get(id) || {};
      try {
        if (bulkProduct === '') {
          const eligible = detectOpportunities(fin);
          for (const opp of eligible) {
            await createOpportunity({ contractor_id: id, product: opp.product, team: opp.team, assigned_to: assignmentMap[id], source_audience_id: audience.id, reason: opp.reason });
            oppsCreated++;
          }
        } else {
          const team = PRODUCT_CATALOG[bulkProduct]?.defaultTeam || bulkTeam;
          await createOpportunity({ contractor_id: id, product: bulkProduct, team, assigned_to: assignmentMap[id], source_audience_id: audience.id });
          oppsCreated++;
        }
      } catch(e) {
        console.warn('Opportunity creation failed for', id, e.message);
      }
    }

    setBulkAdding(false);
    setShowBulkAdd(false);
    toast(
      added + ' contractors added to pipeline' +
      (oppsCreated > 0 ? ` · ${oppsCreated} opportunities created` : '') +
      (bulkWithTask && added > 0 ? ` · ${added} tasks created` : ''),
      'success'
    );
    if (added > 0) {
      await logAudit(
        'audience', audience.id, audience.name, 'bulk_added',
        null,
        {
          contractor_count: added,
          assign_mode: bulkAssignMode,
          assigned_to: bulkAssignMode === 'specific'
            ? users.find(u => u.id === bulkAssignTo)?.name
            : bulkAssignMode === 'split'
            ? bulkSplitMembers.map(id => users.find(u=>u.id===id)?.name).filter(Boolean).join(', ')
            : bulkAssignMode,
          tasks_created: bulkWithTask ? added : 0,
        }
      );
    }
    // Record who was assigned back onto the audience so the card shows assignees
    if (added > 0 && SB) {
      const newAssignees = bulkAssignMode === 'split' ? bulkSplitMembers
        : bulkAssignMode === 'specific' && bulkAssignTo ? [bulkAssignTo]
        : bulkAssignMode === 'self' && currentUser?.id ? [currentUser.id]
        : activeUsers.map(u => u.id);
      if (newAssignees.length > 0) {
        await SB.from('crm_audiences').update({ assigned_users: newAssignees }).eq('id', audience.id);
      }
    }
    setTimeout(() => window.location.reload(), 800);
  }

  // Push menu
  const [showPushMenu, setShowPushMenu] = useState(false);
  const pushRef = useRef(null);
  useEffect(() => {
    const fn = e => { if (pushRef.current && !pushRef.current.contains(e.target)) setShowPushMenu(false); };
    document.addEventListener('mousedown', fn);
    return () => document.removeEventListener('mousedown', fn);
  }, []);

  // Push modal with exclusion overrides
  const [pushModalIntegration, setPushModalIntegration] = useState(null);
  const [pushExclAudienceIds, setPushExclAudienceIds] = useState([]);
  const [pushExclPipelineStages, setPushExclPipelineStages] = useState([]);
  const [pushExclRecentDays, setPushExclRecentDays] = useState(null);
  const [pushExclConversionTypes, setPushExclConversionTypes] = useState([]);
  function openPushModal(integrationKey) {
    setPushModalIntegration(integrationKey);
    setPushExclAudienceIds(audience.excluded_audience_ids || []);
    setPushExclPipelineStages(audience.excluded_pipeline_stages || []);
    setPushExclRecentDays(audience.excluded_recent_contact_days || null);
    setPushExclConversionTypes(audience.excluded_conversion_types || []);
  }
  function confirmPush() {
    const overrides = {
      excluded_audience_ids: pushExclAudienceIds.length > 0 ? pushExclAudienceIds : null,
      excluded_pipeline_stages: pushExclPipelineStages.length > 0 ? pushExclPipelineStages : null,
      excluded_recent_contact_days: pushExclRecentDays || null,
      excluded_conversion_types: pushExclConversionTypes.length > 0 ? pushExclConversionTypes : null,
    };
    const hasOverrides = Object.values(overrides).some(v => v !== null);
    pushAudience(audience.id, pushModalIntegration, hasOverrides ? overrides : null);
    setPushModalIntegration(null);
    if (alreadyInPipeline > 0) setPostPushStagePrompt(true);
  }

  // Bulk stage update
  const [showBulkStage, setShowBulkStage] = useState(false);
  const [bulkStageTarget, setBulkStageTarget] = useState('Contacted');
  const [bulkStageLoading, setBulkStageLoading] = useState(false);
  const [postPushStagePrompt, setPostPushStagePrompt] = useState(false);

  async function handleBulkStageUpdate() {
    setBulkStageLoading(true);
    const inPipIds = allMemberIds.filter(id => isInPipeline(contractors, id));
    await Promise.all(inPipIds.map(id => {
      const rec = getBestContractorRecord(contractors, id);
      if (rec) return updateStage(id, bulkStageTarget, rec.team);
    }));
    setBulkStageLoading(false);
    setShowBulkStage(false);
    setPostPushStagePrompt(false);
    toast(`${inPipIds.length} contractors moved to ${bulkStageTarget}`, 'success');
  }

  // Edit / Delete
  const [showBuilder, setShowBuilder] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [activeTab, setActiveTab] = useState('contractors');

  // Manual communication logging
  const [showLogComm, setShowLogComm] = useState(false);
  const [commType, setCommType] = useState('email');
  const [commSubject, setCommSubject] = useState('');
  const [commBody, setCommBody] = useState('');
  const [commDate, setCommDate] = useState(new Date().toISOString().slice(0,10));
  const [commAttribution, setCommAttribution] = useState('self');
  const [savingComm, setSavingComm] = useState(false);
  const [commRefreshKey, setCommRefreshKey] = useState(0);

  async function handleLogComm() {
    if (!commSubject.trim()) return;
    setSavingComm(true);
    await logAudit('audience', audience.id, audience.name, 'manual_comm', null, {
      comm_type: commType,
      subject: commSubject.trim(),
      body: commBody.trim() || null,
      comm_date: commDate,
      recipient_count: allMemberIds.length,
      attribution: commAttribution,
    });
    setSavingComm(false);
    setShowLogComm(false);
    setCommSubject('');
    setCommBody('');
    setCommDate(new Date().toISOString().slice(0,10));
    setCommType('email');
    setCommAttribution('self');
    setCommRefreshKey(k => k + 1);
    toast('Communication logged', 'success');
  }

  // CSV Export
  function exportCSV() {
    const headers = ['ID','Name','Company','Country','Team','Segment','Lead Score','Monthly Comp','Wallet','Card Spend','Future Fund','Reserve','Pipeline Stage','Last Contacted'];
    const csvRows = [headers.join(','), ...rows.map(r => [
      r.id, r.name||'', r.company||'', r.country, TEAMS[r.team]?.label||'', SEG_CFG[r.segment]?.label||r.segment,
      r.score, r.comp, r.wallet, r.card_spend, r.ff_net, r.is_reserve?'Yes':'No',
      r.pipelineStage||'Not in pipeline', r.lastContacted ? new Date(r.lastContacted).toLocaleDateString() : 'Never'
    ].map(v => `"${String(v).replace(/"/g,'""')}"`).join(','))];
    const blob = new Blob([csvRows.join('\n')], { type:'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `audience_${(audience?.name||'export').replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  }

  if (!audience) return (
    <div style={{padding:48,textAlign:'center',color:'rgba(255,255,255,0.3)',fontSize:13}}>
      Audience not found. <button onClick={() => nav('/audiences')} style={{color:'#7A50F7',background:'none',border:'none',cursor:'pointer',fontFamily:'Poppins,sans-serif',fontSize:13}}>Back to Audiences</button>
    </div>
  );

  const isDynamic = audience.audience_type === 'dynamic';

  function SortTh({ label, sortKey, style={} }) {
    const active = sortBy === sortKey;
    return (
      <th onClick={() => toggleSort(sortKey)}
        style={{textAlign:'left',padding:'10px 12px',fontSize:11,color:active?'#602DF5':'#9590C0',textTransform:'uppercase',letterSpacing:'0.08em',fontWeight:600,cursor:'pointer',userSelect:'none',whiteSpace:'nowrap',...style}}>
        {label} {active ? (sortDir==='desc'?'↓':'↑') : ''}
      </th>
    );
  }

  return (
    <div style={{maxWidth:1400,margin:'0 auto',padding:24}}>

      {/* Breadcrumb */}
      <div style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:'#9590C0',marginBottom:20}}>
        <button onClick={() => nav('/audiences')} style={{color:'#7A50F7',background:'none',border:'none',cursor:'pointer',fontFamily:'Poppins,sans-serif',fontSize:12,padding:0}}>Audiences</button>
        <span>›</span>
        <span style={{color:'#1A1630',fontWeight:500}}>{audience.name}</span>
      </div>

      {/* Header */}
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:24,gap:16,flexWrap:'wrap'}}>
        <div>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6,flexWrap:'wrap'}}>
            <h1 style={{fontSize:22,fontWeight:700,color:'#1A1630',margin:0}}>{audience.name}</h1>
            <span style={{fontSize:11,padding:'2px 10px',borderRadius:999,fontWeight:600,background:isDynamic?'#EEEDFE':'#F5F4FA',color:isDynamic?'#602DF5':'#9590C0',border:isDynamic?'0.5px solid #C4B8F7':'0.5px solid #D4D0EE'}}>
              {isDynamic ? '⟳ Dynamic' : '📸 Static'}
            </span>
            {audience.team && <TeamBadge team={audience.team} />}
          </div>
          {audience.description && <p style={{fontSize:13,color:'#9590C0',margin:'0 0 6px'}}>{audience.description}</p>}
          <div style={{fontSize:11,color:'#B8B4D4'}}>
            Created {fmt.date(audience.dat_created)}
          </div>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
          <button onClick={() => { setBulkTeam(currentUser?.team || 'ACTIVATION'); setShowBulkAdd(true); }} style={{padding:'8px 14px',borderRadius:8,fontSize:12,fontWeight:600,background:'linear-gradient(135deg,#602DF5,#7A50F7)',color:'#FFFFFF',border:'none',cursor:'pointer',fontFamily:'Poppins,sans-serif'}}>+ Add to Pipeline</button>
          <div ref={pushRef} style={{position:'relative'}}>
            <button onClick={() => setShowPushMenu(o=>!o)} style={{padding:'8px 14px',borderRadius:8,fontSize:12,background:'#F5F4FA',color:'#5856B7',border:'0.5px solid #D4D0EE',cursor:'pointer',fontFamily:'Poppins,sans-serif'}}>Push to… ▾</button>
            {showPushMenu && (
              <div style={{position:'absolute',top:38,right:0,background:'#FFFFFF',border:'0.5px solid #E2DFEF',borderRadius:8,boxShadow:'0 4px 16px rgba(0,0,0,0.4)',zIndex:50,minWidth:180,overflow:'hidden'}}>
                {INTEGRATION_REGISTRY.map(integ => {
                  const cfg = window.CRM_CONFIG?.integrations?.[integ.key];
                  const connected = integ.isConnected(cfg);
                  return <button key={integ.key} onClick={() => { setShowPushMenu(false); openPushModal(integ.key); }}
                    style={{width:'100%',padding:'10px 14px',textAlign:'left',fontSize:12,color:connected?'#1A1630':'#B8B4D4',background:'none',border:'none',borderBottom:'0.5px solid #F0EEF8',cursor:connected?'pointer':'default',display:'flex',alignItems:'center',gap:10,fontFamily:'Poppins,sans-serif'}}
                    onMouseEnter={e=>{if(connected)e.currentTarget.style.background='#F5F4FA';}} onMouseLeave={e=>e.currentTarget.style.background='none'}>
                    <span style={{fontSize:16}}>{integ.icon}</span><span style={{flex:1}}>{integ.label}</span>
                    {connected ? <span style={{fontSize:10,color:'#34D399'}}>● Connected</span> : <span style={{fontSize:10,color:'#B8B4D4'}}>Not connected</span>}
                  </button>;
                })}
              </div>
            )}
          </div>
          <button onClick={exportCSV} style={{padding:'8px 14px',borderRadius:8,fontSize:12,background:'#F5F4FA',color:'#5856B7',border:'0.5px solid #D4D0EE',cursor:'pointer',fontFamily:'Poppins,sans-serif'}}>Export CSV</button>
          <button onClick={() => setShowBuilder(true)} style={{padding:'8px 14px',borderRadius:8,fontSize:12,background:'#F5F4FA',color:'#5856B7',border:'0.5px solid #D4D0EE',cursor:'pointer',fontFamily:'Poppins,sans-serif'}}>Edit</button>
          <button onClick={() => setConfirmDelete(true)} style={{padding:'8px 14px',borderRadius:8,fontSize:12,background:'none',color:'#f87171',border:'1px solid rgba(239,68,68,0.2)',cursor:'pointer',fontFamily:'Poppins,sans-serif',opacity:0.7}} onMouseEnter={e=>e.currentTarget.style.opacity=1} onMouseLeave={e=>e.currentTarget.style.opacity=0.7}>Delete</button>
        </div>
      </div>

      {/* Overview stat cards */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:12,marginBottom:20}}>
        {[
          {label:'Total Members',       value:allMemberIds.length.toLocaleString(),   color:'#7A50F7'},
          {label:'In Pipeline',         value:alreadyInPipeline.toLocaleString(),     color:'#602DF5'},
          {label:'Not in Pipeline',     value:notInPipeline.length.toLocaleString(),  color:'#9590C0'},
          {label:'Filter Rules',        value:(audience.filter_rules||[]).length,     color:'#9590C0'},
          ...(audience.size_limit ? [{label:'Size Limit', value:audience.size_limit.toLocaleString(), color:'#f59e0b'}] : []),
          ...((audience.excluded_audience_ids?.length||0)+(audience.excluded_pipeline_stages?.length||0)+(audience.excluded_conversion_types?.length||0)+(audience.excluded_recent_contact_days?1:0) > 0 ? [{label:'Exclusions', value:(audience.excluded_audience_ids?.length||0)+(audience.excluded_pipeline_stages?.length||0)+(audience.excluded_conversion_types?.length||0)+(audience.excluded_recent_contact_days?1:0), color:'#721C24'}] : []),
        ].map(k => (
          <div key={k.label} className="card p-4">
            <div style={{fontSize:22,fontWeight:700,color:k.color,marginBottom:2}}>{k.value}</div>
            <div style={{fontSize:11,color:'#9590C0'}}>{k.label}</div>
          </div>
        ))}
      </div>

      {/* Filter rules */}
      <div className="card p-5" style={{marginBottom:20}}>
        <div style={{fontSize:12,fontWeight:600,color:'#1A1630',marginBottom:10}}>Filter Rules</div>
        {(audience.filter_rules||[]).length === 0 ? (

      </Modal>

      {/* Push modal with exclusion overrides */}
      <Modal open={!!pushModalIntegration} onClose={()=>setPushModalIntegration(null)} title={`Push to ${INTEGRATION_REGISTRY.find(i=>i.key===pushModalIntegration)?.label||''}`} width="max-w-lg">
        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          <div style={{fontSize:12,color:'#9590C0'}}>
            Optionally override exclusions for this push only. These won't change the saved audience settings.
          </div>
          <ExclusionBuilder
            audience={{
              id: audience.id,
              filter_rules: audience.filter_rules,

              excluded_audience_ids: pushExclAudienceIds,
              excluded_pipeline_stages: pushExclPipelineStages,
              excluded_recent_contact_days: pushExclRecentDays,

              if (updates.excluded_conversion_types !== undefined) setPushExclConversionTypes(updates.excluded_conversion_types);
            }}

          <div style={{display:'flex',gap:8}}>
            <button onClick={()=>setPushModalIntegration(null)} style={{flex:1,padding:'10px 0',borderRadius:8,fontSize:12,background:'#F5F4FA',color:'#9590C0',border:'none',cursor:'pointer',fontFamily:'Poppins,sans-serif'}}>Cancel</button>
            <button onClick={confirmPush} style={{flex:1,padding:'10px 0',borderRadius:8,fontSize:12,background:'linear-gradient(135deg,#602DF5,#7A50F7)',color:'#FFFFFF',border:'none',cursor:'pointer',fontWeight:600,fontFamily:'Poppins,sans-serif'}}>
              Push Now

          </div>

      </Modal>
    </div>
  );

// Fix 5: Compute the overlap between two audiences
function getAudienceOverlap(audienceA, audienceB) {
  if (!audienceA || !audienceB) return { count: 0, ids: [] };
  const idsA = audienceA.audience_type === 'static'
    ? new Set(audienceA.static_member_ids || [])
    : new Set(getAudienceMembers(audienceA));
  const idsB = audienceB.audience_type === 'static'
    ? (audienceB.static_member_ids || [])
    : getAudienceMembers(audienceB);
  const overlap = idsB.filter(id => idsA.has(id));
  return { count: overlap.length, ids: overlap };
}

// ─── AUDIENCE AUDIT LOG ──────────────────────────────────────────────────────
function AudienceAuditLog({ audienceId }) {
  const [log, setLog] = useState([]);
  const [loading, setLoading] = useState(true);
  const { users } = useCRM();

  useEffect(() => {
    async function load() {
      if (!window.SB) { setLoading(false); return; }
      const { data } = await window.SB
        .from('crm_audit_log')
        .select('*')
        .eq('entity_type', 'audience')
        .eq('entity_id', audienceId)
        .order('changed_at', { ascending: false })
        .limit(50);
      setLog(data || []);
      setLoading(false);
    }
    load();
  }, [audienceId]);

  if (loading) return (
    <div style={{padding:32,color:'#9590C0',fontSize:13,textAlign:'center'}}>
      Loading activity…
    </div>
  );

  if (log.length === 0) return (
    <div style={{padding:32,color:'#9590C0',fontSize:13,textAlign:'center'}}>
      No activity recorded yet
    </div>
  );

  const actionConfig = {
    created:    { icon:'✨', color:'#10B981', label:'Created' },
    updated:    { icon:'✏️', color:'#7A50F7', label:'Updated' },
    deleted:    { icon:'🗑️', color:'#EF4444', label:'Deleted' },
    bulk_added: { icon:'➕', color:'#5856B7', label:'Bulk added to pipeline' },
    pushed:     { icon:'🚀', color:'#7A50F7', label:'Pushed to integration' },
  };

  return (
    <div style={{padding:'20px 16px'}}>
      <div style={{fontSize:12,fontWeight:600,color:'#9590C0',marginBottom:16,textTransform:'uppercase',letterSpacing:'0.08em'}}>
        Audience Activity
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:0}}>
        {log.map((entry, i) => {
          const cfg = actionConfig[entry.action] || { icon:'•', color:'rgba(255,255,255,0.3)', label: entry.action };
          const actor = users.find(u => u.id === entry.changed_by);
          return (
            <div key={entry.id} style={{display:'flex',gap:12,paddingBottom:16,position:'relative'}}>
              {/* Timeline line */}
              {i < log.length - 1 && (
                <div style={{position:'absolute',left:15,top:30,width:2,bottom:0,background:'#E2DFEF'}} />
              )}
              {/* Icon bubble */}
              <div style={{
                width:30,height:30,borderRadius:'50%',flexShrink:0,zIndex:1,
                background:`${cfg.color}18`,border:`1px solid ${cfg.color}35`,
                display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,
              }}>
                {cfg.icon}
              </div>
              {/* Content */}
              <div style={{flex:1,minWidth:0,paddingTop:5}}>
                <div style={{fontSize:12,color:'#1A1630',display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',marginBottom:4}}>
                  <strong style={{color:'#1A1630'}}>{entry.changed_by_name || actor?.name || 'Unknown'}</strong>
                  <span style={{color:cfg.color,fontWeight:600}}>{cfg.label}</span>
                  <span style={{color:'#B8B4D4',fontSize:11}}>{fmt.timeAgo(entry.changed_at)}</span>
                </div>

                {/* Updated: show field diff */}
                {entry.action === 'updated' && Array.isArray(entry.changes) && entry.changes.length > 0 && (
                  <div style={{background:'#F5F4FA',borderRadius:6,padding:'6px 10px',fontSize:11,border:'0.5px solid #E2DFEF'}}>
                    {entry.changes.map((c, j) => (
                      <div key={j} style={{
                        display:'flex',gap:6,alignItems:'flex-start',
                        paddingBottom:j < entry.changes.length-1?4:0,
                        marginBottom:j < entry.changes.length-1?4:0,
                        borderBottom:j < entry.changes.length-1?'0.5px solid #F0EEF8':'none',
                      }}>
                        <span style={{color:'#9590C0',fontWeight:600,textTransform:'capitalize',flexShrink:0,minWidth:80}}>
                          {c.field.replace(/_/g,' ')}
                        </span>
                        <span style={{color:'#721C24',textDecoration:'line-through',maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flexShrink:0}}>
                          {String(c.from ?? '—').slice(0,60)}
                        </span>
                        <span style={{color:'#9590C0',flexShrink:0}}>→</span>
                        <span style={{color:'#155724',maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                          {String(c.to ?? '—').slice(0,60)}
                        </span>
                      </div>
                    ))}
                  </div>
                )}

                {/* Bulk add detail */}
                {entry.action === 'bulk_added' && entry.metadata && (
                  <div style={{fontSize:11,color:'#9590C0',marginTop:2}}>
                    {entry.metadata.contractor_count} contractors →{' '}
                    {entry.metadata.assign_mode === 'roundrobin'
                      ? 'distributed evenly across team'
                      : entry.metadata.assign_mode === 'self'
                      ? 'assigned to self'
                      : `assigned to ${entry.metadata.assigned_to}`
                    }
                  </div>
                )}

                {/* Push detail */}
                {entry.action === 'pushed' && entry.metadata && (
                  <div style={{fontSize:11,color:'#9590C0',marginTop:2}}>
                    {entry.metadata.snapshot_count} contractors → {entry.metadata.integration}
                  </div>
                )}

                {/* Created: show member count */}
                {entry.action === 'created' && Array.isArray(entry.changes) && (
                  <div style={{fontSize:11,color:'#9590C0',marginTop:2}}>
                    {(() => {
                      const mc = entry.changes.find(c => c.field === 'member_count');
                      return mc ? `${mc.value} contractors matched at creation` : null;
                    })()}
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── AUDIENCES VIEW ──────────────────────────────────────────────────────────
function SuggestAudiencesModal({ onClose, onCreateAudience }) {
  const [goalText, setGoalText] = useState('');
  const [generated, setGenerated] = useState(null);
  const [generating, setGenerating] = useState(false);

  function generateFromGoal(text) {
    const t = text.toLowerCase();

    // ── 1. Parse numeric thresholds ──────────────────────────────────
    // Matches: 200k, 200K, $200k, 200,000, $200000, 5k, 5000, 1m, 1M
    function parseAmount(str) {
      const m = str.match(/\$?([\d,]+\.?\d*)\s*([kmKM])?/);
      if (!m) return null;
      let n = parseFloat(m[1].replace(/,/g, ''));
      if (m[2] && /k/i.test(m[2])) n *= 1000;
      if (m[2] && /m/i.test(m[2])) n *= 1000000;
      return n;
    }

    // Extract wallet threshold: "wallet > 200k", "more than 200k in wallet", "200k wallet", ">200k", "wallet balance of 5000"
    let walletMin = null, walletMax = null;
    const walletPatterns = [
      /wallet[^$\d]*(?:>|more than|over|above|greater than)[\s]*(\$?[\d,]+\.?\d*\s*[km]?)/i,
      /(?:>|more than|over|above|greater than)\s*(\$?[\d,]+\.?\d*\s*[km]?)\s*(?:in wallet|wallet)/i,
      /(\$?[\d,]+\.?\d*\s*[km]?)\s*(?:in wallet|wallet balance)/i,
    ];
    for (const p of walletPatterns) {
      const m = t.match(p);
      if (m) { walletMin = parseAmount(m[1]); break; }
    }
    const walletMaxPatterns = [
      /wallet[^$\d]*(?:<|less than|under|below)[\s]*(\$?[\d,]+\.?\d*\s*[km]?)/i,
      /(?:<|less than|under|below)\s*(\$?[\d,]+\.?\d*\s*[km]?)\s*(?:in wallet|wallet)/i,
    ];
    for (const p of walletMaxPatterns) {
      const m = t.match(p);
      if (m) { walletMax = parseAmount(m[1]); break; }
    }
    // Fallback: any "$Xk" or "Xk" mention with wallet context
    if (walletMin === null && /wallet|saldo/.test(t)) {
      const m = t.match(/(\$?[\d,]+\.?\d*\s*[km])/i);
      if (m) walletMin = parseAmount(m[1]);
    }

    // Extract FF threshold
    let ffMin = null;
    const ffPatterns = [
      /(?:future fund|ff|savings)[^$\d]*(?:>|more than|over|above)[\s]*(\$?[\d,]+\.?\d*\s*[km]?)/i,
      /(?:>|more than|over)[\s]*(\$?[\d,]+\.?\d*\s*[km]?)\s*(?:in future fund|in savings|ff)/i,
    ];
    for (const p of ffPatterns) {
      const m = t.match(p);
      if (m) { ffMin = parseAmount(m[1]); break; }
    }

    // Extract comp threshold
    let compMin = null;
    const compPatterns = [
      /(?:comp|salary|income|compensation|earning)[^$\d]*(?:>|more than|over|above)[\s]*(\$?[\d,]+\.?\d*\s*[km]?)/i,
      /(?:>|more than|over)[\s]*(\$?[\d,]+\.?\d*\s*[km]?)\s*(?:comp|salary|income)/i,
    ];
    for (const p of compPatterns) {
      const m = t.match(p);
      if (m) { compMin = parseAmount(m[1]); break; }
    }

    // ── 2. Country / region detection ────────────────────────────────
    const KNOWN_COUNTRIES = ['colombia','argentina','peru','mexico','spain','ecuador','venezuela','brazil','chile','uruguay','bolivia','costa rica','guatemala','honduras','el salvador','philippines','india','italy','france','germany'];
    const REGION_MAP = {
      latam: ['COLOMBIA','ARGENTINA','PERU','MEXICO','ECUADOR','VENEZUELA','BRAZIL','CHILE','URUGUAY','BOLIVIA','COSTA RICA','GUATEMALA','HONDURAS','EL SALVADOR'],
      'latin america': ['COLOMBIA','ARGENTINA','PERU','MEXICO','ECUADOR','VENEZUELA','BRAZIL','CHILE','URUGUAY','BOLIVIA','COSTA RICA','GUATEMALA','HONDURAS','EL SALVADOR'],
      'south america': ['COLOMBIA','ARGENTINA','PERU','ECUADOR','VENEZUELA','BRAZIL','CHILE','URUGUAY','BOLIVIA'],
      'central america': ['COSTA RICA','GUATEMALA','HONDURAS','EL SALVADOR'],
    };
    let countries = KNOWN_COUNTRIES.filter(c => t.includes(c)).map(c => c.toUpperCase());
    let regionLabel = null;
    if (!countries.length) {
      for (const [region, list] of Object.entries(REGION_MAP)) {
        if (t.includes(region)) { countries = list; regionLabel = region.toUpperCase(); break; }
      }
    }
    const wantsReserve = /reserve|subscription|suscri/.test(t);
    const wantsFF = /future fund|futurefund|savings|ahorro/.test(t);
    const wantsGA = /global account|inactive|reactivat|sin contrato/.test(t);
    const wantsBoth = /both|ambos|cross.?sell/.test(t);
    const noReserve = /no reserve|without reserve|sin reserva|not subscribed|hasn.t subscribed/.test(t);
    const noContract = /no (active )?contract|no contract|inactive|sin contrato|ended contract/.test(t);
    const noFF = /no future fund|without future fund|sin future fund/.test(t);
    const highComp = /high.?comp|high.?salary|high.?earn|high.?income/.test(t);

    // ── 3. Build filter_rules array ───────────────────────────────────
    const rules = [];
    // Single country → exact match rule; multi-country → we filter at count time only
    if (countries.length === 1) {
      rules.push({ field:'country', operator:'=', value:countries[0] });
    }
    if (walletMin !== null) rules.push({ field:'wallet', operator:'>', value: walletMin });
    if (walletMax !== null) rules.push({ field:'wallet', operator:'<', value: walletMax });
    if (ffMin !== null) rules.push({ field:'ff_net', operator:'>', value: ffMin });
    if (compMin !== null) rules.push({ field:'comp', operator:'>', value: compMin });
    if (noReserve || (wantsGA && noContract)) rules.push({ field:'is_reserve', operator:'=', value:'false' });
    else if (wantsBoth || (wantsReserve && wantsFF)) rules.push({ field:'is_reserve', operator:'=', value:'true' });
    if (noContract || wantsGA) rules.push({ field:'contract_state', operator:'=', value:'ENDED' });
    if (noFF && !wantsFF) rules.push({ field:'ff_net', operator:'=', value:0 });
    if (highComp && compMin === null) rules.push({ field:'comp', operator:'>', value:3000 });

    // ── 4. Count matching contractors from CONTRACTOR_MAP ─────────────
    const countrySet = countries.length > 1 ? new Set(countries) : null;
    let matchCount = 0;
    if (typeof CONTRACTOR_MAP !== 'undefined') {
      for (const [, fin] of CONTRACTOR_MAP) {
        // Multi-country region filter (OR logic — can't be expressed as AND rules)
        if (countrySet && !countrySet.has((fin.country||'').toUpperCase())) continue;
        if (rules.every(r => evaluateRule(fin, r))) matchCount++;
      }
    }
    const countTag = matchCount > 0 ? `${fmt.number(matchCount)} potential targets` : null;

    // ── 5. Build title / rationale / tag ─────────────────────────────
    let title, rationale, segment, icon, color, tag;
    const ctryLabel = regionLabel ? ` — ${regionLabel}` : countries.length === 1 ? ` — ${countries[0]}` : countries.length > 1 ? ` — ${countries.slice(0,3).join(', ')}${countries.length>3?'…':''}` : '';

    if (noContract || wantsGA) {
      const walletLabel = walletMin ? ` with wallet > ${fmt.currency(walletMin,true)}` : ' holding funds';
      title = `Inactive Contractors${walletLabel}${ctryLabel} — Personal Account`;
      rationale = `Inactive leads${walletMin?` with balance over ${fmt.currency(walletMin,true)}`:'who still hold funds'}${ctryLabel} are warm re-engagement targets — they already know ${CLIENT_CONFIG.brand.name}.`;
      segment = 'GLOBAL_ACCOUNT'; icon = '🌐'; color = '#fb923c';
    } else if (wantsBoth || (wantsReserve && wantsFF)) {
      title = `Reserve Subscribers — Future Fund Cross-sell${ctryLabel}`;
      rationale = `Contractors who already subscribe to Reserve are the easiest Future Fund pitch${ctryLabel} — they trust the platform. Only 175 (10%) have both products today.`;
      segment = 'FUTURE_FUND'; icon = '⭐'; color = '#fbbf24';
    } else if (wantsReserve || noReserve) {
      const walletLabel = walletMin ? `, wallet > ${fmt.currency(walletMin,true)}` : '';
      title = `No Reserve${walletLabel}${ctryLabel} — Reserve Upsell`;
      rationale = `Active contractors${ctryLabel} without a Reserve subscription${walletMin ? ` and wallet balance above ${fmt.currency(walletMin,true)}` : ''}. ${walletMin ? 'High-balance contractors without Reserve are the top conversion opportunity.' : 'Top savings quartile converts at 10% — prioritise by balance.'}`;
      segment = 'RESERVE'; icon = '🛡'; color = '#5eead4';
    } else if (wantsFF) {
      const walletLabel = walletMin ? `, wallet > ${fmt.currency(walletMin,true)}` : '';
      title = `No Future Fund${walletLabel}${ctryLabel} — FF Upsell`;
      rationale = `Contractors${ctryLabel}${walletMin ? ` with wallet over ${fmt.currency(walletMin,true)}` : ' with wallet balance'} but no Future Fund. ${walletMin ? 'High-balance contractors without FF are the warmest possible savings pitch.' : 'Many earn regularly but have $0 in savings — education campaign can convert them.'}`;
      segment = 'FUTURE_FUND'; icon = '💰'; color = '#60a5fa';
    } else if (countries.length) {
      const walletLabel = walletMin ? `, wallet > ${fmt.currency(walletMin,true)}` : '';
      title = `${regionLabel||countries.slice(0,3).join(' & ')}${countries.length>3?'…':''} — Product Adoption${walletLabel}`;
      const totalActive = countries.reduce((s,c)=>{const r=DASH_COUNTRY_KPIS_MAP[c];return s+(r?r.total_active:0);},0);
      rationale = `Active contractors in ${regionLabel||countries.join(', ')} (${fmt.number(totalActive)} total)${walletMin ? ` with wallet over ${fmt.currency(walletMin,true)}` : ''} — broad product awareness campaign.`;
      segment = 'RESERVE'; icon = '🌎'; color = '#a78bfa';
    } else {
      const walletLabel = walletMin ? `, wallet > ${fmt.currency(walletMin,true)}` : '';
      title = `High-potential Contractors${walletLabel} — All Products`;
      rationale = `Contractors${walletMin ? ` with wallet balance over ${fmt.currency(walletMin,true)}` : ' with high wallet balances'} and no current product subscriptions — broadest upsell opportunity.`;
      segment = 'RESERVE'; icon = '✨'; color = '#c4b5fd';
    }

    tag = countTag || (walletMin ? `wallet > ${fmt.currency(walletMin,true)}` : 'Custom audience');

    // For multi-country regions, add display-only country chips (not in rules — engine uses AND)
    const displayChips = [...rules];
    if (countries.length > 1) {
      displayChips.unshift({ _display: true, label: `Country: ${regionLabel||countries.slice(0,4).join(', ')}${countries.length>4?` +${countries.length-4} more`:''}` });
    }

    return { title, rationale, segment, icon, color, tag, rules, displayChips };
  }

  function handleGenerate() {
    if (!goalText.trim()) return;
    setGenerating(true);
    setGenerated(null);
    setTimeout(() => {

      setGenerating(false);

  const SUGGESTIONS = [

      segment: 'FUTURE_FUND',
      icon: '💰',
      color: '#60a5fa',
      tag: '8,368 potential targets',

      segment: 'RESERVE',
      icon: '🌎',
      color: '#5eead4',
      tag: '321 + 252 Reserve subscribers',

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(10,8,22,0.85)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',padding:24}} onClick={onClose}>

          <button onClick={onClose} style={{background:'none',border:'none',color:'rgba(255,255,255,0.4)',fontSize:20,cursor:'pointer',padding:4,lineHeight:1}}>×</button>
        </div>

        <div style={{marginBottom:24,padding:16,borderRadius:12,background:'rgba(96,45,245,0.07)',border:'1px solid rgba(96,45,245,0.25)'}}>

          <div style={{display:'flex',gap:8}}>
