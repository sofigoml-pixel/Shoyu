function AudiencesView() {
  const { audiences, saveAudience, deleteAudience, pushAudience, currentUser, loading, users, contractors } = useCRM();
  const [showBuilder, setShowBuilder] = useState(false);
  const [editingAudience, setEditingAudience] = useState(null);
  const [showSuggest, setShowSuggest] = useState(false);
  const [search, setSearch] = useState('');
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [compareAudience, setCompareAudience] = useState('');
  const [filterCreator, setFilterCreator] = useState('');
  const [filterTeam, setFilterTeam] = useState('');
  const [filterIntendedSeg, setFilterIntendedSeg] = useState('');
  const [filterMemberSeg, setFilterMemberSeg] = useState('');

  const filtered = useMemo(() => {
    return audiences.filter(a => {
      if (search && !a.name?.toLowerCase().includes(search.toLowerCase())) return false;
      if (filterCreator && a.created_by !== filterCreator) return false;
      if (filterTeam && a.team !== filterTeam) return false;
      if (filterIntendedSeg && a.default_segment !== filterIntendedSeg) return false;
      if (filterMemberSeg) {
        const memberIds = a.static_member_ids || [];
        const hasMatch = memberIds.some(id => {
          const rec = getBestContractorRecord(contractors, id);
          return rec?.upsell_segment === filterMemberSeg;
        });
        if (!hasMatch) return false;
      }
      return true;
    });
  }, [audiences, search, filterCreator, filterTeam, filterIntendedSeg, filterMemberSeg, contractors]);

  if (loading) return <div className="p-8" style={{color:'#9590C0'}}>Loading…</div>;

  return (
    <div className="p-6 max-w-screen-xl mx-auto">
      {showSuggest && (
        <SuggestAudiencesModal
          onClose={() => setShowSuggest(false)}
          onCreateAudience={(suggestion) => {
            setEditingAudience({ name: suggestion.title, default_segment: suggestion.segment, filter_rules: suggestion.rules || [] });
            setShowBuilder(true);

          <button onClick={() => setShowSuggest(true)} style={{padding:'9px 16px',borderRadius:999,background:'linear-gradient(135deg,#1a1630,#2d1b69)',color:'#9D7FF9',border:'1px solid rgba(96,45,245,0.4)',cursor:'pointer',fontSize:13,fontWeight:600,fontFamily:'Poppins,sans-serif',display:'flex',alignItems:'center',gap:6}}>
            ✨ Suggest Audiences
          </button>
          <button onClick={() => { setEditingAudience(null); setShowBuilder(true); }}
            style={{padding:'9px 18px',borderRadius:999,background:'linear-gradient(135deg,#602DF5,#7A50F7)',color:'#FFFFFF',border:'none',cursor:'pointer',fontSize:13,fontWeight:600,fontFamily:'Poppins,sans-serif',boxShadow:'0 2px 8px rgba(96,45,245,0.25)'}}>
            + New Audience

      </div>
      <div style={{marginBottom:20,display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}}>
        <input className="filter-input text-sm" style={{width:200}} placeholder="Search audiences…"
          value={search} onChange={e => setSearch(e.target.value)} />
        <select className="filter-input text-sm" value={filterCreator} onChange={e => setFilterCreator(e.target.value)}>

          {audiences.length === 0 ? (
            <><div style={{fontSize:24,marginBottom:8}}>🎯</div>No audiences yet. Create your first one to start grouping contractors.<br/><br/>

              compareAudienceId={compareAudience !== a.id ? compareAudience : ''}
              allAudiences={audiences} />
          ))}
        </div>
      )}
      {showBuilder && <AudienceBuilder audience={editingAudience} onSave={async d => { await saveAudience(d); setShowBuilder(false); }} onClose={() => setShowBuilder(false)} />}
      <Modal open={!!confirmDelete} onClose={() => setConfirmDelete(null)} title="Delete audience" width="max-w-sm">
        {confirmDelete && (
          <div style={{display:'flex',flexDirection:'column',gap:16}}>
            <p style={{fontSize:13,color:'#9590C0'}}>Delete <strong style={{color:'#1A1630'}}>{confirmDelete.name}</strong>? This cannot be undone.</p>
            <div style={{display:'flex',gap:8}}>
              <button onClick={() => setConfirmDelete(null)} style={{flex:1,padding:'8px 0',borderRadius:8,fontSize:12,background:'#F5F4FA',color:'#9590C0',border:'none',cursor:'pointer'}}>Cancel</button>
              <button onClick={async () => { await deleteAudience(confirmDelete.id); setConfirmDelete(null); }} style={{flex:1,padding:'8px 0',borderRadius:8,fontSize:12,background:'#EF4444',color:'#FFFFFF',border:'none',cursor:'pointer',fontWeight:600}}>Delete</button>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}

        const fin = CONTRACTOR_MAP.get(id) || {};
        const contact = CONTACTS_LOOKUP[id] || [];
        return { id, name: contact[0] || '', country: fin.country || '', wallet: fin.wallet || 0, comp: fin.comp || 0, score: computeLeadScore(fin) };
      })
      .filter(r => !q || r.id.toLowerCase().includes(q) || r.name.toLowerCase().includes(q) || r.country.toLowerCase().includes(q))
      .sort((a, b) => b.score - a.score);
  }, [memberIds, search]);

  const totalPages = Math.max(1, Math.ceil(rows.length / rowsPerPage));
  const safePage = Math.min(page, totalPages - 1);
  const pageRows = rows.slice(safePage * rowsPerPage, (safePage + 1) * rowsPerPage);

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{maxWidth:700,maxHeight:'85vh',display:'flex',flexDirection:'column'}}>
        <div style={{padding:'20px 24px 16px',borderBottom:'0.5px solid #E2DFEF',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
          <div>
            <div style={{fontSize:15,fontWeight:700,color:'#1A1630'}}>{audience.name}</div>
            <div style={{fontSize:11,color:'#9590C0',marginTop:2}}>{rows.length.toLocaleString()} contractors matching</div>
          </div>
          <button onClick={onClose} style={{color:'#9590C0',background:'none',border:'none',cursor:'pointer',fontSize:20,lineHeight:1}}>×</button>
        </div>
        <div style={{padding:'12px 24px',borderBottom:'0.5px solid #E2DFEF',flexShrink:0}}>
          <input className="filter-input text-sm w-full" placeholder="Search by name, ID, or country…"
            value={search} onChange={e => { setSearch(e.target.value); setPage(0); }} />
        </div>
        <div style={{overflowY:'auto',flex:1}}>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead style={{position:'sticky',top:0,background:'#FAFAFA',zIndex:1}}>
              <tr style={{borderBottom:'0.5px solid #E2DFEF'}}>
                {['Name','Contractor ID','Country','Score','Wallet','Comp'].map(h => (
                  <th key={h} style={{padding:'8px 16px',textAlign:'left',fontSize:10,color:'#9590C0',textTransform:'uppercase',letterSpacing:'0.08em',fontWeight:600}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {pageRows.map((r, i) => (
                <tr key={r.id}
                  onClick={() => { onClose(); nav('/contractor/' + r.id); }}
                  style={{borderBottom:'0.5px solid #F0EEF8',cursor:'pointer'}}
                  onMouseEnter={e => e.currentTarget.style.background='#FAFAFE'}
                  onMouseLeave={e => e.currentTarget.style.background='transparent'}>
                  <td style={{padding:'10px 16px',fontSize:12,color:'#1A1630',maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.name || '—'}</td>
                  <td style={{padding:'10px 16px'}}><span style={{fontFamily:'monospace',fontSize:11,color:'#7A50F7'}}>{r.id}</span></td>
                  <td style={{padding:'10px 16px',fontSize:12,color:'#9590C0'}}>{cflag(r.country)} {r.country}</td>
                  <td style={{padding:'10px 16px'}}><ScoreBadge score={r.score} /></td>
                  <td style={{padding:'10px 16px',fontSize:12,color:'#1A1630'}}>{fmt.currency(r.wallet)}</td>
                  <td style={{padding:'10px 16px',fontSize:12,color:'#1A1630'}}>{fmt.currency(r.comp)}</td>
                </tr>
              ))}
              {pageRows.length === 0 && (
                <tr><td colSpan={6} style={{padding:'32px 16px',textAlign:'center',color:'#9590C0',fontSize:13}}>No contractors match.</td></tr>
              )}
            </tbody>
          </table>
        </div>
        {totalPages > 1 && (
          <div style={{padding:'12px 24px',borderTop:'0.5px solid #E2DFEF',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
            <button onClick={() => setPage(p => Math.max(0, p - 1))} disabled={safePage === 0}
              style={{padding:'6px 12px',borderRadius:8,fontSize:12,background:'#F5F4FA',color:'#5856B7',border:'none',cursor:'pointer',opacity:safePage===0?0.4:1}}>← Prev</button>
            <span style={{fontSize:11,color:'#9590C0'}}>Page {safePage + 1} of {totalPages}</span>
            <button onClick={() => setPage(p => Math.min(totalPages - 1, p + 1))} disabled={safePage >= totalPages - 1}
              style={{padding:'6px 12px',borderRadius:8,fontSize:12,background:'#F5F4FA',color:'#5856B7',border:'none',cursor:'pointer',opacity:safePage>=totalPages-1?0.4:1}}>Next →</button>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── AUDIENCE COMMS SUMMARY (card-level) ────────────────────────────────────
function AudienceCommsSummary({ audience, memberIds }) {
  const { interactions, tasks, audiencePushes, contractors } = useCRM();
  const [lastManualComm, setLastManualComm] = useState(null);

  useEffect(() => {
    if (!window.SB) return;
    window.SB.from('crm_audit_log')
      .select('changed_at,metadata')
      .eq('entity_type','audience').eq('entity_id',audience.id).eq('action','manual_comm')
      .order('changed_at',{ascending:false}).limit(1)
      .then(({data}) => { if (data?.[0]) setLastManualComm(data[0]); });
  }, [audience.id]);

  const memberSet = useMemo(() => new Set(memberIds), [memberIds]);

  // ── Push history ────────────────────────────────────────────────
  const myPushes = audiencePushes.filter(p => p.audience_id === audience.id);
  const lastPush = myPushes[0] || null;
  const pushesToday = myPushes.filter(p =>
    new Date(p.pushed_at).toDateString() === new Date().toDateString()
  ).length;

  // ── CRM touches ─────────────────────────────────────────────────
  const now = Date.now();
  const weekAgo = now - 7 * 86400000;
  const monthAgo = now - 30 * 86400000;

  const memberInteractions = interactions.filter(i => memberSet.has(i.contractor_id));
  const touchesThisWeek = memberInteractions.filter(i => new Date(i.created_at).getTime() >= weekAgo).length;
  const touchesThisMonth = memberInteractions.filter(i => new Date(i.created_at).getTime() >= monthAgo).length;
  const uniqueTouchedThisMonth = new Set(
    memberInteractions.filter(i => new Date(i.created_at).getTime() >= monthAgo).map(i => i.contractor_id)
  ).size;

  // ── Collision detection ─────────────────────────────────────────
  const today = new Date().toDateString();

  const tasksDueToday = tasks.filter(t =>
    memberSet.has(t.contractor_id) && !t.is_completed &&
    t.due_date && new Date(t.due_date).toDateString() === today
  );

  // Other audience pushes today that overlap with this audience
  const otherPushesToday = audiencePushes.filter(p =>
    p.audience_id !== audience.id &&
    new Date(p.pushed_at).toDateString() === today &&
    p.snapshot_ids?.some(id => memberSet.has(id))
  );

  const overlappingFromOtherPushes = otherPushesToday.reduce((acc, push) => {
    (push.snapshot_ids || []).forEach(id => { if (memberSet.has(id)) acc.add(id); });
    return acc;
  }, new Set()).size;

  // FUTURE: once Braze is connected, add Braze send history to collision detection
  // by checking crm_audience_pushes where integration = 'braze' and pushed_at = today
  // No architectural changes needed — just add to otherPushesToday filter

  const hasCollision = tasksDueToday.length > 0 || overlappingFromOtherPushes > 0;

  // ── Most recent CRM outreach to any member (email/call only) ────
  const memberOutreach = memberInteractions
    .filter(i => i.type === 'email' || i.type === 'call')
    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  const lastOutreach = memberOutreach[0] || null;
  const outreachedCount = new Set(memberOutreach.map(i => i.contractor_id)).size;

  // ── Active pipeline ─────────────────────────────────────────────
  const activePipeline = memberIds.filter(id => {
    const rec = getBestContractorRecord(contractors, id);
    return rec && !['Converted','Not Interested'].includes(rec.pipeline_stage);
  }).length;

  return (
    <div style={{display:'flex',flexDirection:'column',gap:6,paddingTop:10,marginTop:4,borderTop:'0.5px solid #E2DFEF'}}>
      <div style={{fontSize:10,fontWeight:600,color:'#B8B4D4',textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:2}}>Activity</div>

      {/* Push history row */}
      <div style={{display:'flex',alignItems:'center',gap:8,fontSize:11}}>
        <span style={{color:'#9590C0',flexShrink:0}}>📧</span>
        <span style={{color:'#9590C0'}}>
          {lastPush
            ? <><strong style={{color:'#1A1630'}}>{fmt.timeAgo(lastPush.pushed_at)}</strong>{' → '}{lastPush.integration}{' ('}{(lastPush.snapshot_count||0).toLocaleString()}{' sent)'}</>
            : lastManualComm
            ? <><strong style={{color:'#1A1630'}}>{fmt.timeAgo(lastManualComm.changed_at)}</strong>{' manual '}{lastManualComm.metadata?.comm_type||'comm'}{lastManualComm.metadata?.subject?` · Re: ${lastManualComm.metadata.subject}`:''}</>
            : lastOutreach
            ? <><strong style={{color:'#1A1630'}}>{outreachedCount} member{outreachedCount!==1?'s':''}</strong>{' contacted via CRM · last '}{fmt.timeAgo(lastOutreach.created_at)}</>
            : <span style={{color:'#B8B4D4'}}>Never contacted</span>
          }
        </span>
        {myPushes.length > 1 && (
          <span style={{fontSize:9,padding:'1px 5px',borderRadius:4,background:'#F0EEF8',color:'#9590C0'}}>
            {myPushes.length} total
          </span>
        )}
      </div>

      {/* CRM touches row */}
      <div style={{display:'flex',alignItems:'center',gap:8,fontSize:11}}>
        <span style={{color:'#9590C0',flexShrink:0}}>👥</span>
        <span style={{color:'#9590C0'}}>
          {touchesThisWeek > 0
            ? <><strong style={{color:'#1A1630'}}>{touchesThisWeek}</strong>{' this week · '}{touchesThisMonth}{' this month · '}{uniqueTouchedThisMonth}{' unique'}</>
            : memberInteractions.length > 0
            ? <><strong style={{color:'#1A1630'}}>{memberInteractions.length}</strong>{' total CRM touches'}</>
            : <span style={{color:'#B8B4D4'}}>No CRM activity yet</span>
          }
        </span>
      </div>

      {/* Active pipeline row */}
      {activePipeline > 0 && (
        <div style={{display:'flex',alignItems:'center',gap:8,fontSize:11}}>
          <span style={{color:'#9590C0',flexShrink:0}}>⚡</span>
          <span style={{color:'#9590C0'}}>
            <strong style={{color:'#1A1630'}}>{activePipeline}</strong>{' in active pipeline'}
          </span>
        </div>
      )}

      {/* Collision warning */}
      {hasCollision && (
        <div style={{marginTop:4,padding:'6px 10px',borderRadius:7,background:'rgba(245,158,11,0.1)',border:'1px solid rgba(245,158,11,0.25)',display:'flex',alignItems:'flex-start',gap:6}}>
          <span style={{fontSize:12,flexShrink:0}}>⚡</span>
          <div style={{fontSize:10,color:'#F59E0B',lineHeight:1.5}}>
            <strong>Multi-comms today: </strong>
            {tasksDueToday.length > 0 && <span>{tasksDueToday.length} CRM task{tasksDueToday.length>1?'s':''} due today</span>}
            {tasksDueToday.length > 0 && overlappingFromOtherPushes > 0 && ' · '}
            {overlappingFromOtherPushes > 0 && <span>{overlappingFromOtherPushes} also in another push today</span>}
          </div>
        </div>
      )}
    </div>
  );
}

function AudienceCard({ audience, onEdit, onDelete, onPush, compareAudienceId, allAudiences }) {
  const nav = useNavigate();
  const { users, interactions, tasks, audiencePushes, contractors, conversions, audiences: allAudiencesCtx } = useCRM();
  const creator = users.find(u => u.id === audience.created_by);
  const assignees = (audience.assigned_users || (audience.assigned_to ? [audience.assigned_to] : [])).map(id => users.find(u => u.id === id)).filter(Boolean);
  const [showPush, setShowPush] = useState(false);
  const [showMembers, setShowMembers] = useState(false);
  const pushRef = useRef(null);
  const isDynamic = audience.audience_type === 'dynamic';
  const liveCount = isDynamic ? getAudienceMembers(audience).length : null;
  const displayCount = isDynamic ? liveCount : (audience.static_member_ids?.length || audience.member_count || 0);

  const memberIds = useMemo(() =>
    audience.audience_type === 'static'
      ? (audience.static_member_ids || [])
      : getAudienceMembers(audience, interactions, conversions, contractors, allAudiencesCtx),
  [audience, interactions, conversions, contractors, allAudiencesCtx]);

  // Fix 5: Compute overlap with the selected compare audience
  const overlapInfo = useMemo(() => {
    if (!compareAudienceId || !allAudiences) return null;
    const compareTarget = allAudiences.find(a => a.id === compareAudienceId);
    if (!compareTarget) return null;
    return getAudienceOverlap(audience, compareTarget);
  }, [compareAudienceId, allAudiences, audience]);

  useEffect(() => {
    const fn = e => { if (pushRef.current && !pushRef.current.contains(e.target)) setShowPush(false); };
    document.addEventListener('mousedown', fn);
    return () => document.removeEventListener('mousedown', fn);
  }, []);

  return (
    <div className="card p-5"
      style={{display:'flex',flexDirection:'column',gap:12,cursor:'pointer',transition:'box-shadow .15s'}}
      onClick={() => nav('/audiences/'+audience.id)}
      onMouseEnter={e => e.currentTarget.style.boxShadow='0 4px 16px rgba(96,45,245,0.15)'}
      onMouseLeave={e => e.currentTarget.style.boxShadow=''}>
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:8}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:14,fontWeight:600,color:'#1A1630',marginBottom:4,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{audience.name}</div>
          {audience.description && <div style={{fontSize:11,color:'#9590C0',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{audience.description}</div>}
        </div>
        <span style={{fontSize:10,padding:'2px 8px',borderRadius:999,fontWeight:600,background:isDynamic?'#EEEDFE':'#F5F4FA',color:isDynamic?'#602DF5':'#9590C0',border:isDynamic?'0.5px solid #C4B8F7':'0.5px solid #D4D0EE'}}>
          {isDynamic ? '⟳ Dynamic' : '📸 Static'}
        </span>
      </div>
      <div style={{display:'flex',alignItems:'baseline',gap:6}}>
        <span style={{fontSize:28,fontWeight:700,color:'#7A50F7'}}>{displayCount?.toLocaleString() || 0}</span>
        <span style={{fontSize:12,color:'#9590C0'}}>contractors</span>
        {/* Fix 5: Overlap indicator */}
        {overlapInfo && (
          <span style={{fontSize:11,padding:'2px 8px',borderRadius:99,background:'rgba(234,179,8,0.08)',border:'1px solid rgba(234,179,8,0.25)',color:'rgba(234,179,8,0.85)',marginLeft:4}}>
            ⟷ {overlapInfo.count.toLocaleString()} overlap
          </span>
        )}
      </div>
      <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
        {(audience.filter_rules||[]).slice(0,3).map((rule,i) => {
          const field = AUDIENCE_FIELDS.find(f => f.key === rule.field);
          return <span key={i} style={{fontSize:10,padding:'2px 8px',borderRadius:6,background:'#F5F4FA',color:'#9590C0',border:'0.5px solid #D4D0EE'}}>{field?.label||rule.field} {rule.operator} {String(rule.value)}</span>;
        })}
        {(audience.filter_rules||[]).length > 3 && <span style={{fontSize:10,color:'#B8B4D4'}}>+{(audience.filter_rules||[]).length-3} more</span>}
      </div>
      {/* Exclusion summary */}
      {(() => {
        const excCount = (audience.excluded_audience_ids?.length || 0) + (audience.excluded_pipeline_stages?.length || 0) + (audience.excluded_conversion_types?.length || 0) + (audience.excluded_recent_contact_days ? 1 : 0);
        return excCount > 0 ? (
          <div style={{display:'flex',alignItems:'center',gap:6,fontSize:10,color:'#f87171'}}>
            <span style={{padding:'2px 8px',borderRadius:6,background:'rgba(239,68,68,0.06)',border:'1px solid rgba(239,68,68,0.15)'}}>
              🚫 {excCount} exclusion{excCount>1?'s':''}
            </span>
          </div>
        ) : null;
      })()}
      {/* Communication summary */}
      <div onClick={e => e.stopPropagation()}>
        <AudienceCommsSummary audience={audience} memberIds={memberIds} />
      </div>

      {/* Action buttons — stopPropagation so they don't trigger card navigation */}
      <div style={{display:'flex',gap:8,paddingTop:8,borderTop:'0.5px solid #E2DFEF'}} onClick={e => e.stopPropagation()}>
        <div ref={pushRef} style={{position:'relative'}}>
          <button onClick={() => setShowPush(o => !o)} style={{padding:'6px 12px',borderRadius:8,fontSize:12,background:'linear-gradient(135deg,#602DF5,#7A50F7)',color:'#FFFFFF',border:'none',cursor:'pointer',fontFamily:'Poppins,sans-serif',display:'flex',alignItems:'center',gap:6}}>Push ▾</button>
          {showPush && (
            <div style={{position:'absolute',bottom:36,left:0,background:'#FFFFFF',border:'0.5px solid #E2DFEF',borderRadius:8,boxShadow:'0 4px 16px rgba(0,0,0,0.4)',zIndex:50,minWidth:160,overflow:'hidden'}}>
              {INTEGRATION_REGISTRY.map(integ => {
                const cfg = window.CRM_CONFIG?.integrations?.[integ.key];
                const conn = integ.isConnected(cfg);
                return <button key={integ.key} onClick={() => { setShowPush(false); onPush(integ.key); }}
                  style={{width:'100%',padding:'9px 12px',textAlign:'left',fontSize:12,color:conn?'#1A1630':'#B8B4D4',background:'none',border:'none',borderBottom:'0.5px solid #F0EEF8',cursor:conn?'pointer':'default',display:'flex',alignItems:'center',gap:8,fontFamily:'Poppins,sans-serif'}}
                  onMouseEnter={e=>{if(conn)e.currentTarget.style.background='#F5F4FA';}} onMouseLeave={e=>e.currentTarget.style.background='none'}>
                  <span>{integ.icon}</span><span style={{flex:1}}>{integ.label}</span>
                  {!conn && <span style={{fontSize:10,color:'#B8B4D4'}}>Not connected</span>}
                </button>;
              })}
            </div>
          )}
        </div>
        <button onClick={onEdit} style={{padding:'6px 12px',borderRadius:8,fontSize:12,background:'#F5F4FA',color:'#5856B7',border:'none',cursor:'pointer',fontFamily:'Poppins,sans-serif'}}>Edit</button>
        <button onClick={onDelete} style={{padding:'6px 12px',borderRadius:8,fontSize:12,background:'none',color:'#f87171',border:'1px solid rgba(239,68,68,0.2)',cursor:'pointer',fontFamily:'Poppins,sans-serif',marginLeft:'auto',opacity:0.7}} onMouseEnter={e=>e.currentTarget.style.opacity=1} onMouseLeave={e=>e.currentTarget.style.opacity=0.7}>Delete</button>
      </div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:-8}}>
        <div style={{fontSize:10,color:'#B8B4D4',display:'flex',alignItems:'center',gap:4}}>
          {creator && <><Avatar user={creator} /><span>Created by {creator.name.split(' ')[0]}</span></>}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          {assignees.length > 0 && (
            <div style={{display:'flex',alignItems:'center',gap:3}}>
              {assignees.slice(0,4).map((u,i) => (
                <div key={u.id} title={u.name} style={{marginLeft:i>0?-6:0,zIndex:assignees.length-i,position:'relative',border:'1px solid #E2DFEF',borderRadius:'50%'}}>
                  <Avatar user={u} />
                </div>
              ))}
              {assignees.length > 4 && <span style={{fontSize:10,color:'#B8B4D4',marginLeft:4}}>+{assignees.length-4}</span>}
            </div>
          )}
          <div style={{fontSize:10,color:'#B8B4D4'}}>Updated {fmt.timeAgo(audience.dat_updated)}</div>
        </div>
      </div>
    </div>
  );
}

// ─── EXCLUSION BUILDER ──────────────────────────────────────────────────────
function ExclusionBuilder({ audience, audiences, onChange }) {

  useEffect(() => {
    const timer = setTimeout(() => {
      const result = evaluateAudience(audience, interactions, conversions, contractors, audiences);
      setPreview(result);
    }, 300);
    return () => clearTimeout(timer);
  }, [
    audience.filter_rules,
    audience.excluded_audience_ids,
    audience.excluded_pipeline_stages,
    audience.excluded_recent_contact_days,
    audience.excluded_conversion_types,

  const excludableAudiences = (audiences || []).filter(a => a.id && a.id !== audience.id);

  return (
    <div style={{display:'flex',flexDirection:'column',gap:16}}>

        <select className="filter-input text-xs w-full py-1" value=""
          onChange={e => { if (!e.target.value) return; onChange({ excluded_pipeline_stages: [...new Set([...(audience.excluded_pipeline_stages || []), e.target.value])] }); }}>
          <option value="">+ Add stage exclusion…</option>
          {PIPELINE_STAGES.filter(s => !(audience.excluded_pipeline_stages || []).includes(s)).map(s => (
            <option key={s} value={s}>{s}</option>
          ))}
        </select>
      </div>

      {/* Exclude by recency */}
      <div>
        <div style={{fontSize:11,color:'#9590C0',marginBottom:6,fontWeight:500}}>Exclude contractors contacted within:</div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <input type="number" className="filter-input text-xs py-1" style={{width:80}} placeholder="days" min={1} max={365}
            value={audience.excluded_recent_contact_days || ''}
            onChange={e => onChange({ excluded_recent_contact_days: e.target.value ? parseInt(e.target.value) : null })} />
          <span style={{fontSize:11,color:'#9590C0'}}>days</span>
          {audience.excluded_recent_contact_days && (
            <button onClick={() => onChange({ excluded_recent_contact_days: null })}
              style={{fontSize:11,color:'#EF4444',background:'none',border:'none',cursor:'pointer',fontFamily:'Poppins,sans-serif'}}>Clear</button>
          )}
        </div>
      </div>

      {/* Exclude by conversion type */}
      <div>
        <div style={{fontSize:11,color:'#9590C0',marginBottom:6,fontWeight:500}}>Exclude contractors already converted to:</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:6}}>
          {(audience.excluded_conversion_types || []).map(type => (
            <span key={type} style={{fontSize:11,padding:'3px 10px',borderRadius:999,background:'#F8D7DA',color:'#721C24',border:'0.5px solid #F5C6CB',display:'flex',alignItems:'center',gap:6}}>
              {type.replace(/_/g,' ')}
              <button onClick={() => onChange({ excluded_conversion_types: (audience.excluded_conversion_types || []).filter(t => t !== type) })}
                style={{background:'none',border:'none',cursor:'pointer',color:'#EF4444',fontSize:14,lineHeight:1,padding:0}}>×</button>
            </span>
          ))}
        </div>
        <select className="filter-input text-xs w-full py-1" value=""
          onChange={e => { if (!e.target.value) return; onChange({ excluded_conversion_types: [...new Set([...(audience.excluded_conversion_types || []), e.target.value])] }); }}>
          <option value="">+ Add conversion exclusion…</option>
          {['RESERVE','FUTURE_FUND','GLOBAL_ACCOUNT'].filter(t => !(audience.excluded_conversion_types || []).includes(t)).map(t => (
            <option key={t} value={t}>{t.replace(/_/g,' ')}</option>
          ))}
        </select>
      </div>

      {/* Live exclusion preview */}
      {preview && preview.exclusionBreakdown.total > 0 && (
        <div style={{padding:'12px 14px',borderRadius:10,background:'#FFF5F5',border:'0.5px solid #F5C6CB'}}>
          <div style={{fontSize:12,fontWeight:600,color:'#1A1630',marginBottom:8}}>Exclusion Preview</div>
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'#9590C0'}}>
              <span>Before exclusions</span>
              <span style={{fontWeight:600,color:'#1A1630'}}>{(preview.matches.length + preview.exclusionBreakdown.total).toLocaleString()}</span>
            </div>
            {preview.exclusionBreakdown.by_audience > 0 && (
              <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'#721C24',paddingLeft:8}}>
                <span>- Audience exclusions</span><span>{preview.exclusionBreakdown.by_audience}</span>
              </div>
            )}
            {preview.exclusionBreakdown.by_stage > 0 && (
              <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'#721C24',paddingLeft:8}}>
                <span>- Pipeline stage</span><span>{preview.exclusionBreakdown.by_stage}</span>
              </div>
            )}
            {preview.exclusionBreakdown.by_recency > 0 && (
              <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'#721C24',paddingLeft:8}}>
                <span>- Recently contacted</span><span>{preview.exclusionBreakdown.by_recency}</span>
              </div>
            )}
            {preview.exclusionBreakdown.by_conversion > 0 && (
              <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'#721C24',paddingLeft:8}}>
                <span>- Already converted</span><span>{preview.exclusionBreakdown.by_conversion}</span>
              </div>
            )}
            <div style={{display:'flex',justifyContent:'space-between',fontSize:13,fontWeight:700,paddingTop:6,borderTop:'0.5px solid #F5C6CB'}}>
              <span style={{color:'#1A1630'}}>After exclusions</span>
              <span style={{color:'#7A50F7'}}>{preview.matches.length.toLocaleString()}</span>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function AudienceBuilder({ audience, onSave, onClose }) {
  const { users, audiences } = useCRM();
  const isEdit = !!audience?.id;
  const [name, setName] = useState(audience?.name || '');
  const [description, setDescription] = useState(audience?.description || '');
  const [audienceType, setAudienceType] = useState(audience?.audience_type || 'dynamic');
  const [rules, setRules] = useState(audience?.filter_rules || []);
  const [team, setTeam] = useState(audience?.team || '');
  const [sizeLimit, setSizeLimit] = useState(audience?.size_limit || '');
  const [excludedAudienceIds, setExcludedAudienceIds] = useState(audience?.excluded_audience_ids || []);
  const [excludedPipelineStages, setExcludedPipelineStages] = useState(audience?.excluded_pipeline_stages || []);
  const [excludedRecentContactDays, setExcludedRecentContactDays] = useState(audience?.excluded_recent_contact_days || null);
  const [excludedConversionTypes, setExcludedConversionTypes] = useState(audience?.excluded_conversion_types || []);
  // assigned_users: array of user IDs
  const [assignedUsers, setAssignedUsers] = useState(audience?.assigned_users || (audience?.assigned_to ? [audience.assigned_to] : []));
  const [defaultSegment, setDefaultSegment] = useState(audience?.default_segment || '');
  const [saving, setSaving] = useState(false);

  const activeUsers = users.filter(u => u.is_active !== false);

  function toggleUser(uid) {
    setAssignedUsers(prev => prev.includes(uid) ? prev.filter(id => id !== uid) : [...prev, uid]);
  }
  function selectWholeTeam(teamKey) {
    if (!teamKey) return;
    const teamMembers = activeUsers.filter(u => u.team === teamKey).map(u => u.id);
    setAssignedUsers(prev => {
      const merged = [...new Set([...prev, ...teamMembers])];
      return merged;
    });
  }

  const previewCount = useMemo(() => rules.length === 0 ? 0 : getAudienceMembers({ filter_rules: rules, size_limit: sizeLimit || null }).length, [rules, sizeLimit]);

  function addRule() { setRules(prev => [...prev, { field: 'wallet', operator: '>', value: '' }]); }
  function updateRule(i, u) { setRules(prev => prev.map((r, j) => j === i ? { ...r, ...u } : r)); }
  function removeRule(i) { setRules(prev => prev.filter((_, j) => j !== i)); }

  async function handleSave() {
    if (!name.trim()) return;
    setSaving(true);
    await onSave({
      id: audience?.id, name: name.trim(), description: description.trim() || null,
      audience_type: audienceType, filter_rules: rules.filter(r => r.value !== ''),
      team: team || null, size_limit: sizeLimit ? parseInt(sizeLimit) : null,
      assigned_users: assignedUsers.length > 0 ? assignedUsers : null,
      excluded_audience_ids: excludedAudienceIds.length > 0 ? excludedAudienceIds : null,
      excluded_pipeline_stages: excludedPipelineStages.length > 0 ? excludedPipelineStages : null,
      excluded_recent_contact_days: excludedRecentContactDays || null,
      excluded_conversion_types: excludedConversionTypes.length > 0 ? excludedConversionTypes : null,
      default_segment: defaultSegment || null,
    });
    setSaving(false);
  }

  return (
    <div className="modal-overlay">
      <div className="modal p-6" style={{maxWidth:600,maxHeight:'90vh',overflowY:'auto'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
          <h3 style={{fontSize:16,fontWeight:700,color:'#1A1630'}}>{isEdit ? 'Edit Audience' : 'New Audience'}</h3>
          <button onClick={onClose} style={{color:'#9590C0',background:'none',border:'none',cursor:'pointer',fontSize:20,lineHeight:1}}>×</button>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          <div>
            <label style={{fontSize:11,color:'#9590C0',display:'block',marginBottom:4}}>Audience name *</label>
            <input className="filter-input w-full" placeholder="e.g. High wallet balance Colombia" value={name} onChange={e => setName(e.target.value)} />
          </div>
          <div>
            <label style={{fontSize:11,color:'#9590C0',display:'block',marginBottom:4}}>Description (optional)</label>
            <input className="filter-input w-full" placeholder="What is this audience for?" value={description} onChange={e => setDescription(e.target.value)} />
          </div>
          <div>
            <label style={{fontSize:11,color:'#9590C0',display:'block',marginBottom:4}}>Intended upsell product</label>
            <select className="filter-input w-full" value={defaultSegment} onChange={e => setDefaultSegment(e.target.value)}>
              <option value="">Not specified</option>
              {Object.entries(SEG_CFG).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
            </select>
            {defaultSegment && SEG_TO_TEAM[defaultSegment] && (
              <div style={{fontSize:10,color:'#9590C0',marginTop:4}}>
                Will pre-fill pipeline team as <strong>{TEAMS[SEG_TO_TEAM[defaultSegment]]?.label}</strong> when adding to pipeline
              </div>
            )}
          </div>
          <div>
            <label style={{fontSize:11,color:'#9590C0',display:'block',marginBottom:6}}>Type</label>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
              {[{v:'dynamic',icon:'⟳',l:'Dynamic',d:'Auto-updates as data changes'},{v:'static',icon:'📸',l:'Static',d:'Snapshot at save time'}].map(opt => (
                <button key={opt.v} onClick={() => setAudienceType(opt.v)}
                  style={{padding:12,borderRadius:10,textAlign:'left',cursor:'pointer',fontFamily:'Poppins,sans-serif',
                    background:audienceType===opt.v?'#EEEDFE':'#F5F4FA',
                    border:audienceType===opt.v?'2px solid #602DF5':'2px solid #D4D0EE'}}>
                  <div style={{fontSize:16,marginBottom:4}}>{opt.icon}</div>
                  <div style={{fontSize:12,fontWeight:600,color:'#1A1630',marginBottom:2}}>{opt.l}</div>
                  <div style={{fontSize:10,color:'#9590C0',lineHeight:1.4}}>{opt.d}</div>
                </button>
              ))}
            </div>
          </div>
          <div>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
              <label style={{fontSize:11,color:'#9590C0'}}>Filter rules (ALL must match)</label>
              <button onClick={addRule} style={{fontSize:11,padding:'3px 10px',borderRadius:6,background:'#EEEDFE',color:'#602DF5',border:'0.5px solid #C4B8F7',cursor:'pointer',fontFamily:'Poppins,sans-serif'}}>+ Add rule</button>
            </div>
            {rules.length === 0 ? (
              <div style={{padding:16,textAlign:'center',background:'#F5F4FA',borderRadius:8,border:'1px dashed #D4D0EE',fontSize:12,color:'#9590C0'}}>No rules yet. Add a rule to filter contractors.</div>
            ) : (
              <div style={{display:'flex',flexDirection:'column',gap:8}}>
                {rules.map((rule, i) => {
                  const fd = AUDIENCE_FIELDS.find(f => f.key === rule.field) || AUDIENCE_FIELDS[0];
                  const ops = AUDIENCE_OPERATORS[fd.type] || AUDIENCE_OPERATORS.number;
                  return (
                    <div key={i} style={{display:'flex',gap:6,alignItems:'center'}}>
                      <select className="filter-input text-xs py-1 flex-1" value={rule.field}
                        onChange={e => {
                          const newField = AUDIENCE_FIELDS.find(f=>f.key===e.target.value);
                          updateRule(i, {
                            field: e.target.value,
                            operator: AUDIENCE_OPERATORS[newField?.type||'number'][0],
                            value: newField?.options?.[0] || '', // default to first option for select fields
                          });
                        }}>
                        {AUDIENCE_FIELDS.map(f => <option key={f.key} value={f.key}>{f.label}</option>)}
                      </select>
                      <select className="filter-input text-xs py-1" style={{width:80}} value={rule.operator}
                        onChange={e => updateRule(i, { operator:e.target.value })}>
                        {ops.map(op => <option key={op} value={op}>{op}</option>)}
                      </select>
                      {fd.type === 'boolean' ? (
                        <select className="filter-input text-xs py-1" style={{width:80}} value={String(rule.value)}
                          onChange={e => updateRule(i, { value:e.target.value })}>
                          <option value="true">Yes</option><option value="false">No</option>
                        </select>
                      ) : fd.options ? (
                        <select className="filter-input text-xs py-1" style={{width:140}} value={rule.value}
                          onChange={e => updateRule(i, { value:e.target.value })}>
                          <option value="">Select…</option>
                          {fd.options.map(o => <option key={o} value={o}>{o}</option>)}
                        </select>
                      ) : (
                        <input className="filter-input text-xs py-1" style={{width:100}} placeholder={fd.format==='currency'?'0':'value'}
                          value={rule.value} onChange={e => updateRule(i, { value:e.target.value })} />
                      )}
                      <button onClick={() => removeRule(i)} style={{width:24,height:24,borderRadius:6,background:'none',border:'none',color:'#9590C0',cursor:'pointer',fontSize:16,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}
                        onMouseEnter={e=>e.currentTarget.style.color='#EF4444'} onMouseLeave={e=>e.currentTarget.style.color='#9590C0'}>×</button>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
          {rules.length > 0 && (
            <div style={{padding:'12px 16px',borderRadius:10,background:'#EEEDFE',border:'0.5px solid #C4B8F7',display:'flex',alignItems:'center',gap:10}}>
              <span style={{fontSize:24,fontWeight:700,color:'#602DF5'}}>{previewCount.toLocaleString()}</span>
              <div>
                <div style={{fontSize:12,fontWeight:600,color:'#1A1630'}}>contractors match</div>
                <div style={{fontSize:11,color:'#9590C0'}}>{audienceType==='static'?'Snapshotted on save':'Updates automatically'}</div>
              </div>
            </div>
          )}
          <ExclusionBuilder
            audience={{
              id: audience?.id,
              filter_rules: rules,
              size_limit: sizeLimit || null,
              excluded_audience_ids: excludedAudienceIds,
              excluded_pipeline_stages: excludedPipelineStages,
              excluded_recent_contact_days: excludedRecentContactDays,
              excluded_conversion_types: excludedConversionTypes,
            }}
            audiences={audiences}
            onChange={(updates) => {
              if (updates.excluded_audience_ids !== undefined) setExcludedAudienceIds(updates.excluded_audience_ids);
              if (updates.excluded_pipeline_stages !== undefined) setExcludedPipelineStages(updates.excluded_pipeline_stages);
              if (updates.excluded_recent_contact_days !== undefined) setExcludedRecentContactDays(updates.excluded_recent_contact_days);
              if (updates.excluded_conversion_types !== undefined) setExcludedConversionTypes(updates.excluded_conversion_types);
            }}
          />
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            <div>
              <label style={{fontSize:11,color:'#9590C0',display:'block',marginBottom:4}}>Team (optional)</label>
              <select className="filter-input text-xs w-full py-1.5" value={team} onChange={e => setTeam(e.target.value)}>
                <option value="">Shared</option>
                {Object.entries(TEAMS).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
              </select>
            </div>
            <div>
              <label style={{fontSize:11,color:'#9590C0',display:'block',marginBottom:4}}>Size limit (optional)</label>
              <input className="filter-input text-xs w-full py-1.5" type="number" placeholder="No limit" value={sizeLimit} onChange={e => setSizeLimit(e.target.value)} min={1} />
            </div>
          </div>
          <div>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
              <label style={{fontSize:11,color:'#9590C0'}}>Assign to (optional)</label>
              {Object.keys(TEAMS).length > 0 && (
                <div style={{display:'flex',gap:4}}>
                  {Object.entries(TEAMS).map(([k,v]) => (
                    <button key={k} onClick={() => selectWholeTeam(k)}
                      style={{fontSize:10,padding:'2px 8px',borderRadius:999,background:'#F0EEF8',color:'#5856B7',border:'0.5px solid #D4D0EE',cursor:'pointer',fontFamily:'Poppins,sans-serif'}}
                      title={`Add all ${v.label} members`}>
                      + {v.label} team
                    </button>
                  ))}
                </div>
              )}
            </div>
            <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
              {activeUsers.map(u => {
                const sel = assignedUsers.includes(u.id);
                return (
                  <button key={u.id} onClick={() => toggleUser(u.id)}
                    style={{display:'flex',alignItems:'center',gap:6,padding:'5px 10px',borderRadius:999,cursor:'pointer',fontFamily:'Poppins,sans-serif',fontSize:12,transition:'all .15s',
                      background:sel?'#EEEDFE':'#F5F4FA',
                      border:sel?'1px solid #602DF5':'0.5px solid #D4D0EE',
                      color:sel?'#1A1630':'#9590C0'}}>
                    <Avatar user={u} />
                    <span>{u.name.split(' ')[0]}</span>
                    {sel && <span style={{fontSize:10,color:'#602DF5'}}>✓</span>}
                  </button>
                );
              })}
              {activeUsers.length === 0 && <span style={{fontSize:12,color:'#9590C0'}}>No team members yet</span>}
            </div>
            {assignedUsers.length > 0 && (
              <button onClick={() => setAssignedUsers([])} style={{marginTop:6,fontSize:10,color:'#9590C0',background:'none',border:'none',cursor:'pointer',fontFamily:'Poppins,sans-serif'}}>
                Clear all
              </button>
            )}
          </div>
          <button onClick={handleSave} disabled={saving||!name.trim()||rules.filter(r=>r.value!=='').length===0}
            style={{width:'100%',padding:'11px 0',borderRadius:999,background:'linear-gradient(135deg,#602DF5,#7A50F7)',color:'#FFFFFF',border:'none',cursor:'pointer',fontSize:13,fontWeight:600,fontFamily:'Poppins,sans-serif',opacity:(saving||!name.trim()||rules.filter(r=>r.value!=='').length===0)?0.4:1}}>
            {saving ? 'Saving…' : isEdit ? 'Save Changes' : 'Create Audience' + (previewCount>0?' · '+previewCount.toLocaleString()+' contractors':'')}
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── MY DAY VIEW ──────────────────────────────────────────────────────────────
function MyDayView() {
  const { contractors, tasks, interactions, users, audiences, currentUser, effectiveViewUser, deletePipelineRecord, syncConversions, conversionSyncing, lastConversionSync, conversions } = useCRM();
  const nav = useNavigate();
  const me = effectiveViewUser;
  const today = new Date().toDateString();

  // Sync conversions once when My Day mounts
  useEffect(() => {
    syncConversions();
  }, []); // eslint-disable-line react-hooks/exhaustive-deps

  const myContractors = Object.entries(contractors).flatMap(([,teams])=>Object.values(teams)).filter(c => c.assigned_to === me?.id);
  const myAudiences = (audiences || []).filter(a => {
    const users_arr = a.assigned_users || (a.assigned_to ? [a.assigned_to] : []);
    return users_arr.includes(me?.id);
  });
  const tasksDueToday = tasks.filter(t => t.assigned_to === me?.id && !t.is_completed && t.due_date && new Date(t.due_date).toDateString() === today);
  const tasksOverdue = tasks.filter(t => t.assigned_to === me?.id && isOverdue(t));

  // Real conversion KPI data from crm_conversions
  const myConversions = conversions.filter(c => c.attributed_to === me?.id);
  const now = new Date();
  const convertedThisMonth = myConversions.filter(c => {
    const d = new Date(c.converted_at);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  });
  const convertedThisWeek = myConversions.filter(c =>
    new Date(c.converted_at) >= new Date(Date.now() - 7 * 86400000)
  );

  const [dismissed, setDismissed] = useState(new Set());
  const tasksRef = useRef(null);
  const [showConversionsModal, setShowConversionsModal] = useState(false);
  const [showOverdueModal, setShowOverdueModal] = useState(false);

  const prioritized = useMemo(() => {
    return myContractors
      .filter(c => c.pipeline_stage !== 'Converted' && c.pipeline_stage !== 'Not Interested')
      .map(c => {
        const myTasks2 = tasks.filter(t => t.contractor_id === c.contractor_id && !t.is_completed);
        const overdueTask = myTasks2.some(t => isOverdue(t));
        const lastInteraction = interactions.find(i => i.contractor_id === c.contractor_id && i.type !== 'note');
        const daysSinceContact = lastInteraction ? Math.floor((Date.now() - new Date(lastInteraction.created_at)) / 86400000) : 999;
        let priority = 100;
        if (overdueTask) priority = 0;
        else if (c.pipeline_stage === 'Engaged') priority = 10;
        else if (c.pipeline_stage === 'Contacted' && daysSinceContact >= 7) priority = 20;
        else if (c.pipeline_stage === 'Identified' && (c.lead_score||0) >= 75) priority = 30;
        else priority = 50 + (100 - (c.lead_score||0));
        return { ...c, overdueTask, lastInteraction, daysSinceContact, priority };
      })
      .sort((a, b) => a.priority - b.priority)
      .slice(0, 10)
      .filter(c => !dismissed.has(c.contractor_id));
  }, [myContractors, tasks, interactions, dismissed]);

  const recentActivity = useMemo(() => interactions.slice(0, 5), [interactions]);
  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';

  return (
    <div className="max-w-screen-xl mx-auto px-6 py-8">
      <div className="mb-8">
        <h1 className="text-2xl font-bold" style={{color:'#1A1630'}}>
          {greeting}, {me?.name?.split(' ')[0] || 'there'} 👋
        </h1>
        <p className="text-sm mt-1" style={{color:'#9590C0'}}>
          {new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}
        </p>
        {me?.team && (
          <div style={{display:'flex',alignItems:'center',gap:6,marginTop:6}}>
            <span style={{fontSize:12,color:'#9590C0'}}>You're on</span>
            <TeamBadge team={me.team} />
          </div>
        )}
        {/* Conversion sync status */}
        <div style={{display:'flex',alignItems:'center',gap:6,marginTop:4}}>
          {conversionSyncing ? (
            <span style={{fontSize:11,color:'rgba(255,255,255,0.4)',display:'flex',alignItems:'center',gap:4}}>
              <span style={{width:8,height:8,borderRadius:'50%',background:'#602DF5',opacity:0.8,display:'inline-block',animation:'pulse 1s infinite'}} />
              Syncing conversions…
            </span>
          ) : lastConversionSync ? (
            <span style={{fontSize:11,color:'#9590C0'}}>
              Conversions synced {fmt.timeAgo(lastConversionSync.toISOString())}
              {' · '}
              <button
                onClick={syncConversions}
                style={{fontSize:11,color:'#7A50F7',background:'none',border:'none',cursor:'pointer',fontFamily:'Poppins,sans-serif',padding:0}}>
                Sync now
              </button>
            </span>
          ) : null}
        </div>
      </div>

      {/* KPI chips */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:12,marginBottom:32}}>
        {[
          {label:'My Pipeline',  value:myContractors.length,          color:'#7A50F7', onClick:()=>nav('/pipeline')},
          {label:'Due Today',    value:tasksDueToday.length,           color:'#602DF5', onClick:()=>tasksRef.current?.scrollIntoView({behavior:'smooth'})},

        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.4)',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',padding:24}} onClick={()=>setShowConversionsModal(false)}>
          <div style={{background:'#FFFFFF',borderRadius:12,padding:24,maxWidth:520,width:'100%',maxHeight:'80vh',overflow:'auto',boxShadow:'0 16px 48px rgba(0,0,0,0.2)'}} onClick={e=>e.stopPropagation()}>

              <div style={{textAlign:'center',padding:32,color:'#9590C0',fontSize:13}}>No conversions yet</div>

              <div style={{display:'flex',flexDirection:'column',gap:8}}>
                {myConversions.slice().sort((a,b)=>new Date(b.converted_at)-new Date(a.converted_at)).map((c,i) => (
                  <div key={i} style={{padding:'10px 12px',borderRadius:8,background:'#F5F4FA',border:'0.5px solid #E2DFEF',display:'flex',alignItems:'center',gap:12}}>

        </div>

        {/* Right column */}
        <div style={{display:'flex',flexDirection:'column',gap:24}}>
          <div ref={tasksRef}>

            <div className="card overflow-hidden">
              {tasksDueToday.length === 0 ? (
                <div style={{padding:'20px 16px',textAlign:'center',color:'#B8B4D4',fontSize:13}}>No tasks due today 🎉</div>
              ) : tasksDueToday.map((t,i) => (
                <div key={t.id} style={{padding:'10px 14px',borderBottom:i<tasksDueToday.length-1?'0.5px solid #F0EEF8':'none'}}>

                    <button onClick={()=>nav('/contractor/'+t.contractor_id)} style={{fontSize:11,color:'#7A50F7',background:'none',border:'none',cursor:'pointer',fontFamily:'Poppins,sans-serif',flexShrink:0}}>{t.contractor_id}</button>

                </div>
              ))}
            </div>
          </div>
          {myAudiences.length > 0 && (
            <div>
              <h2 style={{fontSize:13,fontWeight:600,color:'#1A1630',marginBottom:12}}>My Audiences</h2>
              <div className="card overflow-hidden">
                {myAudiences.map((a, i) => {
                  const isDynamic = a.audience_type === 'dynamic';
                  const count = isDynamic ? getAudienceMembers(a).length : (a.static_member_ids?.length || a.member_count || 0);
                  return (
                    <div key={a.id}
                      onClick={() => nav('/audiences/'+a.id)}

                      <div style={{display:'flex',alignItems:'center',gap:8}}>
                        <span style={{fontSize:11,padding:'2px 8px',borderRadius:999,background:isDynamic?'rgba(96,45,245,0.08)':'rgba(88,86,183,0.1)',color:isDynamic?'#7A50F7':'rgba(255,255,255,0.4)',border:isDynamic?'1px solid rgba(96,45,245,0.2)':'1px solid rgba(88,86,183,0.2)',whiteSpace:'nowrap',flexShrink:0}}>{isDynamic?'⟳':'📸'}</span>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:12,fontWeight:600,color:'#1A1630',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{a.name}</div>
                          {a.description && <div style={{fontSize:11,color:'#9590C0',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{a.description}</div>}
                        </div>
                        <div style={{display:'flex',alignItems:'baseline',gap:4,flexShrink:0}}>
                          <span style={{fontSize:16,fontWeight:700,color:'#7A50F7'}}>{count.toLocaleString()}</span>
                          <span style={{fontSize:10,color:'#B8B4D4'}}>contractors</span>
                        </div>
                      </div>
                      {(a.filter_rules||[]).length > 0 && (
                        <div style={{display:'flex',flexWrap:'wrap',gap:4,marginTop:6,marginLeft:34}}>
                          {(a.filter_rules||[]).slice(0,2).map((rule,j) => {
                            const field = AUDIENCE_FIELDS.find(f => f.key === rule.field);
                            return <span key={j} style={{fontSize:10,padding:'1px 7px',borderRadius:6,background:'#F5F4FA',color:'#9590C0',border:'0.5px solid #D4D0EE'}}>{field?.label||rule.field} {rule.operator} {String(rule.value)}</span>;
                          })}
                          {(a.filter_rules||[]).length > 2 && <span style={{fontSize:10,color:'#B8B4D4'}}>+{(a.filter_rules||[]).length-2} more</span>}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}
          <div>
            <h2 style={{fontSize:13,fontWeight:600,color:'#1A1630',marginBottom:12}}>Recent team activity</h2>
            <div className="card overflow-hidden">
              {recentActivity.length === 0 ? (
                <div style={{padding:'20px 16px',textAlign:'center',color:'#B8B4D4',fontSize:13}}>No activity yet</div>
              ) : recentActivity.map((interaction,i) => {
                const actor = users.find(u => u.id === interaction.created_by);
                return (
                  <div key={interaction.id} style={{padding:'10px 14px',borderBottom:i<recentActivity.length-1?'0.5px solid #F0EEF8':'none'}}>
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      <Avatar user={actor} />
                      <div style={{flex:1,minWidth:0}}>
                        <span style={{fontSize:12,color:'#1A1630'}}>
                          <strong>{actor?.name?.split(' ')[0]||'Someone'}</strong>{' logged a '}
                          <strong>{interaction.type}</strong>{' with '}
                          <button onClick={()=>nav('/contractor/'+interaction.contractor_id)} style={{color:'#7A50F7',background:'none',border:'none',cursor:'pointer',fontFamily:'Poppins,sans-serif',fontSize:12}}>{interaction.contractor_id}</button>
                        </span>
                        <div style={{fontSize:11,color:'#B8B4D4',marginTop:2}}>{fmt.timeAgo(interaction.created_at)}</div>

              })}

          </div>
        </div>
      </div>
    </div>
  );
}

            ))}

        </div>
      </div>
    </div>
  );
}


/*
 * VENDOR DATA FILE COLUMN SPEC
 * ─────────────────────────────
 * When regenerating vendor/upsell-data.js or vendor/inactive-data.js from Onsight,
 * ensure the queries include these columns IN ORDER:
 *
 * UPSELL_DATA (active contractors):
 *   [0]  cod_contractor
 *   [1]  country
 *   [2]  amt_monthly_compensation_usd
 *   [3]  amt_wallet_balance
 *   [4]  amt_card_balance
 *   [5]  ff_net
 *   [6]  is_reserve (1/0)
 *   [7]  lifetime_card_spend
 *   [8]  card_txn_count
 *   [9]  avg_ticket
 *   [10] top_category
 *   [11] contract_type
 *   [12] days_since_first_invoice
 *   [13] company_name
 *   [14] engagement_level          ← NEW ('Active','Idle','Churn Risk','Dormant','Never Active')
 *   [15] has_card                  ← NEW (0/1)
 *   [16] new_has_card_virtual      ← NEW (0/1)
 *   [17] new_has_card_physical     ← NEW (0/1)
 *   [18] account_type              ← NEW ('Payroll Account','Personal Account','Global Account','Other')
 *   [19] has_active_contract       ← NEW (0/1)
 *   [20] consecutive_payroll_months ← NEW
 *   [21] recent_activity_bucket    ← NEW ('ACTIVE'/'INACTIVE')
 *   [22] consistency_bucket        ← NEW ('CORE'/'MID'/'OCCASIONAL')
 *
 * INACTIVE_DATA (ended/deleted contractors):
 *   [0]  cod_contractor
 *   [1]  country
 *   [2]  contract_state ('ENDED','DELETED',etc.)
 *   [3]  amt_wallet_balance
 *   [4]  amt_card_balance
 *   [5]  ff_net
 *   [6]  is_reserve (1/0)
 *   [7]  contract_type
 *   [8]  days_since_ended
 *   [9]  total_balance
 *   [10] company_name
 *   [11] amt_monthly_compensation_usd
 *   [12] engagement_level          ← NEW
 *   [13] has_card                  ← NEW (0/1)
 *   [14] new_has_card_virtual      ← NEW (0/1)
 *   [15] new_has_card_physical     ← NEW (0/1)
 *   [16] account_type              ← NEW
 *   [17] consecutive_payroll_months ← NEW
 *   [18] recent_activity_bucket    ← NEW
 *   [19] consistency_bucket        ← NEW
 */

// ─── CRM APP ────────────────────────────────────────────────────────────────
function WithNav({ country, setCountry, segment, setSegment, teamFilter, setTeamFilter, onOpenSearch, pipOwnerFilter, setPipOwnerFilter, pipSegFilter, setPipSegFilter, pipSortKey, setPipSortKey, pipTab, setPipTab, pipSourceAudience, setPipSourceAudience }) {
  const location = useLocation();
  const path = location.pathname;
  const nav = (
    <>
      <TopNav country={country} setCountry={setCountry} segment={segment} setSegment={setSegment} teamFilter={teamFilter} setTeamFilter={setTeamFilter} onOpenSearch={onOpenSearch} />
      <SlackBanner />
    </>
  );
  if (path.startsWith('/myday'))    return <>{nav}<MyDayView /></>;
  if (path.startsWith('/pipeline')) return <>{nav}<PipelineView country={country} segment={segment} teamFilter={teamFilter} ownerFilter={pipOwnerFilter} setOwnerFilter={setPipOwnerFilter} segFilter={pipSegFilter} setSegFilter={setPipSegFilter} sortKey={pipSortKey} setSortKey={setPipSortKey} pipelineTab={pipTab} setPipelineTab={setPipTab} sourceAudienceFilter={pipSourceAudience} setSourceAudienceFilter={setPipSourceAudience} /></>;
  if (path.startsWith('/leads'))    return <>{nav}<LeadsDatabase teamFilter={teamFilter} /></>;
  if (path.startsWith('/team/'))    { const uid = path.split('/')[2]; return <>{nav}<TeamMemberProfile userId={uid} /></>; }
  if (path.startsWith('/team'))     return <>{nav}<TeamView /></>;
  if (path.startsWith('/tasks'))    return <>{nav}<TasksView /></>;
  if (path.startsWith('/audiences/')) { const aid = path.split('/')[2]; return <>{nav}<AudienceDetail audienceId={aid} /></>; }
  if (path.startsWith('/audiences')) return <>{nav}<AudiencesView /></>;
  if (path.startsWith('/my-dashboards/')) { const did = path.split('/')[2]; return <>{nav}<CustomDashboardView dashboardId={did} /></>; }
  if (path.startsWith('/my-dashboards')) return <>{nav}<MyDashboardsView /></>;
  if (path.startsWith('/dashboard')) return <>{nav}<DashboardView /></>;
  if (path.startsWith('/settings')) return <>{nav}<OnsightSnapshotsSettings /></>;
  return <Navigate to="/myday" replace />;
}

function CRMApp({ ssoUser }) {
  const [country, setCountry] = useState('');
  const [segment, setSegment] = useState('');
  const [teamFilter, setTeamFilter] = useState('');
  const [searchOpen, setSearchOpen] = useState(false);
  const [pipOwnerFilter, setPipOwnerFilter] = useState('all');
  const [pipSegFilter, setPipSegFilter] = useState('');
  const [pipSortKey, setPipSortKey] = useState('lead_score');
  const [pipTab, setPipTab] = useState('kanban');
  const [pipSourceAudience, setPipSourceAudience] = useState('');

  // CMD+K global shortcut
  useEffect(() => {
    function handler(e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        setSearchOpen(o => !o);
      }
    }
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  const needsConfig = !SB && !window.CRM_DEMO && !LS.get('users').length && !CFG.supabaseUrl;
  if (needsConfig) return <ConfigScreen />;

  return (
    <HashRouter>
      <ToastProvider>
        <CRMProvider ssoUser={ssoUser}>
          <div style={{background:'#F5F4FA',minHeight:'100vh'}}>
            <Routes>
              <Route path="/contractor/:id" element={<ContractorProfile />} />
              <Route path="*" element={<WithNav country={country} setCountry={setCountry} segment={segment} setSegment={setSegment} teamFilter={teamFilter} setTeamFilter={setTeamFilter} onOpenSearch={() => setSearchOpen(true)} pipOwnerFilter={pipOwnerFilter} setPipOwnerFilter={setPipOwnerFilter} pipSegFilter={pipSegFilter} setPipSegFilter={setPipSegFilter} pipSortKey={pipSortKey} setPipSortKey={setPipSortKey} pipTab={pipTab} setPipTab={setPipTab} pipSourceAudience={pipSourceAudience} setPipSourceAudience={setPipSourceAudience} />} />
            </Routes>
            <CmdKSearch open={searchOpen} onClose={() => setSearchOpen(false)} />
          </div>
        </CRMProvider>
      </ToastProvider>
    </HashRouter>
  );
}

const _hasCRMConfig = !!_RAW_CLIENT_CONFIG;
ReactDOM.createRoot(document.getElementById('crm-root')).render(
  _hasCRMConfig
    ? <AuthGate><CRMApp /></AuthGate>
    : <ClientSetupWizard />
);
</script>
</body>
</html>
