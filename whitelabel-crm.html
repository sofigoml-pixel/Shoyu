function IssuesView({ issues }) {
  const { contractors, users } = useCRM();
  const nav = useNavigate();

  const issueConfig = {
    multi_owner_interaction: {
      icon: '👥',
      label: 'Multiple team members contacted',
      color: '#F59E0B',
      description: 'This contractor has been contacted by more than one team member. Coordinate to avoid duplicate outreach.',
    },
    converted_not_updated: {
      icon: '✓',
      label: 'Converted — stage not updated',
      color: '#10B981',
      description: 'This contractor has converted but their pipeline stage was not updated to Converted.',
    },
  };

  if (issues.length === 0) return (
    <div style={{textAlign:'center',padding:'60px 24px',color:'rgba(255,255,255,0.25)',fontSize:13}}>
      <div style={{fontSize:36,marginBottom:12}}>✅</div>
      No pipeline issues detected
      <div style={{fontSize:11,marginTop:6,color:'rgba(255,255,255,0.15)'}}>
        Checked automatically whenever pipeline data loads
      </div>
    </div>
  );

  // Group by type
  const byType = issues.reduce((acc, issue) => {
    if (!acc[issue.type]) acc[issue.type] = [];
    acc[issue.type].push(issue);
    return acc;
  }, {});

  return (
    <div style={{maxWidth:820,margin:'0 auto'}}>

      {/* Summary chips */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:12,marginBottom:24}}>
        {Object.entries(byType).map(([type, typeIssues]) => {
          const cfg = issueConfig[type] || { icon:'⚠️', label:type, color:'#9CA3AF' };
          return (
            <div key={type} className="card p-4" style={{borderLeft:`3px solid ${cfg.color}`}}>
              <div style={{fontSize:20,marginBottom:4}}>{cfg.icon}</div>
              <div style={{fontSize:22,fontWeight:700,color:cfg.color,marginBottom:2}}>{typeIssues.length}</div>
              <div style={{fontSize:11,color:'rgba(255,255,255,0.4)'}}>{cfg.label}</div>
            </div>
          );
        })}
      </div>

      {/* Issue groups */}
      {Object.entries(byType).map(([type, typeIssues]) => {
        const cfg = issueConfig[type] || { icon:'⚠️', label:type, color:'#9CA3AF', description:'' };
        return (
          <div key={type} style={{marginBottom:28}}>
            <div style={{fontSize:13,fontWeight:600,color:'rgba(255,255,255,0.8)',marginBottom:8,display:'flex',alignItems:'center',gap:8}}>
              <span>{cfg.icon}</span>
              <span>{cfg.label}</span>
              <span style={{fontSize:11,padding:'1px 8px',borderRadius:999,background:`${cfg.color}18`,color:cfg.color,border:`1px solid ${cfg.color}35`,fontWeight:600}}>
                {typeIssues.length}
              </span>
            </div>
            <div style={{fontSize:11,color:'rgba(255,255,255,0.3)',marginBottom:12,padding:'8px 12px',background:'rgba(88,86,183,0.06)',borderRadius:6,border:'1px solid rgba(122,80,247,0.1)'}}>
              {cfg.description}
            </div>
            <div className="card overflow-hidden">
              {typeIssues.map((issue, i) => {
                const fin = CONTRACTOR_MAP.get(issue.contractor_id) || {};
                const crmRec = getBestContractorRecord(contractors, issue.contractor_id);
                const owner = users.find(u => u.id === crmRec?.assigned_to);
                const involvedUsers = (issue.detail?.user_ids || [])
                  .map(uid => users.find(u => u.id === uid))
                  .filter(Boolean);

                return (
                  <div key={issue.contractor_id} style={{
                    padding:'12px 16px',
                    borderBottom: i < typeIssues.length - 1 ? '1px solid rgba(122,80,247,0.08)' : 'none',
                    display:'flex',alignItems:'center',gap:12,
                  }}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4,flexWrap:'wrap'}}>
                        <button
                          onClick={() => nav('/contractor/' + issue.contractor_id)}
                          style={{fontFamily:'monospace',fontSize:12,fontWeight:600,color:'#7A50F7',background:'none',border:'none',cursor:'pointer',padding:0}}>
                          {issue.contractor_id}
                        </button>
                        <span style={{fontSize:12}}>{cflag(fin.country)}</span>
                        {fin.company && <span style={{fontSize:11,color:'rgba(255,255,255,0.3)'}}>{fin.company}</span>}
                        {crmRec && <StageBadge stage={crmRec.pipeline_stage} />}
                      </div>
                      <div style={{fontSize:11,color:'rgba(255,255,255,0.35)',display:'flex',gap:12,flexWrap:'wrap'}}>
                        {owner && <span>Owner: <strong style={{color:'rgba(255,255,255,0.6)'}}>{owner.name}</strong></span>}
                        {involvedUsers.length > 0 && (
                          <span>
                            Contacted by:{' '}
                            <strong style={{color:'rgba(255,255,255,0.6)'}}>{involvedUsers.map(u => u.name.split(' ')[0]).join(', ')}</strong>
                          </span>
                        )}
                      </div>
                    </div>

                    {type === 'converted_not_updated' && (
                      <button
                        onClick={async () => {
                          if (!window.SB) return;
                          // Update all team records for this contractor
                          await window.SB.from('crm_contractors').update({
                            pipeline_stage: 'Converted',
                            dat_stage_changed: new Date().toISOString(),
                            dat_updated: new Date().toISOString(),
                          }).eq('contractor_id', issue.contractor_id);
                          window.location.reload();
                        }}
                        style={{padding:'6px 12px',borderRadius:8,fontSize:11,background:'rgba(16,185,129,0.08)',color:'#34D399',border:'1px solid rgba(16,185,129,0.2)',cursor:'pointer',fontFamily:'Poppins,sans-serif',fontWeight:600,whiteSpace:'nowrap',flexShrink:0}}>
                        Mark Converted
                      </button>
                    )}
                    {type === 'multi_owner_interaction' && (
                      <button
                        onClick={() => nav('/contractor/' + issue.contractor_id)}
                        style={{padding:'6px 12px',borderRadius:8,fontSize:11,background:'rgba(245,158,11,0.08)',color:'#F59E0B',border:'1px solid rgba(245,158,11,0.2)',cursor:'pointer',fontFamily:'Poppins,sans-serif',fontWeight:600,whiteSpace:'nowrap',flexShrink:0}}>
                        Review →
                      </button>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ─── PIPELINE VIEW ──────────────────────────────────────────────────────────
const CONTACTS_LOOKUP = window.CONTRACTOR_CONTACTS || {};

function SegTeamMismatchBanner() {
  const { users } = useCRM();
  const [mismatches, setMismatches] = useState(null);
  const [fixing, setFixing] = useState(false);
  const [manualTarget, setManualTarget] = useState('WORKFORCE_SUCCESS');
  const toast = useToast();

  useEffect(() => {
    if (!window.SB || !users.length) { setMismatches([]); return; }
    // Build set of user IDs per team
    const userTeamMap = Object.fromEntries(users.map(u => [u.id, u.team]));

    window.SB.from('crm_contractors')
      .select('contractor_id, team, upsell_segment, assigned_to')
      .then(({ data }) => {
        const bad = (data || []).filter(r => {
          // Signal 1: segment explicitly maps to a different team
          const correctBySegment = SEG_TO_TEAM[r.upsell_segment];
          if (correctBySegment && correctBySegment !== r.team) return true;
          // Signal 2: assigned to a user whose CRM team differs from the pipeline row's team
          if (r.assigned_to) {
            const assigneeTeam = userTeamMap[r.assigned_to];
            if (assigneeTeam && assigneeTeam !== r.team) return true;
          }
          return false;
        });
        setMismatches(bad);
      });
  }, [users.length]);

  async function fixAll() {
    if (!window.SB || !mismatches?.length) return;
    setFixing(true);
    const userTeamMap = Object.fromEntries(users.map(u => [u.id, u.team]));
    let fixed = 0;
    for (const row of mismatches) {
      // Prefer segment signal; fall back to assignee's team; finally use manualTarget
      const autoTeam = SEG_TO_TEAM[row.upsell_segment]
        || (row.assigned_to ? userTeamMap[row.assigned_to] : null);
      const correctTeam = (autoTeam && autoTeam !== row.team) ? autoTeam : manualTarget;
      if (!correctTeam || correctTeam === row.team) continue;
      const { data: full } = await window.SB.from('crm_contractors')
        .select('*').eq('contractor_id', row.contractor_id).eq('team', row.team).single();
      if (!full) continue;
      await window.SB.from('crm_contractors').insert({ ...full, team: correctTeam });
      await window.SB.from('crm_contractors').delete()
        .eq('contractor_id', row.contractor_id).eq('team', row.team);
      fixed++;
    }
    setFixing(false);
    setMismatches([]);
    toast(`Moved ${fixed} contractor${fixed!==1?'s':''} to the correct team pipeline`, 'success');
    setTimeout(() => window.location.reload(), 900);
  }

  if (!mismatches || mismatches.length === 0) return null;

  // Classify: auto-resolvable vs needs manual target
  const userTeamMap2 = Object.fromEntries(users.map(u => [u.id, u.team]));
  const autoCount = mismatches.filter(r => {
    const t = SEG_TO_TEAM[r.upsell_segment] || (r.assigned_to ? userTeamMap2[r.assigned_to] : null);
    return t && t !== r.team;
  }).length;
  const manualCount = mismatches.length - autoCount;

  return (
    <div style={{marginBottom:16,padding:'12px 16px',borderRadius:10,background:'#FFF3CD',border:'1px solid #FFEEBA',display:'flex',alignItems:'flex-start',gap:12,flexWrap:'wrap'}}>
      <div style={{flex:1,minWidth:200}}>
        <div style={{fontSize:13,fontWeight:600,color:'#856404',marginBottom:6}}>
          ⚠️ {mismatches.length} contractor{mismatches.length!==1?'s':''} in the wrong team pipeline
        </div>
        {autoCount > 0 && (
          <div style={{fontSize:11,color:'#856404',marginBottom:4}}>
            {autoCount} auto-resolved by segment
          </div>
        )}
        {manualCount > 0 && (
          <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
            <span style={{fontSize:11,color:'#856404'}}>{manualCount} need a target team — move to:</span>
            <select value={manualTarget} onChange={e=>setManualTarget(e.target.value)}
              style={{fontSize:11,padding:'3px 8px',borderRadius:6,border:'1px solid #FFEEBA',background:'#FFF8E1',color:'#856404',fontFamily:'Poppins,sans-serif',cursor:'pointer'}}>
              {Object.entries(TEAMS).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
            </select>
          </div>
        )}
      </div>
      <button onClick={fixAll} disabled={fixing}
        style={{padding:'8px 16px',borderRadius:8,fontSize:12,fontWeight:600,background:'#856404',color:'#FFFFFF',border:'none',cursor:fixing?'not-allowed':'pointer',fontFamily:'Poppins,sans-serif',opacity:fixing?0.7:1,whiteSpace:'nowrap',flexShrink:0,alignSelf:'center'}}>
        {fixing ? 'Moving…' : `Move All (${mismatches.length}) → ${TEAMS[manualTarget]?.label}`}
      </button>
    </div>
  );
}

function PipelineView({ country, segment, teamFilter, ownerFilter, setOwnerFilter, segFilter, setSegFilter, sortKey, setSortKey, pipelineTab, setPipelineTab, sourceAudienceFilter, setSourceAudienceFilter }) {
  const { contractors, tasks, users, currentUser, effectiveViewUser, viewingAs, loading, schemaOk, demoMode, reload, updateStage, deletePipelineRecord, duplicateIssues, audiences } = useCRM();
  const toast = useToast();
  const [search, setSearch] = useState('');
  const [selectMode, setSelectMode] = useState(false);
  const [selected, setSelected] = useState(new Set());
  const [bulkDeleting, setBulkDeleting] = useState(false);
  const [confirmBulkDelete, setConfirmBulkDelete] = useState(false);
  const [showClosed, setShowClosed] = useState(false);

  const canBulkDelete = currentUser?.role === 'admin';

  function toggleSelect(cid) {
    setSelected(prev => { const n = new Set(prev); n.has(cid) ? n.delete(cid) : n.add(cid); return n; });
  }
  function selectAll() {
    const all = Object.values(byStage).flat();
    setSelected(new Set(all));
  }
  function clearSelect() { setSelected(new Set()); setSelectMode(false); setConfirmBulkDelete(false); }

  async function bulkDelete() {
    setBulkDeleting(true);
    let ok = 0;
    for (const cid of selected) {
      const success = await deletePipelineRecord(cid, activeTeam);
      if (success !== false) ok++;
    }
    setBulkDeleting(false);
    setConfirmBulkDelete(false);
    clearSelect();
    toast(`Removed ${ok} contractor${ok !== 1 ? 's' : ''} from pipeline`, 'success');
  }
  const [activeTeam, setActiveTeam] = useState(teamFilter || 'ACTIVATION');

  // Default to the current user's own team once currentUser loads (only if no explicit teamFilter prop)
  useEffect(() => {
    if (!teamFilter && currentUser?.team && TEAMS[currentUser.team]) {
      setActiveTeam(currentUser.team);
    }
  }, [currentUser?.team]);

  // When viewingAs changes, reset manual owner filter
  useEffect(() => {
    setOwnerFilter('all');
  }, [viewingAs]);

  // Switch to issues tab if URL has ?tab=issues
  useEffect(() => {
    if (window.location.search.includes('tab=issues') || window.location.href.includes('tab=issues')) {
      setPipelineTab('issues');
    }
  }, []);

  // Compute effective owner filter synchronously (not via state) so useMemo is always correct.
  // When viewingAs is active, always scope to that person regardless of ownerFilter state.
  const effectiveOwnerFilter = viewingAs ? 'me' : ownerFilter;

  // Flatten two-level state for the active team
  const filtered = useMemo(() => {
    if (!schemaOk || users.length === 0) return [];
    const teamRecords = [];
    Object.entries(contractors).forEach(([cid, teams]) => {
      const rec = teams[activeTeam];
      if (!rec) return;
      teamRecords.push({ ...rec, contractor_id: cid });
    });
    return teamRecords.filter(c => {
      const fin = CONTRACTOR_MAP.get(c.contractor_id) || {};
      const contact = CONTACTS_LOOKUP[c.contractor_id] || [];
      if (country && (!fin.country || !fin.country.includes(country))) return false;
      if (segFilter && c.upsell_segment !== segFilter) return false;
      if (sourceAudienceFilter && c.source_audience_id !== sourceAudienceFilter) return false;
      if (effectiveOwnerFilter === 'me' && c.assigned_to !== effectiveViewUser?.id) return false;
      if (effectiveOwnerFilter === 'unassigned' && c.assigned_to) return false;
      if (effectiveOwnerFilter !== 'all' && effectiveOwnerFilter !== 'me' && effectiveOwnerFilter !== 'unassigned' && c.assigned_to !== effectiveOwnerFilter) return false;
      if (!showClosed && isOpportunityClosed(c)) return false;
      if (search) {
        const q = search.toLowerCase();
        const name = (contact[0] || '').toLowerCase();
        const cid = c.contractor_id.toLowerCase();
        const ctry = (fin.country || '').toLowerCase();
        const owner = users.find(u => u.id === c.assigned_to);
        const ownerName = (owner?.name || '').toLowerCase();
        if (!cid.includes(q) && !name.includes(q) && !ctry.includes(q) && !ownerName.includes(q)) return false;
      }
      return true;
    });
  }, [contractors, country, segFilter, sourceAudienceFilter, effectiveOwnerFilter, search, effectiveViewUser, viewingAs, activeTeam, showClosed]);

  const byStage = useMemo(() => {
    const m = Object.fromEntries(PIPELINE_STAGES.map(s => [s, []]));
    filtered.forEach(c => {
      const s = c.pipeline_stage || 'Identified';
      if (m[s]) m[s].push(c);
    });
    // Sort within each stage + cap at 300
    const sk = sortKey;
    Object.keys(m).forEach(s => {
      m[s].sort((a, b) => {
        if (sk === 'lead_score') return (b.lead_score || 0) - (a.lead_score || 0);
        if (sk === 'dat_created') return new Date(b.dat_created || 0) - new Date(a.dat_created || 0);
        if (sk === 'dat_stage_changed') return new Date(b.dat_stage_changed || 0) - new Date(a.dat_stage_changed || 0);
        return 0;
      });
      m[s] = m[s].slice(0, 300).map(c => c.contractor_id);
    });
    return m;
  }, [filtered, sortKey]);

  // Count records for active team
  const pipelineCount = Object.values(contractors).filter(teams => teams[activeTeam]).length;

  if (loading) return (
    <div className="flex items-center justify-center min-h-64 gap-3 text-slate-400">
      <Spinner /><span>Loading pipeline…</span>
    </div>
  );
  if (schemaOk === false && !demoMode) return <SchemaScreen reload={reload} />;

  return (
    <div className="p-6">
      {demoMode && (
        <div className="mb-4 px-4 py-2 rounded-lg border border-amber-800/40 bg-amber-900/15 text-xs text-amber-300">
          Demo mode — changes stored in browser only. Configure Supabase in <code>vendor/crm-config.js</code> for team persistence.
        </div>
      )}

      {/* Tab bar */}
      <div className="tab-ul" style={{marginBottom:20,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{display:'flex'}}>
          {[
            { key:'kanban', label:'Pipeline' },
            { key:'opportunities', label:'Opportunities' },
            { key:'issues', label: duplicateIssues.length > 0 ? `Issues · ${duplicateIssues.length}` : 'Issues' },
          ].map(t => (
            <button key={t.key}
              className={`tab-btn ${pipelineTab === t.key ? 'active' : ''}`}
              onClick={() => setPipelineTab(t.key)}
              style={t.key === 'issues' && duplicateIssues.length > 0 ? {color: pipelineTab === 'issues' ? '#FCD34D' : 'rgba(234,179,8,0.6)'} : {}}>
              {t.label}
            </button>
          ))}
        </div>
      </div>

      {pipelineTab === 'issues' && <IssuesView issues={duplicateIssues} />}

      {pipelineTab === 'opportunities' && <OpportunitiesKanbanView />}

      {pipelineTab === 'kanban' && <>
        {/* Team selector */}
        <div className="flex gap-2 mb-4">
          {Object.entries(TEAMS).map(([key, cfg]) => {
            const count = Object.values(contractors).filter(teams => teams[key]).length;
            return (
              <button key={key}
                onClick={() => setActiveTeam(key)}
                style={activeTeam === key
                  ? { background: cfg.color || '#602DF5', color:'#fff', borderRadius:8, padding:'6px 14px', fontSize:12, fontWeight:600, cursor:'pointer', fontFamily:'Poppins,sans-serif', border:'none' }
                  : { background:'#F5F4FA', color:'#9590C0', border:'0.5px solid #D4D0EE', borderRadius:8, padding:'6px 14px', fontSize:12, fontWeight:600, cursor:'pointer', fontFamily:'Poppins,sans-serif' }}>
                {cfg.label} <span className="ml-1 opacity-60">({count})</span>
              </button>
            );
          })}
        </div>

        {pipelineCount === 0 && (
          <div className="mb-6 p-6 rounded-lg text-center" style={{border:'0.5px solid #E2DFEF',background:'#FAFAFA'}}>
            <div className="text-2xl mb-2">🎯</div>
            <h3 className="text-lg font-semibold mb-1" style={{color:'#1A1630'}}>Pipeline is empty</h3>
            <p className="text-sm mb-4 max-w-md mx-auto" style={{color:'#9590C0'}}>
              Find contractors in the <Link to="/leads" style={{color:'#602DF5'}} className="hover:underline">Leads Database</Link> or use the
              <strong style={{color:'#1A1630'}}> + Pipeline</strong> buttons, or explore upsell opportunities in the <Link to="/dashboard" style={{color:'#602DF5'}} className="hover:underline">Dashboard</Link>.
            </p>
          </div>
        )}

        {/* Pipeline controls */}
        {pipelineCount > 0 && (
          <div className="mb-4 space-y-3">
            <div className="flex gap-3 items-center flex-wrap">
              <input className="filter-input text-sm flex-1" style={{maxWidth:'280px'}}
                placeholder="Search pipeline: name, ID, country, owner…"
                value={search} onChange={e => setSearch(e.target.value)} />
              <select className="filter-input text-xs py-1.5" value={effectiveOwnerFilter} onChange={e => setOwnerFilter(e.target.value)}>
                <option value="all">All Owners</option>
                <option value="me">{viewingAs ? `${viewingAs.name}'s pipeline` : 'Assigned to Me'}</option>
                <option value="unassigned">Unassigned</option>
                {users.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
              </select>
              <select className="filter-input text-xs py-1.5" value={sourceAudienceFilter||''} onChange={e => setSourceAudienceFilter(e.target.value)}>
                <option value="">All audiences</option>
                {audiences.filter(a => a.name).map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
              </select>
              <select className="filter-input text-xs py-1.5" value={sortKey} onChange={e => setSortKey(e.target.value)}>
                <option value="lead_score">Sort: Lead Score</option>
                <option value="dat_created">Sort: Recently Added</option>
                <option value="dat_stage_changed">Sort: Stage Changed</option>
              </select>
              <label style={{display:'flex',alignItems:'center',gap:6,fontSize:11,color:'#9590C0',cursor:'pointer',whiteSpace:'nowrap'}}>
                <input type="checkbox" checked={showClosed} onChange={e => setShowClosed(e.target.checked)} style={{accentColor:'#602DF5'}} />
                Show closed
              </label>
              {canBulkDelete && (
                <button onClick={() => { setSelectMode(m => !m); setSelected(new Set()); setConfirmBulkDelete(false); }}
                  style={{padding:'6px 14px',borderRadius:8,fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'Poppins,sans-serif',
                    background:selectMode?'#EEEDFE':'#F5F4FA',color:selectMode?'#602DF5':'#9590C0',
                    border:selectMode?'0.5px solid #C4B8F7':'0.5px solid #D4D0EE'}}>
                  {selectMode ? '✕ Cancel' : '☑ Select'}
                </button>
              )}
            </div>

            {/* Bulk action bar */}
            {selectMode && (
              <div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 16px',borderRadius:10,background:'#F5F4FA',border:'0.5px solid #E2DFEF'}}>
                <span style={{fontSize:12,color:'#1A1630',fontWeight:600}}>{selected.size} selected</span>
                <button onClick={selectAll} style={{fontSize:11,color:'#602DF5',background:'none',border:'none',cursor:'pointer',fontFamily:'Poppins,sans-serif'}}>Select all ({Object.values(byStage).flat().length})</button>
                <button onClick={() => setSelected(new Set())} style={{fontSize:11,color:'#9590C0',background:'none',border:'none',cursor:'pointer',fontFamily:'Poppins,sans-serif'}}>Clear</button>
                <div style={{flex:1}} />
                {!confirmBulkDelete ? (
                  <button onClick={() => setConfirmBulkDelete(true)} disabled={selected.size === 0}
                    style={{padding:'6px 16px',borderRadius:8,fontSize:12,fontWeight:600,cursor:selected.size===0?'not-allowed':'pointer',fontFamily:'Poppins,sans-serif',
                      background:selected.size===0?'#F5F4FA':'#F8D7DA',color:selected.size===0?'#B8B4D4':'#721C24',
                      border:selected.size===0?'0.5px solid #E2DFEF':'0.5px solid #F5C6CB'}}>
                    🗑 Remove from pipeline
                  </button>
                ) : (
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <span style={{fontSize:12,color:'#721C24',fontWeight:600}}>Remove {selected.size} contractor{selected.size!==1?'s':''} from {TEAMS[activeTeam]?.label} pipeline?</span>
                    <button onClick={bulkDelete} disabled={bulkDeleting}
                      style={{padding:'6px 16px',borderRadius:8,fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'Poppins,sans-serif',background:'#721C24',color:'#fff',border:'none'}}>
                      {bulkDeleting ? 'Removing…' : 'Yes, remove'}
                    </button>
                    <button onClick={() => setConfirmBulkDelete(false)}
                      style={{padding:'6px 12px',borderRadius:8,fontSize:12,cursor:'pointer',fontFamily:'Poppins,sans-serif',background:'#F5F4FA',color:'#9590C0',border:'0.5px solid #D4D0EE'}}>
                      Cancel
                    </button>
                  </div>
                )}
              </div>
            )}
            <div className="flex gap-1 flex-wrap">
              {[{v:'',l:'All Segments'},{v:'RESERVE',l:'Reserve'},{v:'FUTURE_FUND',l:'Future Fund'},{v:'COLD',l:'Cold'},{v:'GLOBAL_ACCOUNT',l:'Personal Acct'}].map(o => (
                <button key={o.v} onClick={() => setSegFilter(o.v)}
                  style={segFilter === o.v
                    ? { background:'#602DF5', color:'#fff', border:'none', borderRadius:999, padding:'4px 12px', fontSize:11, fontWeight:500, cursor:'pointer', fontFamily:'Poppins,sans-serif' }
                    : { background:'#F5F4FA', color:'#9590C0', border:'0.5px solid #D4D0EE', borderRadius:999, padding:'4px 12px', fontSize:11, fontWeight:500, cursor:'pointer', fontFamily:'Poppins,sans-serif' }}>

              ))}

                <button key={k} onClick={() => { window.__crmCtx?.setTeamFilter?.(teamFilter===k?'':k); }}
                  style={{borderColor:teamFilter===k?v.color:'#D4D0EE',color:teamFilter===k?v.color:'#9590C0',background:teamFilter===k?v.bg:'#F5F4FA'}}
                  className="px-3 py-1 text-xs rounded-full font-medium transition-colors border">
                  {v.label}
                </button>
              ))}
            </div>
          </div>
        )}

        <div className="flex gap-4 overflow-x-auto pb-4">
          {PIPELINE_STAGES.map(stage => (
            <KanbanColumn key={stage} stage={stage}
              cards={byStage[stage] || []}

              activeTeam={activeTeam}
              onDrop={(cid, s) => updateStage(cid, s, activeTeam)}
              selectMode={selectMode}
              selected={selected}
              toggleSelect={toggleSelect} />
          ))}
        </div>
      </>}
    </div>
  );
}

function CloseOpportunityModal({ contractorId, team, onClose }) {
  const { closeOpportunity } = useCRM();
  const [reason, setReason] = useState('');
  const [note, setNote] = useState('');
  const [saving, setSaving] = useState(false);

  const reasons = [
    { key: 'not_interested', label: 'Not Interested', icon: '❌', desc: `Contractor declined. Re-engage in ${RE_ENGAGEMENT_DEFAULTS.re_engagement_days_not_interested} days.`, color: '#EF4444' },
    { key: 'converted', label: 'Converted', icon: '✅', desc: 'Contractor converted to the target product.', color: '#10B981' },
    { key: 'expired', label: 'Gone Cold', icon: '🥶', desc: `No meaningful progress. Re-engage in ${RE_ENGAGEMENT_DEFAULTS.re_engagement_days_expired_contacted} days.`, color: '#9CA3AF' },
    { key: 'manual', label: 'Other', icon: '📝', desc: 'Manually close. Re-engagement available immediately.', color: '#6B7280' },
  ];

  async function handleClose() {
    if (!reason) return;
    setSaving(true);
    await closeOpportunity(contractorId, team, reason, note);
    setSaving(false);
    onClose();
  }

  return (
    <Modal open={true} onClose={onClose} title="Close Opportunity" width="max-w-md">
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <div>
          <label style={{fontSize:11,color:'#9590C0',display:'block',marginBottom:8,textTransform:'uppercase',letterSpacing:'0.06em'}}>
            Why are you closing this opportunity?
          </label>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {reasons.map(r => (
              <label key={r.key} style={{
                display:'flex',alignItems:'flex-start',gap:10,
                padding:'10px 12px',borderRadius:10,cursor:'pointer',
                background: reason === r.key ? `${r.color}15` : '#F5F4FA',
                border: `2px solid ${reason === r.key ? r.color : '#E2DFEF'}`,
                transition:'all .15s',
              }}>
                <input type="radio" name="closeReason" value={r.key} checked={reason === r.key}
                  onChange={() => setReason(r.key)} style={{accentColor: r.color, marginTop:2, flexShrink:0}} />
                <div>
                  <div style={{fontSize:12,fontWeight:600,color:'#1A1630',marginBottom:2,display:'flex',alignItems:'center',gap:6}}>
                    <span>{r.icon}</span><span>{r.label}</span>
                  </div>
                  <div style={{fontSize:11,color:'#9590C0',lineHeight:1.4}}>{r.desc}</div>
                </div>
              </label>
            ))}
          </div>
        </div>
        <div>
          <label style={{fontSize:11,color:'#9590C0',display:'block',marginBottom:4}}>Note (optional)</label>
          <textarea rows={2} className="filter-input w-full text-sm resize-none"
            placeholder="Add context for the team…" value={note} onChange={e => setNote(e.target.value)} />
        </div>
        {reason && (
          <div style={{padding:'10px 12px',borderRadius:8,background:'#EEEDFE',border:'1px solid #C4B8F7',fontSize:11,color:'#602DF5',lineHeight:1.6}}>
            {(() => {
              const reDate = computeReEngagementDate(reason, true);
              if (!reDate) return '🔒 No re-engagement — this contractor will not be eligible for this product again.';
              return `🔄 Re-engagement eligible: ${fmt.date(reDate)} (${fmt.timeAgo(reDate)})`;
            })()}
          </div>
        )}
        <button onClick={handleClose} disabled={!reason || saving} style={{
          width:'100%',padding:'10px 0',borderRadius:999,
          background: reason ? 'linear-gradient(135deg,#602DF5,#7A50F7)' : '#F3F4F6',
          color: reason ? '#FFFFFF' : '#9CA3AF',
          border:'none',cursor: reason ? 'pointer' : 'not-allowed',
          fontSize:13,fontWeight:600,fontFamily:'Poppins,sans-serif',
          opacity: saving ? 0.5 : 1,
        }}>
          {saving ? 'Closing…' : 'Close Opportunity'}
        </button>
      </div>
    </Modal>
  );
}

  useEffect(()=>{ ensureContractor(id, profileTeam); }, [id, profileTeam]);

  // contact[]: [full_name, email, phone, dial, nationality, type, kyc]
  const cName = contact?.[0] || null;

  const cPhone = contact?.[2] || null;
  const cDial  = contact?.[3] || null;
  const cNationality = contact?.[4] || null;
  const cType  = contact?.[5] || null;
  const cKyc   = contact?.[6] || null;

  async function handleStageClick(newStage) {
    setStageSaving(newStage);
    await updateStage(id, newStage, profileTeam);
    setStageSaving(null);
  }

  const TYPE_ICONS = {note:'📝',email:'✉️',call:'📞',in_app:'📱',task:'✅'};
  const OUTCOME_COLORS = {no_response:'text-slate-500',interested:'text-teal-400',not_interested:'text-red-400',converted:'text-green-400'};

  async function saveNote() {
    if (!noteText.trim()) return;
    setSubmitting(true);
    await addInteraction(id, 'note', noteText.trim(), null, noteMentions);
    setNoteText('');
    setNoteMentions([]);
    setMentionQuery(null);
    setSubmitting(false);
    toast('Note saved','success');
  }

  function handleNoteChange(e) {
    const val = e.target.value;
    setNoteText(val);
    const cursor = e.target.selectionStart;
    const textUpToCursor = val.slice(0, cursor);
    const atMatch = textUpToCursor.match(/@(\w*)$/);
    if (atMatch) {
      setMentionQuery(atMatch[1].toLowerCase());
    } else {
      setMentionQuery(null);
    }
  }

  function insertMention(user) {
    const cursor = noteRef.current?.selectionStart || noteText.length;
    const textUpToCursor = noteText.slice(0, cursor);
    const atMatch = textUpToCursor.match(/@(\w*)$/);
    if (!atMatch) return;
    const before = noteText.slice(0, cursor - atMatch[0].length);
    const after = noteText.slice(cursor);
    const firstName = user.name?.split(' ')[0] || user.email.split('@')[0];
    setNoteText(before + '@' + firstName + ' ' + after);
    setNoteMentions(prev => prev.includes(user.id) ? prev : [...prev, user.id]);
    setMentionQuery(null);
    setTimeout(() => noteRef.current?.focus(), 0);
  }
