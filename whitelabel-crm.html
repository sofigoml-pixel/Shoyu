          )}

          {crmRec && (
            <div style={{marginTop:12,paddingTop:12,borderTop:'1px solid rgba(122,80,247,0.1)',textAlign:'center'}}>
              <button
                onClick={() => setConfirmDelete(true)}
                style={{fontSize:11,color:'#B8B4D4',background:'none',border:'none',cursor:'pointer',fontFamily:'Poppins,sans-serif',textDecoration:'underline'}}
                onMouseEnter={e => e.currentTarget.style.color='#EF4444'}
                onMouseLeave={e => e.currentTarget.style.color='#B8B4D4'}>
                Remove from pipeline
              </button>
            </div>
          )}

          {/* Duplicate issue warnings */}
          {duplicateIssues.filter(d => d.contractor_id === id).map((issue, i) => (
            <div key={i} style={{
              marginTop:8,padding:'8px 12px',borderRadius:8,
              background: issue.severity === 'warning' ? 'rgba(234,179,8,0.06)' : 'rgba(96,45,245,0.06)',
              border: `1px solid ${issue.severity === 'warning' ? 'rgba(234,179,8,0.3)' : 'rgba(96,45,245,0.2)'}`,
              fontSize:11,
              color: issue.severity === 'warning' ? '#FCD34D' : 'rgba(255,255,255,0.5)',
              display:'flex',alignItems:'flex-start',gap:6,
            }}>
              <span style={{flexShrink:0}}>{issue.severity === 'warning' ? '⚠️' : 'ℹ️'}</span>
              <span>{issue.message}</span>
            </div>
          ))}
        </div>

        {/* Financial snapshot */}
        <div>
          <div className="text-xs mb-3 flex items-center justify-between" style={{color:'#9590C0'}}>
            <span>Financial Snapshot</span>
            <span style={{color:'#B8B4D4'}}>as of Jun 1, 2026</span>
          </div>
          {CONTRACTOR_MAP.has(id) ? (
            <div className="space-y-2">
              {[
                {label:'Monthly Comp', value:fmt.currency(fin.comp)},
                {label:'Wallet Balance', value:fmt.currency(fin.wallet)},
                {label:'Card Balance', value:fmt.currency(fin.card_balance)},
                {label:'Lifetime Card Spend', value:fmt.currency(fin.card_spend)},
                {label:'Card Transactions', value:fmt.number(fin.txn_count)},
                {label:'Future Fund Balance', value:fmt.currency(fin.ff_net)},
                {label:'Active Contract', value: fin.has_active_contract == null ? '—' : fin.has_active_contract ? 'Yes' : 'No', _isContract: true},
                {label:'Reserve Subscriber', value:fin.is_reserve?'Yes — Active':'No'},
                {label:'Contract Type', value:fin.contract_type||'—'},
                {label:'Days Since 1st Invoice', value:fin.days_since > 0 ? fmt.number(fin.days_since) : (fin.days_since_ended > 0 ? fmt.number(fin.days_since_ended) : '—')},
              ].map(row=>(
                <div key={row.label} className="flex justify-between text-xs">
                  <span style={{color:'#9590C0'}}>{row.label}</span>
                  <span style={{fontWeight:500,color:row._isContract?(row.value==='Yes'?'#155724':row.value==='No'?'#9590C0':'#1A1630'):row.value==='Yes — Active'?'#155724':row.value==='No'&&row.label==='Reserve Subscriber'?'#9590C0':'#1A1630'}}>
                    {row.value}
                  </span>
                </div>
              ))}
            </div>
          ) : (
            <p className="text-xs italic" style={{color:'#B8B4D4'}}>Contractor not in embedded snapshot. Onsight live query required.</p>
          )}
          {(() => {
            const lastContacted = getLastContacted(id, myInteractions);
            return (
              <div className="flex justify-between text-xs" style={{marginTop:8,paddingTop:8,borderTop:'0.5px solid #E2DFEF'}}>
                <span style={{color:'#9590C0'}}>Last Contacted</span>
                <span style={{fontWeight:500,color:lastContacted?'#1A1630':'#B8B4D4'}}>
                  {lastContacted ? fmt.timeAgo(lastContacted) : 'Never'}
                </span>
              </div>
            );
          })()}
        </div>

        {/* Multi-team pipeline status */}
        {teamKeys.length > 1 && (
          <div style={{marginTop:16,paddingTop:16,borderTop:'1px solid rgba(122,80,247,0.15)'}}>
            <div style={{fontSize:11,fontWeight:600,color:'#9590C0',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:10}}>
              Pipeline Records
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              {teamKeys.map(t => {
                const rec = allTeamRecs[t];
                const isActive = t === profileTeam;
                return (
                  <button key={t} onClick={() => setProfileTeam(t)}
                    style={{
                      display:'flex',alignItems:'center',justifyContent:'space-between',
                      padding:'8px 12px',borderRadius:8,border:`1px solid ${isActive ? 'rgba(96,45,245,0.5)' : 'rgba(122,80,247,0.15)'}`,
                      background: isActive ? 'rgba(96,45,245,0.1)' : 'transparent',
                      cursor:'pointer',fontFamily:'Poppins,sans-serif',
                    }}>
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      <TeamBadge team={t} />
                      <StageBadge stage={rec?.pipeline_stage || 'Identified'} />
                    </div>
                    {isActive && <span style={{fontSize:10,color:'#602DF5',fontWeight:600}}>Viewing</span>}
                  </button>
                );
              })}
            </div>
          </div>
        )}

        {/* Opportunities sidebar section */}
        <div style={{ marginBottom:16 }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8 }}>
            <div className="text-xs font-semibold" style={{ color:'#9590C0' }}>Opportunities {myOpenOpps.length > 0 ? `(${myOpenOpps.length})` : ''}</div>
            <button onClick={() => setShowOpenOppModal(true)}
              style={{ fontSize:10, padding:'3px 8px', borderRadius:6, background:'#602DF5', color:'#fff', border:'none', cursor:'pointer', fontFamily:'Poppins,sans-serif', fontWeight:600 }}>
              + Open
            </button>
          </div>
          {myOpenOpps.length === 0 && (
            <div className="text-xs" style={{ color:'#B8B4D4' }}>No open opportunities</div>
          )}
          {myOpenOpps.slice(0,3).map(o => {
            const cat = PRODUCT_CATALOG[o.product] || {};
            return (
              <div key={o.id} className="text-xs p-2 rounded mb-1" style={{ border:'0.5px solid #E2DFEF', color:'#9590C0', display:'flex', alignItems:'center', gap:6 }}>
                <span>{cat.icon || '🎯'}</span>
                <span style={{ flex:1, fontWeight:600, color:'#1A1630' }}>{o.product}</span>
                <span style={{ fontSize:10, padding:'1px 5px', borderRadius:4, background: STAGE_COLORS[o.pipeline_stage]||'#F0EEF8', color: STAGE_TEXT[o.pipeline_stage]||'#7C73BA' }}>{o.pipeline_stage}</span>
              </div>
            );
          })}
          {myOpenOpps.length > 3 && (
            <button onClick={() => setActiveTab('opportunities')} style={{ fontSize:10, color:'#602DF5', background:'none', border:'none', cursor:'pointer', padding:0 }}>
              +{myOpenOpps.length - 3} more
            </button>
          )}
        </div>

        <TeamOwnershipStrip contractorId={id} />

        {/* Open tasks quick view */}
        {myOpenTasks.length>0 && (
          <div>
            <div className="text-xs mb-2" style={{color:'#9590C0'}}>{myOpenTasks.length} open task{myOpenTasks.length>1?'s':''}</div>
            {myOpenTasks.slice(0,3).map(t=>(
              <div key={t.id} className={`text-xs p-2 rounded mb-1 ${isOverdue(t)?'border-red-900/50 bg-red-900/15 text-red-300':''}`} style={isOverdue(t)?{}:{border:'0.5px solid #E2DFEF',color:'#9590C0'}}>
                {t.type} {t.due_date&&`· due ${fmt.short(t.due_date)}`}
                {t.note&&<div style={{color:'#B8B4D4'}} className="truncate">{t.note}</div>}
              </div>
            ))}
          </div>
        )}
      </aside>

      {/* Main content */}
      <main className="flex-1 overflow-y-auto p-6">
        {/* Quick action bar */}
        <div className="flex gap-2 mb-5 flex-wrap">
          <div className="flex-1 flex gap-2">
            <div style={{position:'relative',flex:1}}>
              <textarea ref={noteRef} rows={1} className="filter-input w-full text-sm resize-none" placeholder="+ Quick note… (type @ to mention someone)"
                value={noteText} onChange={handleNoteChange}
                onKeyDown={e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();saveNote();} if(e.key==='Escape')setMentionQuery(null); }}
              />
              {mentionQuery !== null && (() => {
                const matches = users.filter(u => u.is_active !== false && (
                  u.name?.toLowerCase().includes(mentionQuery) ||
                  u.email?.toLowerCase().includes(mentionQuery)
                )).slice(0, 6);
                if (!matches.length) return null;
                return (
                  <div style={{position:'absolute',top:'calc(100% + 4px)',left:0,background:'#FFFFFF',border:'0.5px solid #E2DFEF',borderRadius:8,boxShadow:'0 4px 16px rgba(0,0,0,0.12)',zIndex:100,minWidth:200,overflow:'hidden'}}>
                    {matches.map(u => (
                      <button key={u.id} onMouseDown={e=>{e.preventDefault();insertMention(u);}}
                        style={{width:'100%',padding:'8px 12px',textAlign:'left',background:'none',border:'none',cursor:'pointer',display:'flex',alignItems:'center',gap:8,fontFamily:'Poppins,sans-serif'}}
                        onMouseEnter={e=>e.currentTarget.style.background='#F5F4FA'}
                        onMouseLeave={e=>e.currentTarget.style.background='none'}>
                        <div style={{width:24,height:24,borderRadius:'50%',background:'#EEEDFE',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,color:'#602DF5',flexShrink:0}}>
                          {(u.name||u.email)[0].toUpperCase()}
                        </div>
                        <div>
                          <div style={{fontSize:12,fontWeight:600,color:'#1A1630'}}>{u.name||u.email}</div>
                          {u.name && <div style={{fontSize:10,color:'#9590C0'}}>{u.email}</div>}
                        </div>
                      </button>
                    ))}
                  </div>
                );
              })()}
            </div>
            <button onClick={saveNote} disabled={!noteText.trim()||submitting}
              className="px-4 py-2 rounded-lg text-sm disabled:opacity-40 shrink-0" style={{background:'#602DF5',color:'#fff',border:'none'}}>
              Save
            </button>
          </div>
          <button onClick={()=>setShowEmailModal(true)} className="px-3 py-2 rounded-lg text-sm" style={{border:'0.5px solid #D4D0EE',color:'#5856B7',background:'#fff'}}>✉️ Email</button>
          <button onClick={()=>setShowCallModal(true)} className="px-3 py-2 rounded-lg text-sm" style={{border:'0.5px solid #D4D0EE',color:'#5856B7',background:'#fff'}}>📞 Call</button>
          <button onClick={()=>{ setTaskAssignee(currentUser?.id||''); setShowTaskModal(true); }} className="px-3 py-2 rounded-lg text-sm" style={{border:'0.5px solid #D4D0EE',color:'#5856B7',background:'#fff'}}>✅ Task</button>
        </div>

        {/* Tabs */}
        <div className="tab-ul flex gap-1 mb-5">
          {['timeline','tasks','opportunities','activity','communications'].map(t=>(
            <button key={t} onClick={()=>setActiveTab(t)} className={`tab-btn capitalize ${activeTab===t?'active':''}`}>
              {t === 'opportunities' && myOpenOpps.length > 0 ? `Opportunities · ${myOpenOpps.length}` : t}
            </button>
          ))}
        </div>

        {/* Timeline */}
        {activeTab==='timeline' && (
          <div className="space-y-3">
            <AudienceBroadcastsPanel contractorId={id} />
            {myInteractions.length===0 && (
              <div className="text-center py-12 text-sm" style={{color:'#B8B4D4'}}>No interactions yet. Add a note, log a call, or draft an email above.</div>
            )}
            {myInteractions.map(i=>{
              const iuser = users.find(u=>u.id===i.created_by);
              const canDelete = !i.created_by || i.created_by === currentUser?.id || currentUser?.role === 'admin';
              return (
                <div key={i.id} className="card p-4">
                  <div className="flex items-start gap-3">
                    <span className="text-xl shrink-0 mt-0.5">{TYPE_ICONS[i.type]||'📌'}</span>
                    <div className="flex-1">
                      <div className="flex items-center gap-2 mb-1 flex-wrap">
                        <span className="text-xs font-semibold capitalize" style={{color:'#1A1630'}}>{i.type}</span>
                        {(i.type === 'email' || i.type === 'call') && (
                          <select
                            value={i.outcome || ''}
                            onChange={e => updateInteraction(i.id, { outcome: e.target.value || null })}
                            style={{fontSize:11,padding:'1px 6px',borderRadius:6,border:'0.5px solid #E2DFEF',background:'#F5F4FA',color:i.outcome?({no_response:'#9590C0',interested:'#0D9488',not_interested:'#DC2626',converted:'#15803D'}[i.outcome]||'#9590C0'):'#B8B4D4',fontFamily:'Poppins,sans-serif',cursor:'pointer'}}>
                            <option value="">outcome…</option>
                            <option value="no_response">no response</option>
                            <option value="interested">interested</option>
                            <option value="not_interested">not interested</option>
                            <option value="converted">converted</option>
                          </select>
                        )}
                        {i.type !== 'email' && i.type !== 'call' && i.outcome && (
                          <span className={`text-xs font-medium capitalize ${OUTCOME_COLORS[i.outcome]||'text-slate-400'}`}>{i.outcome.replace('_',' ')}</span>
                        )}
                        <span className="text-xs ml-auto" style={{color:'#B8B4D4'}}>{fmt.timeAgo(i.created_at)}</span>
                        {canDelete && (
                          <button onClick={() => { if(window.confirm('Delete this entry?')) deleteInteraction(i.id); }}
                            className="text-xs leading-none transition-colors" style={{color:'#B8B4D4'}}
                            onMouseEnter={e=>e.currentTarget.style.color='#721C24'} onMouseLeave={e=>e.currentTarget.style.color='#B8B4D4'}
                            title="Delete">✕</button>
                        )}
                      </div>
                      <p className="text-sm whitespace-pre-wrap leading-relaxed" style={{color:'#1A1630'}}>
                        {i.content.split(/(@\w+)/g).map((part,pi) =>
                          /^@\w+/.test(part)
                            ? <strong key={pi} style={{color:'#602DF5',fontWeight:600}}>{part}</strong>
                            : part
                        )}
                      </p>
                      {iuser && <p className="text-xs mt-2" style={{color:'#9590C0'}}>{iuser.name}</p>}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* Tasks */}
        {activeTab==='tasks' && (
          <div>
            <div className="space-y-2 mb-6">
              <div className="text-xs mb-2" style={{color:'#9590C0'}}>Open tasks ({myOpenTasks.length})</div>
              {myOpenTasks.length===0 && <p className="text-sm py-4" style={{color:'#B8B4D4'}}>No open tasks.</p>}
              {myOpenTasks.map(t=>(<TaskRow key={t.id} task={t} users={users} />))}
            </div>
            {myDoneTasks.length>0 && (
              <div>
                <div className="text-xs mb-2" style={{color:'#B8B4D4'}}>Completed ({myDoneTasks.length})</div>
                {myDoneTasks.map(t=>(<TaskRow key={t.id} task={t} users={users} done />))}
              </div>
            )}
          </div>
        )}

        {/* Activity */}
        {activeTab==='activity' && (
          <div className="space-y-5">
            {/* Conversions section */}
            {(() => {
              const myConversions = allConversions.filter(c => c.contractor_id === id);
              if (myConversions.length === 0) return null;
              return (
                <div className="card p-5">
                  <div style={{fontSize:12,fontWeight:600,color:'rgba(255,255,255,0.8)',marginBottom:10}}>
                    🎯 Conversions
                  </div>
                  {myConversions.map(conv => {
                    const attributedUser = users.find(u => u.id === conv.attributed_to);
                    return (
                      <div key={conv.id} style={{
                        padding:'10px 14px',marginBottom:8,borderRadius:8,
                        background:'rgba(16,185,129,0.04)',
                        border:'1px solid rgba(16,185,129,0.2)',
                      }}>
                        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
                          <span style={{fontSize:12,fontWeight:600,color:'#34D399'}}>
                            ✓ {(conv.conversion_type||'').replace(/_/g,' ')}
                          </span>
                          <span style={{fontSize:10,color:'rgba(255,255,255,0.35)'}}>{fmt.date(conv.converted_at)}</span>
                        </div>
                        <div style={{fontSize:11,color:'rgba(255,255,255,0.5)',display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}}>
                          {attributedUser && (
                            <span>Attributed to: <strong style={{color:'rgba(255,255,255,0.8)'}}>{attributedUser.name}</strong></span>
                          )}
                          <span style={{
                            padding:'1px 6px',borderRadius:4,fontSize:10,fontWeight:600,
                            background: conv.attribution_type === 'outreach' ? 'rgba(96,45,245,0.08)' : conv.attribution_type === 'pipeline' ? 'rgba(88,86,183,0.1)' : 'rgba(88,86,183,0.06)',
                            color: conv.attribution_type === 'outreach' ? '#7A50F7' : conv.attribution_type === 'pipeline' ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.25)',
                          }}>
                            {conv.attribution_type}
                          </span>
                          {conv.days_to_convert != null && (
                            <span>{conv.days_to_convert}d to convert</span>
                          )}
                          {conv.reconciliation_status === 'pending' && (
                            <span style={{color:'#F59E0B'}}>⏳ Pending verification</span>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            })()}
            {/* Spending by category */}
            {fin.card_spend>0 ? (
              <div className="card p-5">
                <h4 className="text-sm font-semibold mb-3" style={{color:'#1A1630'}}>Card Activity</h4>
                <div className="grid grid-cols-2 gap-4 text-xs">
                  <div className="p-3 rounded-lg" style={{background:'#F5F4FA'}}>
                    <div style={{color:'#9590C0'}} className="mb-0.5">Lifetime Spend</div>
                    <div className="font-bold text-lg" style={{color:'#155724'}}>{fmt.currency(fin.card_spend)}</div>
                  </div>
                  <div className="p-3 rounded-lg" style={{background:'#F5F4FA'}}>
                    <div style={{color:'#9590C0'}} className="mb-0.5">Transactions</div>
                    <div className="font-bold text-lg" style={{color:'#1A1630'}}>{fmt.number(fin.txn_count)}</div>
                  </div>
                  <div className="p-3 rounded-lg" style={{background:'#F5F4FA'}}>
                    <div style={{color:'#9590C0'}} className="mb-0.5">Avg Ticket Size</div>
                    <div className="font-bold" style={{color:'#1A1630'}}>{fmt.currency(fin.avg_ticket)}</div>
                  </div>
                  <div className="p-3 rounded-lg" style={{background:'#F5F4FA'}}>
                    <div style={{color:'#9590C0'}} className="mb-0.5">Top Category</div>
                    <div className="font-semibold truncate" style={{color:'#1A1630'}}>{fin.top_category||'—'}</div>
                  </div>
                </div>
              </div>
            ) : (
              <div className="card p-5 text-sm text-slate-600">No card activity in snapshot.</div>
            )}
            {/* Balance snapshot */}
            <div className="card p-5">
              <h4 className="text-sm font-semibold mb-3" style={{color:'#1A1630'}}>Balance Snapshot (Jun 1, 2026)</h4>
              <div className="space-y-2">
                {[
                  {label:'Wallet',val:fin.wallet,color:'text-teal-400'},
                  {label:'Card',val:fin.card_balance,color:'text-blue-400'},
                  {label:'Future Fund',val:fin.ff_net,color:'text-violet-400'},
                ].map(row=>{
                  const total = (fin.wallet||0)+(fin.card_balance||0)+(fin.ff_net||0);
                  const pct = total>0?Math.round((row.val||0)/total*100):0;
                  return (
                    <div key={row.label}>
                      <div className="flex justify-between text-xs mb-1">
                        <span style={{color:'#9590C0'}}>{row.label}</span>
                        <span className={`font-semibold ${row.color}`}>{fmt.currency(row.val)}</span>
                      </div>
                      <div className="h-1.5 rounded-full" style={{background:'#EDE9FF'}}>
                        <div className="h-1.5 rounded-full" style={{width:`${pct}%`,background:row.color.includes('teal')?'#602DF5':row.color.includes('blue')?'#7A50F7':'#602DF5'}} />
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        )}

        {/* Communications */}
        {activeTab==='opportunities' && <OpportunitiesProfileTab contractorId={id} />}
        {activeTab==='communications' && <CommunicationsTab contractorId={id} />}
      </main>

      {/* Email modal */}
      <Modal open={showEmailModal} onClose={()=>setShowEmailModal(false)} title="Log Email">
        <div className="space-y-4">
          <div><label className="text-xs mb-1 block" style={{color:'#9590C0'}}>Subject</label>
            <input className="filter-input w-full" placeholder="Subject line" value={emailSubject} onChange={e=>setEmailSubject(e.target.value)} />
          </div>
          <div><label className="text-xs mb-1 block" style={{color:'#9590C0'}}>Body / Notes</label>
            <textarea rows={5} className="filter-input w-full resize-none text-sm" placeholder="Email content or notes about the message…" value={emailBody} onChange={e=>setEmailBody(e.target.value)} />
          </div>
          <div><label className="text-xs mb-1 block" style={{color:'#9590C0'}}>Outcome</label>
            <select className="filter-input w-full" value={emailOutcome} onChange={e=>setEmailOutcome(e.target.value)}>
              <option value="">Select outcome…</option>
              {['no_response','interested','not_interested','converted'].map(o=><option key={o} value={o}>{o.replace('_',' ')}</option>)}
            </select>
          </div>
          <button onClick={saveEmail} disabled={submitting||!emailBody.trim()} className="w-full py-2.5 font-semibold disabled:opacity-40" style={{background:'#602DF5',color:'#fff',border:'none',borderRadius:8}}>
            {submitting?'Saving…':'Log Email'}
          </button>
        </div>
      </Modal>

      {/* Call modal */}
      <Modal open={showCallModal} onClose={()=>setShowCallModal(false)} title="Log Call">
        <div className="space-y-4">
          <div><label className="text-xs mb-1 block" style={{color:'#9590C0'}}>Call notes</label>
            <textarea rows={4} className="filter-input w-full resize-none text-sm" placeholder="What was discussed?" value={callNotes} onChange={e=>setCallNotes(e.target.value)} />
          </div>
          <div><label className="text-xs mb-1 block" style={{color:'#9590C0'}}>Outcome</label>
            <select className="filter-input w-full" value={callOutcome} onChange={e=>setCallOutcome(e.target.value)}>
              <option value="">Select outcome…</option>
              {['no_response','interested','not_interested','converted'].map(o=><option key={o} value={o}>{o.replace('_',' ')}</option>)}
            </select>
          </div>
          <button onClick={saveCall} disabled={submitting} className="w-full py-2.5 font-semibold disabled:opacity-40" style={{background:'#602DF5',color:'#fff',border:'none',borderRadius:8}}>
            {submitting?'Saving…':'Log Call'}
          </button>
        </div>
      </Modal>

      {/* Task modal */}
      <Modal open={showTaskModal} onClose={()=>setShowTaskModal(false)} title="Create Task">
        <div className="space-y-4">
          <div><label className="text-xs mb-1 block" style={{color:'#9590C0'}}>Type</label>
            <select className="filter-input w-full" value={taskType} onChange={e=>setTaskType(e.target.value)}>
              {['follow_up','pitch','check_in'].map(t=><option key={t} value={t}>{t.replace('_',' ')}</option>)}
            </select>
          </div>
          <div><label className="text-xs mb-1 block" style={{color:'#9590C0'}}>Notes</label>
            <textarea rows={3} className="filter-input w-full resize-none text-sm" placeholder="Task description…" value={taskNote} onChange={e=>setTaskNote(e.target.value)} />
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div><label className="text-xs mb-1 block" style={{color:'#9590C0'}}>Due Date</label>
              <input type="date" className="filter-input w-full" value={taskDue} onChange={e=>setTaskDue(e.target.value)} />
            </div>
            <div><label className="text-xs mb-1 block" style={{color:'#9590C0'}}>Assignee</label>
              <select className="filter-input w-full" value={taskAssignee} onChange={e=>setTaskAssignee(e.target.value)}>
                <option value="">Unassigned</option>
                {users.map(u=><option key={u.id} value={u.id}>{u.name}</option>)}
              </select>
            </div>
          </div>
          <button onClick={saveTask} disabled={submitting} className="w-full py-2.5 font-semibold disabled:opacity-40" style={{background:'#602DF5',color:'#fff',border:'none',borderRadius:8}}>
            {submitting?'Saving…':'Create Task'}
          </button>
        </div>
      </Modal>

      {/* Remove from pipeline confirmation */}
      <Modal open={confirmDelete} onClose={() => setConfirmDelete(false)} title="Remove from pipeline" width="max-w-sm">
        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          <div style={{fontSize:13,color:'#9590C0',lineHeight:1.6}}>
            This will completely remove <strong style={{color:'#1A1630'}}>{id}</strong> from the pipeline
            and delete all associated interactions and tasks.
            <br/><br/>
            If they said they're not interested, use <strong style={{color:'#1A1630'}}>"Not Interested"</strong> stage instead
            to keep the history.
          </div>
          <div style={{padding:'10px 14px',borderRadius:8,background:'rgba(239,68,68,0.06)',border:'1px solid rgba(239,68,68,0.2)',fontSize:11,color:'#FCA5A5'}}>
            ⚠️ This cannot be undone. All notes, calls, and tasks for this contractor will be deleted.
          </div>
          <div style={{display:'flex',gap:8}}>
            <button onClick={() => setConfirmDelete(false)}
              style={{flex:1,padding:'8px 0',borderRadius:8,fontSize:12,background:'#F5F4FA',color:'#9590C0',border:'none',cursor:'pointer',fontFamily:'Poppins,sans-serif'}}>
              Cancel
            </button>
            <button
              onClick={async () => {
                setConfirmDelete(false);
                const ok = await deletePipelineRecord(id, profileTeam);
                if (ok) nav('/pipeline');
              }}
              style={{flex:1,padding:'8px 0',borderRadius:8,fontSize:12,background:'#EF4444',color:'#FFFFFF',border:'none',cursor:'pointer',fontFamily:'Poppins,sans-serif',fontWeight:600}}>
              Remove
            </button>
          </div>
        </div>
      </Modal>
      {closingTeam && (
        <CloseOpportunityModal contractorId={id} team={closingTeam} onClose={() => setClosingTeam(null)} />
      )}
      {showOpenOppModal && (
        <OpenOpportunityModal contractorId={id} onClose={() => setShowOpenOppModal(false)} />
      )}
    </div>
  );
}

// ─── TASK ROW (reused in profile + tasks view) ───────────────────────────────
function TaskRow({ task, users, done=false }) {
  const { toggleTask } = useCRM();
  const assignee = users.find(u=>u.id===task.assigned_to);
  const overdue = isOverdue(task);
  return (
    <div className={`flex items-start gap-3 p-3 rounded-lg mb-2 ${overdue?'border-red-900/50 bg-red-900/10':done?'opacity-60':''}`} style={overdue?{}:{border:'0.5px solid #E2DFEF',background:'#FAFAFA'}}>
      <input type="checkbox" checked={task.is_completed} onChange={()=>toggleTask(task.id)}
        className="mt-0.5 accent-teal-500 cursor-pointer shrink-0" />
      <div className="flex-1">
        <div className="flex items-center gap-2 flex-wrap">
          <span className="text-xs font-semibold capitalize" style={{color:'#1A1630'}}>{task.type?.replace('_',' ')}</span>
          {task.due_date && (
            <span className={`text-xs ${overdue?'text-red-400 font-semibold':''}`} style={overdue?{}:{color:'#9590C0'}}>
              {overdue?'⚠️ Overdue · ':'Due '}
              {fmt.date(task.due_date)}
            </span>
          )}
          {assignee && <span className="text-xs" style={{color:'#B8B4D4'}}>{assignee.name}</span>}
        </div>
        {task.note && <p className="text-xs mt-0.5" style={{color:'#9590C0'}}>{task.note}</p>}
      </div>
    </div>
  );
}

// ─── USER ACTIONS MENU ──────────────────────────────────────────────────────
function UserActionsMenu({ user }) {
  const { promoteUser, deactivateUser, setUsers } = useCRM();
  const toast = useToast();
  const [open, setOpen] = useState(false);
  const [confirmDeactivate, setConfirmDeactivate] = useState(false);
  const [confirmName, setConfirmName] = useState('');
  const [savingTeam, setSavingTeam] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    const fn = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', fn);
    return () => document.removeEventListener('mousedown', fn);
  }, []);

  async function handleTeamChange(newTeam) {
    if (!SB) return;
    setSavingTeam(true);
    try {
      await SB.from('crm_users').update({ team: newTeam || null }).eq('id', user.id);
      setUsers(prev => prev.map(u => u.id === user.id ? { ...u, team: newTeam || null } : u));
      toast(`${user.name.split(' ')[0]}'s team updated`, 'success');
    } catch(e) {
      toast('Failed to update team', 'error');
    }
    setSavingTeam(false);
  }

  const canDeactivate = confirmName.trim().toLowerCase() === user.name.trim().toLowerCase();

  return (
    <div ref={ref} style={{position:'absolute',top:12,right:12}}>
      <button onClick={e => { e.stopPropagation(); setOpen(o => !o); }}
        style={{width:28,height:28,borderRadius:6,background:open?'#EEEDFE':'transparent',border:open?'1px solid #C4B8F7':'1px solid transparent',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'#9590C0',fontSize:16,lineHeight:1,transition:'all .15s'}}
        onMouseEnter={e=>e.currentTarget.style.background='#EEEDFE'}
        onMouseLeave={e=>{if(!open)e.currentTarget.style.background='transparent';}}>
        ···
      </button>

      {open && !confirmDeactivate && (
        <div style={{position:'absolute',top:32,right:0,width:220,background:'#FFFFFF',border:'1px solid #E2DFEF',borderRadius:10,boxShadow:'0 8px 24px rgba(0,0,0,0.12)',zIndex:100,overflow:'hidden'}}>
          <div style={{padding:'10px 12px',borderBottom:'1px solid #E2DFEF'}}>
            <div style={{fontSize:10,color:'#B8B4D4',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:6}}>Team</div>
            <select className="filter-input text-xs w-full py-1" value={user.team||''} disabled={savingTeam}
              onChange={e => handleTeamChange(e.target.value)}>
              <option value="">No team</option>
              {Object.entries(TEAMS).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
            </select>
            {savingTeam && <div style={{fontSize:10,color:'#B8B4D4',marginTop:4}}>Saving…</div>}
          </div>

          {user.role !== 'admin' && (
            <button onClick={async()=>{setOpen(false);await promoteUser(user.id);}}
              style={{width:'100%',padding:'9px 12px',textAlign:'left',fontSize:12,color:'#1A1630',background:'none',border:'none',cursor:'pointer',display:'flex',alignItems:'center',gap:8,borderBottom:'1px solid #F0EEF8'}}
              onMouseEnter={e=>e.currentTarget.style.background='#F0EEF8'}
              onMouseLeave={e=>e.currentTarget.style.background='none'}>
              ⭐ Make admin
            </button>
          )}

          <button onClick={()=>setConfirmDeactivate(true)}
            style={{width:'100%',padding:'9px 12px',textAlign:'left',fontSize:12,color:'#DC2626',background:'none',border:'none',cursor:'pointer',display:'flex',alignItems:'center',gap:8}}
            onMouseEnter={e=>{e.currentTarget.style.background='#FEF2F2';}}
            onMouseLeave={e=>{e.currentTarget.style.background='none';}}>
            🚫 Deactivate account
          </button>
        </div>
      )}

      {open && confirmDeactivate && (
        <div style={{position:'absolute',top:32,right:0,width:260,background:'#FFFFFF',border:'1px solid #E2DFEF',borderRadius:10,boxShadow:'0 8px 24px rgba(0,0,0,0.12)',zIndex:100,padding:14}}>
          <div style={{fontSize:13,fontWeight:600,color:'#1A1630',marginBottom:6}}>Deactivate {user.name.split(' ')[0]}?</div>
          <div style={{fontSize:11,color:'#9590C0',marginBottom:12,lineHeight:1.5}}>
            They will lose access and all assigned contractors will be unassigned. Type their name to confirm.
          </div>
          <input className="filter-input w-full text-sm mb-3" placeholder={user.name}
            value={confirmName} onChange={e=>setConfirmName(e.target.value)} autoFocus />
          <div style={{display:'flex',gap:8}}>
            <button onClick={()=>{setConfirmDeactivate(false);setConfirmName('');setOpen(false);}}
              style={{flex:1,padding:'7px 0',borderRadius:8,fontSize:12,background:'#F0EEF8',color:'#9590C0',border:'none',cursor:'pointer'}}>
              Cancel
            </button>
            <button onClick={async()=>{setOpen(false);setConfirmDeactivate(false);setConfirmName('');await deactivateUser(user.id);}}
              disabled={!canDeactivate}
              style={{flex:1,padding:'7px 0',borderRadius:8,fontSize:12,background:canDeactivate?'#EF4444':'#F0EEF8',color:canDeactivate?'#FFFFFF':'#B8B4D4',border:'none',cursor:canDeactivate?'pointer':'not-allowed',transition:'all .15s'}}>
              Deactivate
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── TEAM MEMBER PROFILE ────────────────────────────────────────────────────
function TeamMemberProfile({ userId }) {
  const { users, contractors, interactions, tasks, currentUser, loading, setUsers } = useCRM();
  const nav = useNavigate();
  const toast = useToast();
  const [savingTeam, setSavingTeam] = React.useState(false);

  async function handleTeamChange(newTeam) {
    if (!SB) return;
    setSavingTeam(true);
    try {
      await SB.from('crm_users').update({ team: newTeam || null }).eq('id', userId);
      setUsers(prev => prev.map(u => u.id === userId ? { ...u, team: newTeam || null } : u));
      toast(`Team updated`, 'success');
    } catch(e) {
      toast('Failed to update team', 'error');
    }
    setSavingTeam(false);
  }

  const user = users.find(u => u.id === userId);
  const isAdmin = currentUser?.role === 'admin';
  const isSelf = currentUser?.id === userId;
  const canSeeMetrics = isAdmin || isSelf;

  const myContractors = useMemo(() => {
    const recs = [];
    Object.entries(contractors).forEach(([cid, teams]) => {
      Object.values(teams).forEach(rec => {
        if (rec.assigned_to === userId) recs.push(rec);
      });
    });
    return recs;
  }, [contractors, userId]);
  const myInteractions = useMemo(() => interactions.filter(i => i.created_by === userId), [interactions, userId]);
  const myTasks = useMemo(() => tasks.filter(t => t.assigned_to === userId), [tasks, userId]);
  const myOpenTasks = myTasks.filter(t => !t.is_completed);
  const myOverdueTasks = myTasks.filter(t => isOverdue(t));

  const byStage = useMemo(() => {
    const counts = Object.fromEntries(PIPELINE_STAGES.map(s => [s, 0]));
    myContractors.forEach(c => { const s = c.pipeline_stage || 'Identified'; if (counts[s] !== undefined) counts[s]++; });
    return counts;
  }, [myContractors]);

  const now = new Date();
  const thisMonth = now.toISOString().slice(0, 7);
  const lastWeekStart = new Date(now - 7 * 86400000).toISOString();
  const twoWeeksAgo = new Date(now - 14 * 86400000).toISOString();

  const totalConverted = myContractors.filter(c => c.pipeline_stage === 'Converted').length;
  const convertedThisMonth = myContractors.filter(c => c.pipeline_stage === 'Converted' && c.dat_stage_changed?.startsWith(thisMonth)).length;
  const convertedThisWeek = myContractors.filter(c => c.pipeline_stage === 'Converted' && c.dat_stage_changed >= lastWeekStart).length;
  const interactionsThisWeek = myInteractions.filter(i => i.created_at >= lastWeekStart).length;
  const interactionsLastWeek = myInteractions.filter(i => i.created_at >= twoWeeksAgo && i.created_at < lastWeekStart).length;
  const activityTrend = interactionsThisWeek - interactionsLastWeek;

  const convertedWithDates = myContractors.filter(c => c.pipeline_stage === 'Converted' && c.dat_created && c.dat_stage_changed);
  const avgDaysToConvert = convertedWithDates.length > 0
    ? Math.round(convertedWithDates.reduce((sum, c) => sum + (new Date(c.dat_stage_changed) - new Date(c.dat_created)) / 86400000, 0) / convertedWithDates.length)
    : null;

  const uncontacted = myContractors.filter(c => {
    const hasInteraction = interactions.some(i => i.contractor_id === c.contractor_id);
    return !hasInteraction && c.pipeline_stage === 'Identified';
  });

  const funnel = PIPELINE_STAGES.slice(0, 4).map((stage) => ({
    stage, count: byStage[stage] || 0,
    rate: myContractors.length > 0 ? Math.round((byStage[stage] || 0) / myContractors.length * 100) : 0,
  }));

  if (loading) return <div style={{padding:48,textAlign:'center',color:'#9590C0'}}>Loading…</div>;

  if (!user) return (
    <div style={{padding:48,textAlign:'center',color:'#9590C0'}}>
      Team member not found.{' '}
      <button onClick={() => nav('/team')} style={{color:'#7A50F7',background:'none',border:'none',cursor:'pointer',fontFamily:'Poppins,sans-serif'}}>Back to Team</button>
    </div>
  );

  const initials = user.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();

  return (
    <div style={{maxWidth:1100,margin:'0 auto',padding:24}}>

      {/* Breadcrumb */}
      <div style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:'#9590C0',marginBottom:20}}>
        <button onClick={() => nav('/team')} style={{color:'#7A50F7',background:'none',border:'none',cursor:'pointer',fontFamily:'Poppins,sans-serif',fontSize:12,padding:0}}>Team</button>
        <span>›</span>
        <span style={{color:'#1A1630',fontWeight:500}}>{user.name}</span>
      </div>

      {/* Identity panel */}
      <div className="card p-6" style={{marginBottom:20}}>
        <div style={{display:'flex',alignItems:'flex-start',gap:20,flexWrap:'wrap'}}>
          {user.avatar_url
            ? <img src={user.avatar_url} alt={user.name} style={{width:72,height:72,borderRadius:'50%',objectFit:'cover',flexShrink:0}} />
            : <div style={{width:72,height:72,borderRadius:'50%',background:'linear-gradient(135deg,#602DF5,#7A50F7)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:24,fontWeight:700,color:'#FFFFFF',flexShrink:0}}>{initials}</div>
          }
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6,flexWrap:'wrap'}}>
              <h1 style={{fontSize:20,fontWeight:700,color:'#1A1630',margin:0}}>{user.name}</h1>
              {isSelf && <span style={{fontSize:10,padding:'2px 8px',borderRadius:999,background:'#EEEDFE',color:'#602DF5',border:'0.5px solid #C4B8F7',fontWeight:600}}>You</span>}
              <span style={{fontSize:10,padding:'2px 8px',borderRadius:999,background:user.role==='admin'?'#EEEDFE':'#F5F4FA',color:user.role==='admin'?'#3C3489':'#9590C0',border:'0.5px solid #D4D0EE',fontWeight:600}}>
                {user.role === 'admin' ? '⭐ Admin' : 'Member'}
              </span>
              {user.team && <TeamBadge team={user.team} />}
              {isAdmin && !isSelf && (
                <div style={{display:'inline-flex',alignItems:'center',gap:6,marginLeft:4}}>
                  <select
                    className="filter-input text-xs py-1"
                    style={{height:24,paddingTop:2,paddingBottom:2,minWidth:140}}
                    value={user.team||''}
                    disabled={savingTeam}
                    onChange={e => handleTeamChange(e.target.value)}>
                    <option value="">No team</option>
                    {Object.entries(TEAMS).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
                  </select>
                  {savingTeam && <span style={{fontSize:10,color:'#B8B4D4'}}>Saving…</span>}
                </div>
              )}
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:4}}>
              <a href={`mailto:${user.email}`} style={{fontSize:13,color:'#9590C0',textDecoration:'none',display:'flex',alignItems:'center',gap:6}}
                onMouseEnter={e=>e.currentTarget.style.color='#7A50F7'} onMouseLeave={e=>e.currentTarget.style.color='#9590C0'}>
                ✉️ {user.email}
              </a>
              {user.slack_handle && <div style={{fontSize:12,color:'#9590C0',display:'flex',alignItems:'center',gap:6}}>💬 Slack connected</div>}
            </div>
            <div style={{display:'flex',gap:16,marginTop:10,flexWrap:'wrap'}}>
              <div style={{fontSize:11,color:'#B8B4D4'}}>Member since {fmt.date(user.created_at)}</div>
              {user.last_login && <div style={{fontSize:11,color:'#B8B4D4'}}>Last active {fmt.timeAgo(user.last_login)}</div>}
            </div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:10,flexShrink:0}}>
            {[
              {label:'Assigned', value:myContractors.length, color:'#7A50F7'},
              {label:'Converted', value:totalConverted, color:'#34D399'},
              {label:'Open Tasks', value:myOpenTasks.length, color:'#5856B7'},
              {label:'Overdue', value:myOverdueTasks.length, color:myOverdueTasks.length>0?'#f87171':'#B8B4D4'},
            ].map(k => (
              <div key={k.label} style={{textAlign:'center',padding:'10px 16px',borderRadius:10,background:'#F5F4FA',border:'0.5px solid #E2DFEF'}}>
                <div style={{fontSize:20,fontWeight:700,color:k.color}}>{k.value}</div>
                <div style={{fontSize:10,color:'#9590C0'}}>{k.label}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Performance — admins and self only */}
      {canSeeMetrics ? (
        <div style={{display:'flex',flexDirection:'column',gap:16}}>

          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:12}}>
            {[
              {label:'This Week',          value:convertedThisWeek,  color:'#7A50F7', sub:'conversions'},
              {label:'This Month',         value:convertedThisMonth, color:'#602DF5', sub:'conversions'},
              {label:'All Time',           value:totalConverted,     color:'#5856B7', sub:'conversions'},
              {label:'Avg Days to Convert',value:avgDaysToConvert??'—', color:'#1A1630', sub:'days'},
              {label:'Interactions / Week',value:interactionsThisWeek, color:activityTrend>=0?'#34D399':'#f87171',
               sub:activityTrend>0?`↑ ${activityTrend} vs last week`:activityTrend<0?`↓ ${Math.abs(activityTrend)} vs last week`:'same as last week'},
            ].map(k => (
              <div key={k.label} className="card p-4">
                <div style={{fontSize:22,fontWeight:700,color:k.color,marginBottom:2}}>{k.value}</div>
                <div style={{fontSize:11,color:'#9590C0',marginBottom:2}}>{k.label}</div>
                <div style={{fontSize:10,color:'#B8B4D4'}}>{k.sub}</div>
              </div>
            ))}
          </div>

          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
            <div className="card p-5">
              <div style={{fontSize:13,fontWeight:600,color:'#1A1630',marginBottom:14}}>Conversion Funnel</div>
              <div style={{display:'flex',flexDirection:'column',gap:10}}>
                {funnel.map(({stage,count,rate}) => (
                  <div key={stage}>
                    <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                      <span style={{fontSize:12,color:'#9590C0'}}>{stage}</span>
                      <span style={{fontSize:12,fontWeight:600,color:'#602DF5'}}>{count} <span style={{color:'#B8B4D4',fontWeight:400}}>({rate}%)</span></span>
                    </div>
                    <div style={{height:6,background:'#E2DFEF',borderRadius:999,overflow:'hidden'}}>
                      <div style={{height:'100%',width:`${rate}%`,background:'linear-gradient(90deg,#602DF5,#7A50F7)',borderRadius:999,transition:'width .3s'}} />
                    </div>
                  </div>
                ))}
              </div>
            </div>
            <div className="card p-5">
              <div style={{fontSize:13,fontWeight:600,color:'#1A1630',marginBottom:14}}>Pipeline Breakdown</div>
              <div style={{display:'flex',flexDirection:'column',gap:8}}>
                {PIPELINE_STAGES.map(stage => (
                  <div key={stage} style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      <div style={{width:8,height:8,borderRadius:'50%',background:STAGE_COLORS[stage],flexShrink:0}} />
                      <span style={{fontSize:12,color:'#9590C0'}}>{stage}</span>
                    </div>
                    <span style={{fontSize:12,fontWeight:600,color:'#1A1630'}}>{byStage[stage]||0}</span>
                  </div>
                ))}
              </div>
              <button onClick={() => nav('/pipeline')}
                style={{width:'100%',marginTop:14,padding:'7px 0',borderRadius:8,fontSize:12,background:'#EEEDFE',color:'#602DF5',border:'0.5px solid #C4B8F7',cursor:'pointer',fontFamily:'Poppins,sans-serif'}}>
                View Full Pipeline →
              </button>
            </div>
          </div>

          {uncontacted.length > 0 && (
            <div className="card p-5">
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
                <div>
                  <div style={{fontSize:13,fontWeight:600,color:'#1A1630'}}>⚠️ Uncontacted Contractors</div>
                  <div style={{fontSize:11,color:'#9590C0',marginTop:2}}>Assigned but never contacted — falling through the cracks</div>
                </div>
                <span style={{fontSize:20,fontWeight:700,color:'#f59e0b'}}>{uncontacted.length}</span>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:6}}>
                {uncontacted.slice(0,5).map(c => {
                  const fin = CONTRACTOR_MAP.get(c.contractor_id) || {};
                  return (
                    <div key={c.contractor_id} onClick={() => nav('/contractor/'+c.contractor_id)}
                      style={{display:'flex',alignItems:'center',gap:10,padding:'8px 10px',borderRadius:8,background:'#FFFBF0',border:'0.5px solid #FFEEBA',cursor:'pointer'}}
                      onMouseEnter={e=>e.currentTarget.style.background='#FFF3CD'} onMouseLeave={e=>e.currentTarget.style.background='#FFFBF0'}>
                      <span style={{fontFamily:'monospace',fontSize:11,fontWeight:600,color:'#602DF5'}}>{c.contractor_id}</span>
                      <span style={{fontSize:12}}>{cflag(fin.country)}</span>

function ConversionLeaderboard() {
  const { conversions, users } = useCRM();
  const now = new Date();

  const thisMonthConversions = conversions.filter(c => {
    const d = new Date(c.converted_at);
    return d.getMonth() === now.getMonth() &&
           d.getFullYear() === now.getFullYear() &&
           c.attributed_to;
  });

  const byUser = thisMonthConversions.reduce((acc, c) => {
    if (!acc[c.attributed_to]) {
      acc[c.attributed_to] = { total: 0, byType: {} };
    }
    acc[c.attributed_to].total++;
    acc[c.attributed_to].byType[c.conversion_type] =
      (acc[c.attributed_to].byType[c.conversion_type] || 0) + 1;
    return acc;
  }, {});

  const ranked = Object.entries(byUser)
    .map(([userId, data]) => ({
      user: users.find(u => u.id === userId),
      ...data,
    }))
    .filter(r => r.user)
    .sort((a, b) => b.total - a.total);

  if (ranked.length === 0) return (
    <div className="card p-5" style={{marginBottom:20,textAlign:'center',color:'#9590C0',fontSize:13}}>
      No conversions this month yet — sync from My Day to check for new ones
    </div>
  );

  const medalColors = [
    'linear-gradient(135deg,#F59E0B,#FCD34D)',
    'linear-gradient(135deg,#9CA3AF,#D1D5DB)',
    'linear-gradient(135deg,#B45309,#D97706)',
  ];

  return (
    <div className="card p-5" style={{marginBottom:20}}>
      <div style={{fontSize:13,fontWeight:600,color:'#1A1630',marginBottom:14,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <span>🏆 Leaderboard — {now.toLocaleString('default',{month:'long',year:'numeric'})}</span>
        <span style={{fontSize:11,color:'#B8B4D4',fontWeight:400}}>
          {thisMonthConversions.length} total conversions
        </span>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        {ranked.map((r, i) => (
          <div key={r.user.id} style={{
            display:'flex',alignItems:'center',gap:12,
            padding:'10px 12px',borderRadius:8,
            background: i === 0 ? '#FFFBF0' : '#FAFAFA',
            border: i === 0 ? '0.5px solid #FFEEBA' : '0.5px solid #E2DFEF',
          }}>
            <div style={{
              width:28,height:28,borderRadius:'50%',flexShrink:0,
              background: i < 3 ? medalColors[i] : '#E2DFEF',
              display:'flex',alignItems:'center',justifyContent:'center',
              fontSize:12,fontWeight:700,
              color: i < 3 ? '#FFFFFF' : '#9590C0',
            }}>
              {i + 1}
            </div>
            <Avatar user={r.user} />
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:12,fontWeight:600,color:'#1A1630',marginBottom:4}}>
                {r.user.name}
              </div>
              <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                {Object.entries(r.byType).map(([type, count]) => (
                  <span key={type} style={{fontSize:9,padding:'2px 6px',borderRadius:4,fontWeight:600,background:'#EEEDFE',color:'#3C3489'}}>
                    {type.replace(/_/g,' ')} ×{count}
                  </span>
                ))}
              </div>
            </div>
            <div style={{fontSize:24,fontWeight:700,color:'#7A50F7',flexShrink:0,minWidth:32,textAlign:'right'}}>
              {r.total}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function TeamView() {
  const { users, contractors, tasks, currentUser, addUser, deactivateUser, promoteUser, loading } = useCRM();

  const nav = useNavigate(); // must be before any conditional returns
  const [showAdd, setShowAdd] = useState(false);
  const [name,setName]=useState('');
  const [email,setEmail]=useState('');
  const [saving,setSaving]=useState(false);
  const [confirmDeactivate, setConfirmDeactivate] = useState(null); // user object to deactivate
  const isAdmin = currentUser?.role === 'admin';

  const today = new Date().toISOString().slice(0,7); // YYYY-MM for "this month"

  const userStats = useMemo(()=>{
    return users.map(u=>{
      const assigned = Object.entries(contractors).flatMap(([,teams])=>Object.values(teams)).filter(c=>c.assigned_to===u.id);
      const myTasks = tasks.filter(t=>t.assigned_to===u.id&&!t.is_completed);
      const overdue = myTasks.filter(t=>isOverdue(t));
      const conversions = assigned.filter(c=>c.pipeline_stage==='Converted');
      const thisMonth = conversions.filter(c=>c.dat_stage_changed?.startsWith(today));
      return { user:u, assigned:assigned.length, openTasks:myTasks.length, overdue:overdue.length, conversions:conversions.length, thisMonth:thisMonth.length };
    });
  }, [users,contractors,tasks]);

  const allTasks = tasks.filter(t=>!t.is_completed).sort((a,b)=>{
    const ao=isOverdue(a)?0:1, bo=isOverdue(b)?0:1;

    return new Date(a.due_date||'9999')-new Date(b.due_date||'9999');

    e.preventDefault();

            onMouseEnter={e => e.currentTarget.style.boxShadow='0 4px 16px rgba(96,45,245,0.15)'}
            onMouseLeave={e => e.currentTarget.style.boxShadow=''}>
            <div className="flex items-start gap-3 mb-4">

                <div className="font-semibold text-sm truncate" style={{color:'#1A1630'}}>{user.name}</div>
                <div className="text-xs truncate" style={{color:'#9590C0'}}>{user.email}</div>
                <div className="flex items-center gap-2 mt-1">
                  {currentUser?.id===user.id && (

                    {user.role==='admin'?'⭐ Admin':'Member'}

                  {user.team && <TeamBadge team={user.team} />}

            </div>
            <div className="grid grid-cols-2 gap-2 mb-3">

            <div className="flex gap-3">
              <button onClick={()=>setConfirmDeactivate(null)}

          <div className="space-y-2">
            {allTasks.slice(0,20).map(t=>{
              const assignee = users.find(u=>u.id===t.assigned_to);

              return (
                <div key={t.id} className={`flex items-center gap-3 text-xs p-3 rounded-lg ${overdue?'border-red-900/50 bg-red-900/10':''}`} style={overdue?{}:{border:'0.5px solid #E2DFEF',background:'#FAFAFA'}}>

                  <span className="capitalize flex-1" style={{color:'#9590C0'}}>{t.type?.replace('_',' ')}</span>

                </div>

      {/* Add user modal */}
      <Modal open={showAdd} onClose={()=>setShowAdd(false)} title="Add Team Member">
        <form onSubmit={handleAdd} className="space-y-4">

// ─── TASKS VIEW ─────────────────────────────────────────────────────────────
function TasksView() {
  const { tasks, users, currentUser, toggleTask, loading, contractors } = useCRM();
  const [filterAssignee, setFilterAssignee] = useState('all');
  const [filterDue, setFilterDue] = useState('all');
  const [filterType, setFilterType] = useState('');
  const [filterTeam, setFilterTeam] = useState('');
  const [filterSegment, setFilterSegment] = useState('');
  const [selected, setSelected] = useState(new Set());

  const today = new Date().toDateString();
  const endOfWeek = new Date(); endOfWeek.setDate(endOfWeek.getDate()+(7-endOfWeek.getDay()));

  const filtered = useMemo(()=>{
    let d = tasks.filter(t=>!t.is_completed);
    if (filterAssignee==='me' && currentUser) d=d.filter(t=>t.assigned_to===currentUser.id);
    else if (filterAssignee!=='all') d=d.filter(t=>t.assigned_to===filterAssignee);
    if (filterDue==='today') d=d.filter(t=>t.due_date&&new Date(t.due_date).toDateString()===today);
    else if (filterDue==='week') d=d.filter(t=>t.due_date&&new Date(t.due_date)<=endOfWeek);
    else if (filterDue==='overdue') d=d.filter(t=>isOverdue(t));
    if (filterType) d=d.filter(t=>t.type===filterType);
    if (filterTeam) d=d.filter(t=>{
      const fin=CONTRACTOR_MAP.get(t.contractor_id)||{};
      return primaryTeam(fin)===filterTeam;
    });
    if (filterSegment) d=d.filter(t=>{
      const rec=getBestContractorRecord(contractors,t.contractor_id);
      return rec?.upsell_segment===filterSegment;
    });
    return d.sort((a,b)=>{
      const ao=isOverdue(a)?0:1, bo=isOverdue(b)?0:1;
      if(ao!==bo) return ao-bo;
      return new Date(a.due_date||'9999')-new Date(b.due_date||'9999');
    });
  }, [tasks,filterAssignee,filterDue,filterType,filterTeam,filterSegment,currentUser,contractors]);

  const toggleSelect = id => setSelected(s=>{ const n=new Set(s); n.has(id)?n.delete(id):n.add(id); return n; });
  async function bulkComplete() {
    for (const id of selected) await toggleTask(id);
    setSelected(new Set());
  }

  if (loading) return <div className="p-8 text-slate-500">Loading…</div>;

  return (
    <div className="p-6 max-w-screen-xl mx-auto">
      <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
        <h2 className="text-xl font-bold text-white">Tasks</h2>
        <div className="flex items-center gap-2 flex-wrap">
          <select className="filter-input text-xs py-1.5" value={filterAssignee} onChange={e=>setFilterAssignee(e.target.value)}>
            <option value="all">All People</option>
            <option value="me">Assigned to Me</option>
            {users.map(u=><option key={u.id} value={u.id}>{u.name}</option>)}
          </select>
          <select className="filter-input text-xs py-1.5" value={filterDue} onChange={e=>setFilterDue(e.target.value)}>
            <option value="all">All Due Dates</option>
            <option value="overdue">Overdue</option>
            <option value="today">Today</option>
            <option value="week">This Week</option>
          </select>
          <select className="filter-input text-xs py-1.5" value={filterType} onChange={e=>setFilterType(e.target.value)}>
            <option value="">All Types</option>
            {['follow_up','pitch','check_in'].map(t=><option key={t} value={t}>{t.replace('_',' ')}</option>)}
          </select>
          <select className="filter-input text-xs py-1.5" value={filterTeam} onChange={e=>setFilterTeam(e.target.value)}>
            <option value="">All Teams</option>
            {Object.entries(TEAMS).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}
          </select>
          <select className="filter-input text-xs py-1.5" value={filterSegment} onChange={e=>setFilterSegment(e.target.value)}>
            <option value="">All Segments</option>
            {Object.entries(SEG_CFG).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}
          </select>
          {selected.size>0 && (
            <button onClick={bulkComplete} className="px-3 py-1.5 rounded-lg bg-teal-700 text-white text-xs font-medium">
              ✓ Complete {selected.size} selected
            </button>
          )}
        </div>
      </div>

      <div className="text-xs text-slate-500 mb-3">{filtered.length} open task{filtered.length!==1?'s':''}</div>

      <div className="card overflow-hidden">
        <table className="w-full text-sm">
          <thead>
            <tr className="border-b border-slate-700/50">
              <th className="w-8 p-3"><input type="checkbox" onChange={e=>{
                if(e.target.checked) setSelected(new Set(filtered.map(t=>t.id)));
                else setSelected(new Set());
              }} className="accent-teal-500" /></th>
              {['Contractor','Type','Notes','Due Date','Assignee',''].map(h=>(
                <th key={h} className="text-left px-3 py-2.5 text-slate-400 text-xs uppercase tracking-wide font-medium">{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.map(t=>{
              const overdue=isOverdue(t);
              const assignee=users.find(u=>u.id===t.assigned_to);
              return (
                <tr key={t.id} className={`border-b border-slate-800/50 hover:bg-slate-800/30 ${overdue?'bg-red-900/10':''}`}>
                  <td className="p-3"><input type="checkbox" checked={selected.has(t.id)} onChange={()=>toggleSelect(t.id)} className="accent-teal-500" /></td>
                  <td className="px-3 py-2.5">
                    <Link to={'/contractor/'+t.contractor_id} className="font-mono text-teal-400 text-xs hover:underline">{t.contractor_id}</Link>
                  </td>
                  <td className="px-3 py-2.5 text-slate-300 capitalize text-xs">{t.type?.replace('_',' ')}</td>
                  <td className="px-3 py-2.5 text-slate-400 text-xs max-w-xs truncate">{t.note||'—'}</td>
                  <td className="px-3 py-2.5">
                    {t.due_date
                      ? <span className={`text-xs ${overdue?'text-red-400 font-semibold':'text-slate-400'}`}>{overdue?'⚠️ ':''}{fmt.date(t.due_date)}</span>
                      : <span className="text-slate-600">—</span>}
                  </td>
                  <td className="px-3 py-2.5">{assignee?<div className="flex items-center gap-1.5"><Avatar user={assignee} /><span className="text-xs text-slate-400">{assignee.name}</span></div>:<span className="text-slate-600 text-xs">Unassigned</span>}</td>
                  <td className="px-3 py-2.5">
                    <button onClick={()=>toggleTask(t.id)} className="text-xs px-2 py-1 rounded border border-slate-700 text-slate-400 hover:border-teal-700 hover:text-teal-400">Done</button>
                  </td>
                </tr>
              );
            })}
            {filtered.length===0 && (
              <tr><td colSpan={7} className="px-3 py-10 text-center text-slate-600">No tasks match the current filters.</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ─── CMD+K SEARCH ──────────────────────────────────────────────────────────
function CmdKSearch({ open, onClose }) {
  const nav = useNavigate();
  const { contractors } = useCRM();
  const [q, setQ] = useState('');
  const [selected, setSelected] = useState(0);
  const inputRef = useRef(null);

  // Search across CONTRACTOR_MAP + CONTRACTOR_CONTACTS
  const results = useMemo(() => {
    if (!q || q.length < 2) return [];
    const query = q.toLowerCase();
    const matches = [];
    const contacts = CONTACTS_LOOKUP;
    for (const [id, fin] of CONTRACTOR_MAP) {
      if (matches.length >= 10) break;
      const contact = contacts[id] || [];
      const name = (contact[0] || '').toLowerCase();
      const email = (contact[1] || '').toLowerCase();
      const country = (fin.country || '').toLowerCase();
      const company = (fin.company || '').toLowerCase();
      if (id.toLowerCase().includes(query) || name.includes(query) || email.includes(query) || country.includes(query) || company.includes(query)) {
        const inPipeline = isInPipeline(contractors, id);
        const bestRec = getBestContractorRecord(contractors, id);
        let seg = 'COLD';
        if (bestRec) seg = bestRec.upsell_segment || 'COLD';
        else if (fin.contract_state === 'ENDED' || fin.contract_state === 'DELETED') seg = 'GLOBAL_ACCOUNT';
        else if (!fin.is_reserve) seg = 'RESERVE';
        else if (!fin.ff_net || fin.ff_net <= 0) seg = 'FUTURE_FUND';
        matches.push({
          id, name: contact[0] || id, country: fin.country, company: fin.company || null,
          score: computeLeadScore(fin), segment: seg, inPipeline,
        });
      }
    }
    return matches;
  }, [q, contractors]);

  useEffect(() => { setSelected(0); }, [q]);
  useEffect(() => {
    if (open && inputRef.current) inputRef.current.focus();
  }, [open]);

  // Keyboard handler
  useEffect(() => {
    if (!open) return;
    function handler(e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); setSelected(s => Math.min(s + 1, results.length - 1)); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); setSelected(s => Math.max(s - 1, 0)); }
      else if (e.key === 'Enter' && results[selected]) { onClose(); nav('/contractor/' + results[selected].id); }
      else if (e.key === 'Escape') { onClose(); }
    }
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [open, results, selected]);

  if (!open) return null;

  return (
    <div className="modal-overlay" style={{alignItems:'flex-start',paddingTop:'15vh'}} onClick={e => e.target === e.currentTarget && onClose()}>
      <div style={{background:'rgba(88,86,183,0.08)',border:'1px solid rgba(122,80,247,0.2)',borderRadius:'16px',maxWidth:'580px',width:'100%',overflow:'hidden'}}>
        <div className="flex items-center gap-3 px-4 py-3 border-b border-slate-700/50">
          <span className="text-slate-500">🔍</span>
          <input ref={inputRef} className="flex-1 bg-transparent outline-none text-sm text-slate-200 placeholder-slate-600"
            placeholder="Search by name, ID, email, or country…"
            value={q} onChange={e => setQ(e.target.value)} />
          <kbd className="text-[10px] bg-slate-800 px-1.5 py-0.5 rounded text-slate-600">ESC</kbd>
        </div>
        {q.length >= 2 && (
          <div className="max-h-80 overflow-y-auto">
            {results.length === 0 ? (
              <div className="px-4 py-6 text-center text-sm text-slate-600">No contractors found for "{q}"</div>
            ) : results.map((r, i) => (
              <div key={r.id}
                onClick={() => { onClose(); nav('/contractor/' + r.id); }}
                className={`flex items-center gap-3 px-4 py-3 cursor-pointer transition-colors ${i === selected ? 'bg-teal-900/30' : 'hover:bg-slate-800/50'}`}>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2">
                    <span className="text-sm font-medium text-white truncate">{r.name}</span>
                    <span className="font-mono text-xs text-slate-500">{r.id}</span>
                  </div>
                  <div className="flex items-center gap-2 mt-0.5">
                    <span className="text-xs text-slate-500">{cflag(r.country)} {r.country}</span>
                    {r.company && <span className="text-xs text-slate-600">🏢 {r.company}</span>}
                  </div>
                </div>
                <SegBadge segment={r.segment} />
                <ScoreBadge score={r.score} />
                {r.inPipeline
                  ? <span className="text-xs text-teal-500/60 shrink-0">In Pipeline</span>
                  : <span className="text-xs text-slate-600 shrink-0">Not in Pipeline</span>
                }
              </div>
            ))}
          </div>
        )}
        {q.length < 2 && (
          <div className="px-4 py-6 text-center text-xs text-slate-600">Type at least 2 characters to search across {CONTRACTOR_MAP.size.toLocaleString()} contractors</div>
        )}
      </div>
    </div>
  );
}

// ─── INSIGHTS VIEW ──────────────────────────────────────────────────────────
function InsightsView() {
  const { opportunities } = useCRM();

  // Aggregate opportunity pool from full CONTRACTOR_MAP
  const analysis = useMemo(() => {
    const products = Object.keys(PRODUCT_CATALOG);
    const byProduct = {};
    products.forEach(p => {
      byProduct[p] = { total: 0, high: 0, medium: 0, low: 0, evPool: 0, evSamples: [], covered: 0 };
    });

    const openOppSet = {}; // contractor_id+product → true
    (opportunities || []).forEach(o => {
      if (!o.closed_at) openOppSet[`${o.contractor_id}|${o.product}`] = true;
    });

    for (const [id, fin] of CONTRACTOR_MAP) {
      const opps = detectOpportunities(fin);
      opps.forEach(({ product, quality }) => {
        const b = byProduct[product];
        if (!b) return;
        b.total++;
        b[quality] = (b[quality] || 0) + 1;
        const ev = computeExpectedValue(product, fin);
        b.evPool += ev;
        if (b.evSamples.length < 5000) b.evSamples.push(ev);
        if (openOppSet[`${id}|${product}`]) b.covered++;
      });
    }

    return products.map(p => {
      const b = byProduct[p];
      const cat = PRODUCT_CATALOG[p];
      const avgEV = b.total > 0 ? b.evPool / b.total : 0;
      const coveragePct = b.total > 0 ? (b.covered / b.total * 100) : 0;
      return { product: p, cat, ...b, avgEV, coveragePct };
    }).sort((a, b) => b.evPool - a.evPool);
  }, [opportunities]);

  // Cross-segment breakdown: active vs inactive, by product
  const segmentMatrix = useMemo(() => {
    const rows = [];
    for (const [id, fin] of CONTRACTOR_MAP) {
      const isActive = fin.has_active_contract ?? true;
      const engLevel = fin.engagement_level || 'Unknown';
      const opps = detectOpportunities(fin);
      opps.forEach(({ product, quality }) => {
        const ev = computeExpectedValue(product, fin);
        rows.push({ product, isActive, engLevel, quality, ev, id });
      });
    }

    // Group by product × active/inactive — store IDs for drilldown
    const matrix = {};
    rows.forEach(r => {
      const key = `${r.product}|${r.isActive ? 'active' : 'inactive'}`;
      if (!matrix[key]) matrix[key] = { count: 0, evPool: 0, highCount: 0, ids: [], rows: [] };
      matrix[key].count++;
      matrix[key].evPool += r.ev;
      if (r.quality === 'high') matrix[key].highCount++;
      matrix[key].ids.push(r.id);
      matrix[key].rows.push(r);
    });
    // Sort each pool's rows by EV desc
    Object.values(matrix).forEach(m => m.rows.sort((a, b) => b.ev - a.ev));
    return matrix;
  }, []);

  // Engagement signal breakdown — top insight per product
  const engagementInsights = useMemo(() => {
    const insights = {};
    for (const [id, fin] of CONTRACTOR_MAP) {
      const opps = detectOpportunities(fin);
      opps.forEach(({ product, quality }) => {
        if (quality !== 'high') return;
        if (!insights[product]) insights[product] = { wallet: 0, comp: 0, spend: 0, count: 0 };
        const b = insights[product];
        b.wallet += fin.wallet || 0;
        b.comp += fin.comp || 0;
        b.spend += fin.card_spend || 0;
        b.count++;
      });
    }
    return insights;
  }, []);

  const fmt2 = (n) => n >= 1000000 ? `$${(n/1000000).toFixed(1)}M` : n >= 1000 ? `$${(n/1000).toFixed(0)}K` : `$${n.toFixed(0)}`;
  const [showLegend, setShowLegend] = useState(false);
  const [openPool, setOpenPool] = useState(null); // { product, seg, rows, ids }
  const totalPool = analysis.reduce((s, a) => s + a.evPool, 0);

  return (
    <div className="p-6 max-w-screen-xl mx-auto">
      <div className="mb-6">
        <h2 className="text-xl font-bold mb-1" style={{ color:'#1A1630' }}>Opportunity Intelligence</h2>
        <p className="text-xs" style={{ color:'#9590C0' }}>
          Aggregated across {fmt.number(CONTRACTOR_MAP.size)} contractors · Total addressable EV pool: <strong style={{ color:'#602DF5' }}>{fmt2(totalPool)}/yr</strong>
        </p>
      </div>

      {/* Concept legend */}
      <div className="card mb-6" style={{ background:'#F5F4FA', border:'0.5px solid #E2DFEF', overflow:'hidden' }}>
        <button onClick={() => setShowLegend(v => !v)}
          style={{ width:'100%', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'12px 16px', background:'none', border:'none', cursor:'pointer', fontFamily:'Poppins,sans-serif' }}>
          <span style={{ fontSize:11, fontWeight:600, color:'#9590C0', letterSpacing:'0.05em', textTransform:'uppercase' }}>How to read this page</span>
          <span style={{ fontSize:12, color:'#9590C0', transition:'transform .2s', display:'inline-block', transform: showLegend ? 'rotate(180deg)' : 'rotate(0deg)' }}>▾</span>
        </button>
        {showLegend && (
          <div style={{ padding:'0 16px 16px', display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))', gap:10 }}>
            {[
              { term:'EV (Expected Value)', color:'var(--accent)', desc:`Estimated annual revenue ${CLIENT_CONFIG.brand.name} earns if this lead fully adopts the product — based on their data.` },
              { term:'WV (Weighted Value)', color:'#7A50F7', desc:'EV × stage probability. Accounts for the chance of converting. Used to size and prioritize the pipeline.' },
              { term:'EV Pool', color:'#602DF5', desc:'Sum of EV across all qualifying contractors for this product. The total annual revenue opportunity if everyone converted.' },
              { term:'Avg EV', color:'#1A1630', desc:'Average expected value per contractor. High avg EV means each individual deal is more valuable.' },

              { term:'Quality (High / Med / Low)', color:'#16A34A', desc:'Conversion likelihood based on financial signals. High = strong wallet or comp signals. Low = fits criteria but weaker signals.' },
              { term:'Pipeline Coverage', color:'#602DF5', desc:'% of candidates who already have an open opportunity in CRM. Low coverage = untapped pool the team should prioritize.' },
              { term:'Margin note', color:'#9590C0', desc:'Whether this product makes money per conversion. Some products (Card, Reserve) are strategic loss-leaders that unlock higher-value products.' },

                  <td style={{ padding:'10px 14px' }}>
                    <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                      <div style={{ width:48, height:4, borderRadius:4, background:'#F0EEF8', overflow:'hidden' }}>
                        <div style={{ height:'100%', width:`${a.coveragePct}%`, background:'#602DF5', borderRadius:4 }} />
                      </div>
                      <span style={{ color: a.coveragePct < 5 ? '#EF4444' : a.coveragePct < 20 ? '#F59E0B' : '#16A34A', fontWeight:600, fontSize:11 }}>
                        {a.coveragePct.toFixed(0)}%
                      </span>
                    </div>
                  </td>
                  <td style={{ padding:'10px 14px', fontSize:10, color:'#9590C0', maxWidth:200 }}>{a.cat.netMarginNote}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* Key takeaways */}
      <div>
        <h3 className="text-sm font-semibold mb-3" style={{ color:'#1A1630' }}>Key takeaways</h3>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))', gap:12 }}>
          {(() => {
            const sorted = [...analysis].sort((a,b) => b.evPool - a.evPool);
            const top = sorted[0];
            const mostHigh = [...analysis].sort((a,b) => b.high - a.high)[0];
            const lowestCoverage = [...analysis].filter(a => a.total > 100).sort((a,b) => a.coveragePct - b.coveragePct)[0];
            const highestAvg = [...analysis].sort((a,b) => b.avgEV - a.avgEV)[0];
            const takeaways = [
              {
                icon:'🏆',
                title:`${top?.product} has the largest EV pool`,
                body:`${fmt2(top?.evPool || 0)} in addressable annual revenue across ${fmt.number(top?.total || 0)} candidates. This is where volume wins.`,
              },
              {
                icon:'🎯',
                title:`${mostHigh?.product} has the most high-quality targets`,
                body:`${fmt.number(mostHigh?.high || 0)} high-quality candidates — these are most likely to convert and should be prioritized first.`,
              },
              {
                icon:'⚡',
                title:`${highestAvg?.product} has the highest avg value per contractor`,
                body:`At ${fmt2(highestAvg?.avgEV || 0)}/yr per contractor, each converted deal here moves the needle more than other products.`,
              },
              lowestCoverage && {
                icon:'🚨',
                title:`${lowestCoverage.product} has low pipeline coverage (${lowestCoverage.coveragePct.toFixed(0)}%)`,
                body:`Only ${lowestCoverage.covered} of ${fmt.number(lowestCoverage.total)} identified candidates have an open opportunity. Large untapped pool.`,
              },
            ].filter(Boolean);
            return takeaways.map((t, i) => (
              <div key={i} className="card p-4" style={{ display:'flex', gap:12, alignItems:'flex-start' }}>
                <span style={{ fontSize:20, flexShrink:0 }}>{t.icon}</span>
                <div>
                  <div style={{ fontSize:12, fontWeight:600, color:'#1A1630', marginBottom:4 }}>{t.title}</div>
                  <div style={{ fontSize:11, color:'#9590C0', lineHeight:1.6 }}>{t.body}</div>
                </div>
              </div>
            ));
          })()}
        </div>
      </div>

      {/* Pool drilldown modal */}
      {openPool && <PoolModal pool={openPool} fmt2={fmt2} onClose={() => setOpenPool(null)} />}
    </div>
  );
}

function PoolModal({ pool, fmt2, onClose }) {
  const { saveAudience, currentUser } = useCRM();

  const toast = useToast();
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(null); // saved audience id
  const [page, setPage] = useState(0);
  const PER_PAGE = 50;

  const cat = PRODUCT_CATALOG[pool.product] || {};
  const title = `${pool.product} — ${pool.seg === 'active' ? 'Active' : 'Inactive'} contractors`;
  const totalPages = Math.ceil(pool.rows.length / PER_PAGE);
  const pageRows = pool.rows.slice(page * PER_PAGE, (page + 1) * PER_PAGE);

  async function handleSaveAudience() {
    setSaving(true);
    const audienceName = `${pool.product} · ${pool.seg === 'active' ? 'Active' : 'Inactive'} Pool`;
    const rec = {
      name: audienceName,
      description: `Auto-generated from Opportunity Intelligence — ${pool.rows.length} ${pool.seg} contractors qualifying for ${pool.product}.`,
      audience_type: 'static',

function LeadsDatabase({ teamFilter }) {
  const { contractors, users, currentUser, addToPipeline, interactions, audiences } = useCRM();

  const [search, setSearch] = useState('');
